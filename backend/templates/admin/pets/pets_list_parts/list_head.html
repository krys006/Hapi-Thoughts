{% comment %}
  Heading above the list when not searching: the open tab's name and
  count, and its sort order on the right.
{% endcomment %}
<div class="mb-2 flex flex-wrap items-baseline justify-between gap-2">
  {% if active_tab == "archived" %}
    <h2 class="text-lg font-semibold text-gray-900">Archived pets <span class="font-normal text-gray-600">({{ archived_count }})</span></h2>
  {% else %}
    <h2 class="text-lg font-semibold text-gray-900">Active pets <span class="font-normal text-gray-600">({{ active_count }})</span></h2>
  {% endif %}
  <p class="text-sm text-gray-600">A to Z by pet name</p>
</div>
