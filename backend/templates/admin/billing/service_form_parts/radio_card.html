{% comment %}
  One radio card of the service form (card from ServiceForm.pricing_cards or
  status_cards: id, value, label, text, checked). A checked card is styled by
  CSS alone (has-[:checked]), the keyboard focus ring by has-[:focus-visible].
  Needs name (the input's name).
{% endcomment %}
<label for="{{ card.id }}" class="flex min-h-11 cursor-pointer items-start gap-4 rounded-lg border-2 border-gray-200 bg-white p-4 hover:border-violet-300 has-[:checked]:border-violet-600 has-[:checked]:bg-violet-50 has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-violet-600 has-[:focus-visible]:ring-offset-2">
  <input type="radio" name="{{ name }}" id="{{ card.id }}" value="{{ card.value }}" class="mt-0.5 size-6 shrink-0 accent-violet-600"{% if card.checked %} checked{% endif %}>
  <span>
    <span class="block text-base font-semibold text-gray-900">{{ card.label }}</span>
    <span class="block text-sm text-gray-700">{{ card.text }}</span>
  </span>
</label>
