{% comment %}
  Tabs between Receipts and Services (services have no sidebar item of
  their own). Param: active = "receipts" or "services".
{% endcomment %}
<nav class="mb-6 flex gap-1 border-b border-gray-200" aria-label="Billing sections">
  <a href="{% url 'admin_receipt_list' %}" class="-mb-px inline-flex min-h-11 items-center border-b-2 px-4 text-base {% if active == 'receipts' %}border-violet-600 font-semibold text-violet-800{% else %}border-transparent text-gray-700 hover:text-gray-900{% endif %}"{% if active == 'receipts' %} aria-current="page"{% endif %}>Receipts</a>
  <a href="{% url 'admin_service_list' %}" class="-mb-px inline-flex min-h-11 items-center border-b-2 px-4 text-base {% if active == 'services' %}border-violet-600 font-semibold text-violet-800{% else %}border-transparent text-gray-700 hover:text-gray-900{% endif %}"{% if active == 'services' %} aria-current="page"{% endif %}>Services and prices</a>
</nav>
