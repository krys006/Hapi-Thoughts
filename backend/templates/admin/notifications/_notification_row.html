{% load friendly_dates %}
{# One notification; the whole row opens it (marks it read and goes to the related page) #}
<li><a href="{% url 'notification_open' notification.pk %}" class="flex gap-3 px-5 py-4 hover:bg-gray-50{% if not notification.is_read %} bg-violet-50{% endif %}"><span class="mt-2 size-2.5 shrink-0 rounded-full{% if not notification.is_read %} bg-violet-600{% endif %}" aria-hidden="true"></span><span class="min-w-0 flex-1"><span class="block text-base text-gray-900{% if not notification.is_read %} font-semibold{% endif %}">{{ notification.title }}</span><span class="mt-0.5 block text-base text-gray-700">{{ notification.message }}</span><span class="mt-1 block text-sm text-gray-600">{{ notification.created_at|friendly_datetime }}{% if not notification.is_read %} · <span class="font-medium text-violet-700">New</span>{% endif %}</span></span></a></li>
