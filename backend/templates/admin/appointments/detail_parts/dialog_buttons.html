{% comment %}
  Bottom row of a detail-page dialog: "Go back" (gets focus first, the
  safe choice) and the submit button.
  Usage: {% include "admin/appointments/detail_parts/dialog_buttons.html" with label="Yes, approve request" icon="check" danger=False %}
{% endcomment %}
<div class="mt-6 flex flex-wrap justify-end gap-3">
  <button type="button" class="btn btn-outline min-h-12 px-5 font-semibold" data-dialog-close autofocus>Go back</button>
  <button type="submit" class="btn {% if danger %}btn-danger{% else %}btn-primary{% endif %} min-h-12 px-5 font-semibold">
    {% include "components/icon.html" with name=icon %}
    {{ label }}
  </button>
</div>
