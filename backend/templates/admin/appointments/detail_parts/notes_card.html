{# Internal notes: clinic only, never shown on owner pages #}
<section class="card" aria-labelledby="notes-title">
  <div class="mb-1 flex flex-wrap items-center gap-3">
    <h2 id="notes-title" class="text-xl font-semibold">Internal notes</h2>
    <span class="inline-flex items-center gap-1.5 rounded-full bg-gray-100 px-3 py-1 text-sm font-medium text-gray-800">
      {% include "components/icon.html" with name="lock" class="size-4 shrink-0" %}
      Clinic only
    </span>
  </div>
  <p id="notes-help" class="mb-3 text-base text-gray-600">Only the clinic can see these. The pet owner never sees them.</p>
  <form method="post" action="{% url 'admin_appointment_notes' appointment.pk %}">
    {% csrf_token %}
    <div class="form-field">
      <label for="{{ notes_form.notes.id_for_label }}" class="sr-only">Internal notes</label>
      {{ notes_form.notes }}
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-outline">Save notes</button>
    </div>
  </form>
</section>
