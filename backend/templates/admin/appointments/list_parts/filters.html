{% comment %}
  Search form. Sends only q and date (no status): a search looks in every
  status and the view shows the "All" tab.
{% endcomment %}
<form method="get" action="{% url 'admin_appointments' %}" class="mb-4 flex flex-wrap items-end gap-3" role="search">
  <div class="min-w-60 flex-1">
    <label for="list-search" class="mb-1.5 block text-base font-medium text-gray-800">Search appointments</label>
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-600">
        {% include "components/icon.html" with name="search" %}
      </span>
      <input id="list-search" type="search" name="q" value="{{ q }}" placeholder="For example: Brownie or Liza Cruz" class="input min-h-12 pl-10">
    </div>
  </div>
  <div class="w-full sm:w-52">
    <label for="list-date" class="mb-1.5 block text-base font-medium text-gray-800">Date</label>
    <input id="list-date" type="date" name="date" value="{{ date_filter|date:'Y-m-d' }}" class="input min-h-12">
  </div>
  <button type="submit" class="btn btn-outline min-h-12 font-semibold">{% include "components/icon.html" with name="search" %}Search</button>
  {% if is_searching %}
    <a href="{% url 'admin_appointments' %}" class="inline-flex min-h-12 items-center gap-2 px-2 text-base font-medium text-blue-600 underline underline-offset-2">{% include "components/icon.html" with name="x" %}Clear search</a>
  {% endif %}
</form>
