<!-- Admin dashboard calendar widget — month/week grid with nav controls. -->
<!-- Self-contained: nav/toggle clicks re-fetch and swap this whole block. -->
<!-- Clicking a day fetches the day panel separately into #calendar-day-panel, -->
<!-- defined in the parent dashboard template. -->

<div id="admin-calendar-grid">

  <!-- Calendar Header -->
  <div
    class="calendar-header flex flex-col gap-4 mb-6 md:flex-row md:items-center md:justify-between">

    <!-- Navigation -->
    <div class="calendar-nav flex flex-wrap gap-2">

      <button
        hx-get="{% url 'admin_appointment_calendar_grid' %}?view={{ calendar_view }}&date={{ calendar_prev_date|date:'Y-m-d' }}"
        hx-target="#admin-calendar-grid"
        hx-swap="outerHTML"
        class="calendar-nav-button px-4 py-2 text-sm font-medium text-white bg-white/10 border border-white/20 rounded-xl backdrop-blur-md transition hover:bg-white/20">
        Previous
      </button>

      <button
        hx-get="{% url 'admin_appointment_calendar_grid' %}?view={{ calendar_view }}&date={{ calendar_today_date|date:'Y-m-d' }}"
        hx-target="#admin-calendar-grid"
        hx-swap="outerHTML"
        class="calendar-nav-button px-4 py-2 text-sm font-medium text-white bg-white/10 border border-white/20 rounded-xl backdrop-blur-md transition hover:bg-white/20">
        Today
      </button>

      <button
        hx-get="{% url 'admin_appointment_calendar_grid' %}?view={{ calendar_view }}&date={{ calendar_next_date|date:'Y-m-d' }}"
        hx-target="#admin-calendar-grid"
        hx-swap="outerHTML"
        class="calendar-nav-button px-4 py-2 text-sm font-medium text-white bg-white/10 border border-white/20 rounded-xl backdrop-blur-md transition hover:bg-white/20">
        Next
      </button>

    </div>

    <!-- Month / Week Label -->
    <p
      class="calendar-period-label text-2xl md:text-3xl font-bold text-white text-center">
      {{ calendar_period_label }}
    </p>

    <!-- View Toggle -->
    <div class="calendar-view-toggle flex gap-2">

      <button
        hx-get="{% url 'admin_appointment_calendar_grid' %}?view=month&date={{ anchor_date|date:'Y-m-d' }}"
        hx-target="#admin-calendar-grid"
        hx-swap="outerHTML"
        class="calendar-toggle-button px-4 py-2 text-sm font-medium text-white rounded-xl transition hover:bg-white/10 {% if calendar_view == 'month' %}calendar-toggle-active bg-white/20{% endif %}">
        Month
      </button>

      <button
        hx-get="{% url 'admin_appointment_calendar_grid' %}?view=week&date={{ anchor_date|date:'Y-m-d' }}"
        hx-target="#admin-calendar-grid"
        hx-swap="outerHTML"
        class="calendar-toggle-button px-4 py-2 text-sm font-medium text-white rounded-xl transition hover:bg-white/10 {% if calendar_view == 'week' %}calendar-toggle-active bg-white/20{% endif %}">
        Week
      </button>

    </div>

  </div>
  <!-- end calendar-header -->

  <!-- Weekday Header -->
  <div class="calendar-weekday-row grid grid-cols-7 gap-2 mb-3">

    <span class="calendar-weekday-label text-center text-sm md:text-base font-semibold text-white/80">Mon</span>
    <span class="calendar-weekday-label text-center text-sm md:text-base font-semibold text-white/80">Tue</span>
    <span class="calendar-weekday-label text-center text-sm md:text-base font-semibold text-white/80">Wed</span>
    <span class="calendar-weekday-label text-center text-sm md:text-base font-semibold text-white/80">Thu</span>
    <span class="calendar-weekday-label text-center text-sm md:text-base font-semibold text-white/80">Fri</span>
    <span class="calendar-weekday-label text-center text-sm md:text-base font-semibold text-white/80">Sat</span>
    <span class="calendar-weekday-label text-center text-sm md:text-base font-semibold text-white/80">Sun</span>

  </div>

  <!-- Calendar Grid -->
  <div class="calendar-grid calendar-grid-{{ calendar_view }} space-y-2">

    {% for week in calendar_weeks %}
    <div class="calendar-week-row grid grid-cols-7 gap-2">

      {% for cell in week %}

        {% if cell.is_current_period %}

        <button
          hx-get="{% url 'admin_appointment_calendar_day' %}?date={{ cell.date|date:'Y-m-d' }}"
          hx-target="#calendar-day-panel"
          hx-swap="innerHTML"
          class="calendar-day-cell relative flex h-20 md:h-24 flex-col items-center justify-start p-2 text-white bg-white/10 border border-white/10 rounded-2xl backdrop-blur-md transition hover:bg-white/20 {% if cell.is_today %}calendar-day-today ring-2 ring-white{% endif %} {% if not cell.is_working_day %}calendar-day-non-working opacity-60{% endif %} {% if cell.is_blocked %}calendar-day-blocked bg-red-500/20{% endif %}">

          <!-- Day Number -->
          <span class="calendar-day-number text-lg font-medium">
            {{ cell.day_number }}
          </span>

          <!-- Appointment Status Dots -->
          {% if cell.statuses %}
          <span class="calendar-day-dots absolute bottom-2 flex gap-1">

            {% for status_item in cell.statuses %}

            <span
              title="{{ status_item.count }} {{ status_item.status }}"
              class="calendar-dot calendar-dot-{{ status_item.status }}
              h-2 w-2 rounded-full

              {% if status_item.status == 'pending' %}
                bg-yellow-400
              {% elif status_item.status == 'confirmed' %}
                bg-blue-400
              {% elif status_item.status == 'completed' %}
                bg-green-400
              {% elif status_item.status == 'cancelled' %}
                bg-red-400
              {% elif status_item.status == 'no_show' %}
                bg-gray-400
              {% else %}
                bg-white
              {% endif %}
              ">
            </span>

            {% endfor %}

          </span>
          {% endif %}

        </button>

        {% else %}

        <!-- Filler days from adjacent month -->
        <div
          class="calendar-day-cell calendar-day-outside relative flex h-20 md:h-24 flex-col items-center justify-start p-2 text-white/40 bg-white/5 border border-white/5 rounded-2xl opacity-40">

          <span class="calendar-day-number text-lg font-medium">
            {{ cell.day_number }}
          </span>

        </div>

        {% endif %}

      {% endfor %}

    </div>
    {% endfor %}

  </div>
  <!-- end calendar-grid -->

</div>
<!-- end admin-calendar-grid -->
```
