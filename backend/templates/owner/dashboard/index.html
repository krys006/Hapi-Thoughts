{% extends 'base_dashboard.html' %}

{% block title %}Dashboard — Hapi Vet{% endblock %}

{% block content %}

<div class="owner-page">

  <div class="owner-page-header">
    <div>
      <h1 class="owner-page-title">My Dashboard</h1>
      <p class="owner-page-subtitle">{{ today|date:"l, F j, Y" }}</p>
    </div>
    <a href="{% url 'logout' %}" class="btn-link">Logout</a>
  </div>

  <!-- Quick book button -->
  <div class="owner-quick-actions">
    <a href="{% url 'owner_book_appointment' %}" class="btn-primary">Book an Appointment</a>
  </div>

  <!-- Widgets — self-polling block, see _dashboard_partial.html -->
  {% include 'owner/dashboard/_dashboard_partial.html' %}

</div>

{% endblock %}
