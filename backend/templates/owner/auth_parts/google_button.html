{% load socialaccount static %}
{% comment %}
  Google's official look: white, gray border, the coloured G (img/google_g.svg).
  A POST form with CSRF (Google sign-in must not start from a link).
  Parameter: label ("Continue with Google" / "Sign up with Google").
{% endcomment %}
<form method="post" action="{% provider_login_url 'google' %}" class="block w-full">
  {% csrf_token %}
  <button type="submit" class="flex min-h-12 w-full cursor-pointer items-center justify-center gap-3 rounded-lg border border-[#747775] bg-white px-4 text-lg font-medium text-[#1f1f1f] hover:bg-gray-50">
    <img src="{% static 'img/google_g.svg' %}" alt="" class="size-5 shrink-0">
    <span>{{ label }}</span>
  </button>
</form>
