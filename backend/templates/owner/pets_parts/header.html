{% comment %}
  My Pets heading with the pet count, and "Add a pet" top right: the page's one
  violet button. Needs total_count.
{% endcomment %}
<div class="flex items-center justify-between gap-3">
  <div>
    <h1 class="text-2xl font-bold">My Pets</h1>
    <p class="text-base text-gray-600">{{ total_count }} pet{{ total_count|pluralize }}</p>
  </div>
  <a href="{% url 'owner_pet_add' %}" class="inline-flex min-h-11 shrink-0 items-center gap-1.5 rounded-xl bg-violet-600 px-4 text-base font-semibold text-white shadow-sm hover:bg-violet-700">{% include "components/icon.html" with name="plus" class="size-5 shrink-0" %}Add a pet</a>
</div>
