<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-200 text-gray-900 antialiased">
<header class="sticky top-0 z-30 border-b border-gray-300 bg-white/95 px-6 py-3 backdrop-blur">
  <p class="mb-2 text-sm font-semibold text-gray-700">Slice 6 · Services v1 · frame copied from layouts/admin.html · today is Fri, Nov 6, 2026 · pick a state</p>
  <div id="switcher" class="flex flex-wrap gap-2"></div>
</header>
<div class="overflow-x-auto p-6">
  <div id="caption" class="mb-4 max-w-[1280px] rounded-xl border border-violet-200 bg-violet-50 p-4 text-base text-gray-800"></div>
  <div id="stage"></div>
  <p class="mt-3 text-sm text-gray-600">Desktop frame is 1280 px wide: a 1920×1080 screen at 150% zoom.</p>
</div>
<script>
// ---------- Icons (Lucide shapes; when built, copy new ones from lucide-static@1.66.0: printer, percent, ban) ----------
const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  bookOpen:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="m4.9 4.9 2.1 2.1"/><path d="m17 17 2.1 2.1"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.9 19.1 2.1-2.1"/><path d="m17 7 2.1-2.1"/>',
  logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrowRight:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  arrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  phone:'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  circleCheck:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  printer:'<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  percent:'<line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  ban:'<circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/>',
  dog:'<path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/>'
};
const ic = (n, c = 'size-5 shrink-0', s = 2) =>
  `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shared classes (assets/tailwind/input.css) ----------
const BTN = 'inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-base font-medium whitespace-nowrap transition-colors';
const BTN_PRIMARY = `${BTN} bg-violet-600 text-white hover:bg-violet-700`;
const BTN_OUTLINE = `${BTN} border border-gray-300 bg-white text-gray-800 hover:bg-gray-50`;
const BTN_DANGER = `${BTN} bg-red-600 text-white hover:bg-red-700`;
const BTN_RED_OUTLINE = `${BTN} border border-red-300 bg-white font-semibold text-red-700 hover:bg-red-50`;
const INPUT = 'block min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-base text-gray-900 placeholder:text-gray-500';
const CARD = 'rounded-xl border border-gray-200 bg-white p-6 shadow-sm';

// ---------- Frame ----------
const navLink = (icon, label, active = false, count = 0) =>
  `<a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base ${active ? 'bg-white font-semibold text-violet-800 shadow-sm ring-1 ring-violet-200' : 'text-gray-800 hover:bg-violet-200/70'}">${ic(icon)}<span class="flex-1">${label}</span>${count ? `<span class="rounded-full bg-violet-600 px-2 text-sm font-semibold text-white">${count}</span>` : ''}</a>`;
const sidebar = () => `
<aside class="flex w-56 shrink-0 flex-col border-r border-violet-200 bg-violet-100">
  <div class="flex h-16 shrink-0 items-center gap-3 px-5">
    <a class="-mx-2 flex min-h-11 min-w-0 flex-1 items-center gap-3 rounded-lg px-2"><span class="grid size-10 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image')}</span>
      <p class="line-clamp-2 text-base font-semibold leading-5 text-gray-900">Hapi Tutz Vet. Supplies</p></a>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-2">
    <p class="px-3 pb-1 pt-1 text-sm font-semibold text-violet-800">Daily work</p>
    ${navLink('house','Dashboard')}${navLink('calendar','Appointments',false,2)}${navLink('users','Pet owners')}${navLink('paw','Pets')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Records</p>
    ${navLink('fileText','Medical records')}${navLink('syringe','Vaccinations')}${navLink('bookOpen','Health library')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Clinic</p>
    ${navLink('receipt','Billing',true)}${navLink('settings','Clinic settings')}
  </nav>
  <div class="border-t border-violet-200 px-3 py-3"><a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base text-gray-800">${ic('logout')}Log out</a></div>
</aside>`;
const frame = (body, overlay = '', search = '') => `
<div class="relative flex min-h-[900px] w-[1280px] overflow-hidden rounded-xl border border-gray-300 bg-gray-50 shadow-sm">
  ${sidebar()}
  <div class="min-w-0 flex-1">
    <header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-8">
      ${search}
      <div class="ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span>Notifications</span><span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
    </header>
    <main class="px-8 py-6">${body}</main>
  </div>
  ${overlay}
</div>`;

// ---------- Pieces ----------
const peso = n => '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const link = (t, i = '', cls = '') => `<a class="inline-flex min-h-11 items-center gap-2 text-base font-medium text-blue-600 underline underline-offset-2 ${cls}">${i ? ic(i) : ''}${t}</a>`;
const pill = (cls, icon, text) => `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-sm font-medium ${cls}">${icon ? ic(icon,'size-4 shrink-0') : ''}${text}</span>`;
const errLine = e => e ? `<p class="mt-1 flex items-center gap-1.5 text-base text-red-700">${ic('alert','size-4 shrink-0')}${e}</p>` : '';
const DEFAULT_SEARCH = `<div class="relative w-full max-w-[30rem]"><span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-600">${ic('search')}</span><input type="search" placeholder="Find a pet or owner" class="${INPUT} pl-10"></div>`;
const page = (body) => frame(body, '', DEFAULT_SEARCH);

// ---------- List ----------
const tab = (label, count, countCls = 'bg-gray-100 text-gray-800') => `
<a class="inline-flex min-h-12 items-center gap-2 rounded-lg px-4 text-base text-gray-800 hover:bg-gray-100">${label}<span class="rounded-full px-2 text-sm font-semibold ${countCls}">${count}</span></a>`;
const tabs = () => `
<nav aria-label="Billing sections" class="mb-6 flex flex-wrap items-center gap-2 rounded-xl border border-gray-200 bg-white p-2 shadow-sm">
  ${tab('Unpaid', 4, 'bg-yellow-200 text-yellow-900')}${tab('Paid', 128)}${tab('Cancelled', 2)}${tab('All', 134)}
  <span class="mx-2 h-8 w-px bg-gray-300" aria-hidden="true"></span>
  <a aria-current="page" class="inline-flex min-h-12 items-center gap-2 rounded-lg bg-violet-50 px-4 text-base font-semibold text-violet-800 ring-2 ring-violet-600">${ic('fileText')}Services and prices</a>
</nav>`;

const GROUPS = [
  { key:'active', title:'Offered', icon:'eye', tone:'bg-green-100 text-green-800', text:'Pet owners see these when they book. You can put them on receipts.',
    rows:[['Consultation','Check-ups','General check-up and advice.',300],['Deworming','Preventive care','Tablet or syrup, by weight.',150],['Anti-rabies vaccine','Vaccines','Includes the vaccination card.',250],['Wound cleaning and dressing','Treatment','Price depends on the size of the wound.',[300,800]],['Grooming (small dog)','Grooming','',[350,600]]] },
  { key:'unlisted', title:'Clinic use only', icon:'lock', tone:'bg-blue-100 text-blue-800', text:'Hidden from pet owners. You can put them on receipts and pick them for walk-ins.',
    rows:[['Home visit fee','','Added when the vet visits the house.',500],['After-hours fee','','',200]] },
  { key:'draft', title:'Hidden (draft)', icon:'pencil', tone:'bg-gray-100 text-gray-800', text:'Not shown anywhere yet. Finish it, then choose Offered or Clinic use only.',
    rows:[['Dental cleaning','Treatment','',[1500,3000]]] },
  { key:'closed', title:'No longer offered', icon:'ban', tone:'bg-red-100 text-red-800', text:'Not shown anywhere. Old visits and receipts keep their names and prices.',
    rows:[] }
];
const priceText = p => Array.isArray(p) ? `${peso(p[0])} to ${peso(p[1])}` : peso(p);
const svcRow = ([n, cat, desc, price]) => `
<li class="grid grid-cols-[minmax(0,1fr)_12rem_auto] items-center gap-5 border-b border-gray-100 px-5 py-4 last:border-b-0">
  <div class="min-w-0">
    <p class="flex flex-wrap items-center gap-2 text-lg font-semibold text-gray-900">${n}${cat ? `<span class="rounded-full bg-gray-100 px-2.5 py-0.5 text-sm font-medium text-gray-800">${cat}</span>` : ''}</p>
    <p class="truncate text-base ${desc ? 'text-gray-700' : 'text-gray-600'}">${desc || 'No description'}</p>
  </div>
  <div class="text-right"><p class="text-lg font-semibold">${priceText(price)}</p><p class="text-sm text-gray-700">${Array.isArray(price) ? 'Price range' : 'One price'}</p></div>
  <a class="${BTN_OUTLINE} font-semibold">${ic('pencil')}Edit<span class="sr-only"> ${n}</span></a>
</li>`;
const group = g => `
<section class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
  <div class="flex flex-wrap items-start justify-between gap-3 border-b border-gray-200 bg-gray-50 px-5 py-3">
    <div><h2 class="flex items-center gap-2 text-xl font-semibold text-gray-900">${pill(g.tone, g.icon, g.title)}<span class="text-base font-normal text-gray-700">${g.rows.length} service${g.rows.length === 1 ? '' : 's'}</span></h2>
    <p class="mt-1 text-sm text-gray-700">${g.text}</p></div>
  </div>
  ${g.rows.length ? `<ul>${g.rows.map(svcRow).join('')}</ul>` : '<p class="px-5 py-4 text-base text-gray-600">None.</p>'}
</section>`;
const listPage = () => `
<div class="mb-6 flex flex-wrap items-start justify-between gap-4">
  <div><h1 class="text-2xl font-bold text-gray-900">Billing</h1>
    <p class="mt-1 text-base text-gray-700">Services and prices: the price list for receipts and for booking.</p></div>
  <a class="${BTN_PRIMARY} font-semibold">${ic('plus')}Add service</a>
</div>
${tabs()}
<div class="mb-3 flex flex-wrap items-baseline justify-between gap-2"><h2 class="text-xl font-semibold">All services (8)</h2><p class="text-sm text-gray-700">Grouped by who sees them · A to Z</p></div>
<div class="space-y-6">${GROUPS.map(group).join('')}</div>`;

// ---------- Form ----------
const field = (label, value = '', { opt = false, placeholder = '', help = '', err = '', prefix = '', cls = '' } = {}) => `
<div class="${cls}"><label class="block text-base font-semibold text-gray-900">${label}${opt ? ' <span class="font-normal text-gray-600">(optional)</span>' : ' <span class="text-red-700">*</span>'}</label>
  <div class="relative mt-1">${prefix ? `<span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-base text-gray-700">${prefix}</span>` : ''}
  <input value="${value}" placeholder="${placeholder}" class="${INPUT} ${prefix ? 'pl-8' : ''} ${err ? 'border-red-600 ring-1 ring-red-600' : ''}"></div>
  ${help ? `<p class="mt-1 text-sm text-gray-700">${help}</p>` : ''}${errLine(err)}</div>`;
const radioCard = (title, text, checked, extra = '') => `
<label class="flex min-h-11 cursor-pointer items-start gap-4 rounded-lg border-2 p-4 ${checked ? 'border-violet-600 bg-violet-50' : 'border-gray-200 bg-white hover:border-violet-300'}">
  <input type="radio" ${checked ? 'checked' : ''} class="mt-0.5 size-6 shrink-0 accent-violet-600">
  <span><span class="flex flex-wrap items-center gap-2 text-base font-semibold text-gray-900">${title}${extra}</span><span class="block text-sm text-gray-700">${text}</span></span>
</label>`;

const form = ({ edit = false, range = false, errors = false, status = 'active' } = {}) => `
<p class="mb-2">${link('Back to services','arrowLeft')}</p>
<div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">${edit ? 'Edit service · Consultation' : 'Add service'}</h1>
  <p class="mt-1 text-base text-gray-700">${edit ? 'Changes apply to new receipts and bookings. Receipts already made keep their prices.' : 'A service on the price list. You can change it later.'}</p></div>
<div class="mx-auto max-w-3xl space-y-6">
  ${errors ? `<div class="rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-base text-red-900">${ic('alert','mr-1 inline size-5 -translate-y-px')}Please fix the 2 items below.</div>` : ''}
  <section class="${CARD} space-y-4">
    <h2 class="flex items-center gap-2 text-xl font-semibold">${ic('fileText','size-5 shrink-0 text-gray-600')}The service</h2>
    ${field('Name', edit ? 'Consultation' : errors ? '' : 'Wound cleaning and dressing', { placeholder:'For example: Consultation', err: errors ? 'Type the service name.' : '' })}
    ${field('Category', edit ? 'Check-ups' : 'Treatment', { opt:true, placeholder:'For example: Vaccines', help:'Groups similar services. Type any word.' })}
    <div><label class="block text-base font-semibold">Description <span class="font-normal text-gray-600">(optional)</span></label>
      <textarea rows="3" placeholder="What it includes, in a sentence" class="${INPUT} mt-1">${edit ? 'General check-up and advice.' : 'Price depends on the size of the wound.'}</textarea>
      <p class="mt-1 text-sm text-gray-700">Pet owners see this when they book.</p></div>
  </section>
  <section class="${CARD}">
    <h2 class="mb-4 flex items-center gap-2 text-xl font-semibold">${ic('receipt','size-5 shrink-0 text-gray-600')}Price</h2>
    <fieldset><legend class="text-base font-semibold text-gray-900">How is it priced? <span class="text-red-700">*</span></legend>
      <div class="mt-3 grid grid-cols-2 gap-3">
        ${radioCard('One price','The same price every time.', !range)}
        ${radioCard('A price range','For example ₱300.00 to ₱800.00. You set the real price on each receipt.', range)}
      </div></fieldset>
    <div class="mt-4 border-l-4 border-violet-200 pl-4">
      ${range
        ? `<div class="grid grid-cols-2 gap-4">${field('Lowest price', errors ? '800' : '300', { prefix:'₱' })}${field('Highest price', errors ? '300' : '800', { prefix:'₱', err: errors ? 'The highest price must be more than the lowest.' : '' })}</div>
           <p class="mt-2 text-sm text-gray-700">Pet owners see “₱300.00 to ₱800.00” when they book.</p>`
        : `${field('Price', edit ? '300.00' : '', { prefix:'₱', cls:'max-w-xs' })}`}
    </div>
  </section>
  <section class="${CARD}">
    <h2 class="mb-4 flex items-center gap-2 text-xl font-semibold">${ic('eye','size-5 shrink-0 text-gray-600')}Who sees it</h2>
    <fieldset><legend class="sr-only">Who sees it</legend><div class="space-y-3">
      ${radioCard('Offered','Pet owners see it when they book. You can put it on receipts.', status === 'active')}
      ${radioCard('Clinic use only','Hidden from pet owners. You can put it on receipts and pick it for walk-ins.', status === 'unlisted')}
      ${radioCard('Hidden (draft)','Not shown anywhere yet.', status === 'draft')}
      ${radioCard('No longer offered','Not shown anywhere. Old visits and receipts keep it.', status === 'closed')}
    </div></fieldset>
    ${edit && status === 'closed' ? `<p class="mt-3 flex items-start gap-2 rounded-lg bg-gray-50 px-3 py-2 text-base text-gray-800">${ic('info','mt-0.5 size-5 shrink-0')}Upcoming visits booked with Consultation keep it. Owners can't pick it for new bookings.</p>` : ''}
  </section>
  <div class="flex flex-wrap items-center justify-end gap-3">
    <a class="${BTN_OUTLINE} min-h-12 font-semibold">Cancel</a>
    <button type="submit" class="${BTN_PRIMARY} min-h-12 font-semibold">${ic(edit ? 'check' : 'plus')}${edit ? 'Save changes' : 'Add service'}</button>
  </div>
</div>`;

// ---------- Phone ----------
const phoneView = () => `
<div class="w-[390px] overflow-hidden rounded-[2rem] border-8 border-gray-800 bg-gray-50 shadow-lg">

// ---------- States ----------
const states = [
  { id:'list', label:'1 · Services list', html: page(listPage()),
    caption:`<b>Services and prices</b>, the last tab of Billing (same tab row as the receipt list; Billing stays lit in the sidebar). <b>Add service</b> is the violet button on this page. <b>One page, grouped by who sees it</b> (no status tabs; a clinic has a few dozen services at most, so no paging or search): <b>Offered</b> (Active), <b>Clinic use only</b> (Unlisted), <b>Hidden (draft)</b> (Draft), <b>No longer offered</b> (Closed), each with one plain line on what it means and its count; an empty group says “None.” Rows: name + category pill, description (one line) or “No description”, the price (“₱300.00” / “₱300.00 to ₱800.00”) with “One price” / “Price range”, and an outline <b>Edit</b>. A to Z inside each group. The split pane and Add Service modal are gone. There is no delete (as now): “No longer offered” is the way to retire one.` },
  { id:'add', label:'2 · Add service (one price)', html: page(form({ status:'draft' }).replace('Wound cleaning and dressing','Consultation').replace('Price depends on the size of the wound.','General check-up and advice.').replace('value="Treatment"','value="Check-ups"')),
    caption:`<b>Add service</b>, form layout like the pet and record forms. Three cards: <b>The service</b> (Name required, Category and Description optional, where owners see the description), <b>Price</b> (“How is it priced?” as two radio cards: One price / A price range, then only the fields for that choice, indented as on the record form's follow-up), <b>Who sees it</b> (the four statuses as radio cards with one plain line each; a new service starts on <b>Hidden (draft)</b> as today). Cancel + violet <b>Add service</b>. The switch between price fields is a small script (like record_form.js); without JavaScript both sets show.` },
  { id:'range', label:'3 · Price range', html: page(form({ range:true, status:'active' })),
    caption:`<b>A price range</b> shows Lowest price and Highest price and what owners will see. On a receipt, a range service fills the description but not the price, with the help “Usual price ₱300.00 to ₱800.00. You can bill outside it.” (receipt page, state 4).` },
  { id:'errors', label:'4 · Errors', html: page(form({ range:true, errors:true, status:'active' })),
    caption:`<b>Errors</b>: summary box, each message under its field, typed values kept. Messages: “Type the service name.”, “Type the price.” (one price), “Type the lowest and the highest price.”, “The highest price must be more than the lowest.”, “Prices can't be negative.” <b>New rule (no migration):</b> two services can't have the same name, ignoring letter case: “There is already a service called “Consultation”.” Saving clears the fields of the other pricing type, so a one-price service never keeps an old range.` },
  { id:'edit', label:'5 · Edit, retiring it', html: page(form({ edit:true, status:'closed' })),
    caption:`<b>Edit service</b>: same form, “Save changes”. The subtitle says changes don't touch receipts already made (each receipt item keeps its own name and price). Picking <b>No longer offered</b> shows a gray note: visits already booked with it keep it; owners can't pick it any more. The status names on these pages are labels only: the saved values stay draft / active / unlisted / closed, so no migration.` },
  { id:'phone', label:'6 · Phone', html: phoneView(),
    caption:`<b>Phone width</b>: Add service full width, the Billing tabs as a 2×2 grid with Services and prices under them, each service as a small card (name and price on one line, category, Edit full width).` }
];

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' + (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('list');
</script>
</body>
