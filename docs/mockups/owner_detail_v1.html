<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner detail v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-200 text-gray-900 antialiased">

<header class="sticky top-0 z-30 border-b border-gray-300 bg-white/95 px-6 py-3 backdrop-blur">
  <p class="mb-2 text-sm font-semibold text-gray-700">Owner detail v1 · frame copied from layouts/admin.html · pick a state</p>
  <div id="switcher" class="flex flex-wrap gap-2"></div>
</header>

<div class="overflow-x-auto p-6">
  <div id="caption" class="mb-4 max-w-[1280px] rounded-xl border border-violet-200 bg-violet-50 p-4 text-base text-gray-800"></div>
  <div id="stage"></div>
  <p class="mt-3 text-sm text-gray-600">Desktop frame is 1280 px wide: a 1920×1080 screen at 150% zoom. Grey picture tiles stand in for uploaded photos (clinic logo, Brownie).</p>
</div>

<script>
// ---------- Icons (Lucide 1.66 shapes) ----------
const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  bookOpen:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrowRight:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  arrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  phone:'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  mapPin:'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  archive:'<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  rotate:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  circleCheck:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  dog:'<path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/>',
  cat:'<path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/><path d="M8 14v.5"/><path d="M16 14v.5"/><path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/>'
};
const ic = (n, c = 'size-5 shrink-0', s = 2) =>
  `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shared classes, copied from assets/tailwind/input.css ----------
const BTN = 'inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-base font-medium whitespace-nowrap transition-colors';
const BTN_PRIMARY = `${BTN} bg-violet-600 text-white hover:bg-violet-700`;
const BTN_OUTLINE = `${BTN} border border-gray-300 bg-white text-gray-800 hover:bg-gray-50`;
const BTN_DANGER = `${BTN} bg-red-600 text-white hover:bg-red-700`;
const INPUT = 'block min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-base text-gray-900 placeholder:text-gray-500';
const CARD = 'rounded-xl border border-gray-200 bg-white p-6 shadow-sm';

// ---------- Frame: layouts/admin.html + admin_sidebar.html + admin_nav_link.html ----------
const navLink = (icon, label, active = false, count = 0) =>
  `<a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base ${active ? 'bg-white font-semibold text-violet-800 shadow-sm ring-1 ring-violet-200' : 'text-gray-800 hover:bg-violet-200/70'}">${ic(icon)}<span class="flex-1">${label}</span>${count ? `<span class="rounded-full bg-violet-600 px-2 text-sm font-semibold text-white">${count}</span>` : ''}</a>`;
const sidebar = () => `
<aside class="flex w-56 shrink-0 flex-col border-r border-violet-200 bg-violet-100">
  <div class="flex h-16 shrink-0 items-center gap-3 px-5">
    <a class="-mx-2 flex min-h-11 min-w-0 flex-1 items-center gap-3 rounded-lg px-2 hover:bg-violet-200/60">
      <span class="grid size-10 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image','size-5 shrink-0')}</span>
      <div class="min-w-0 flex-1"><p class="line-clamp-2 text-base font-semibold leading-5 text-gray-900">Hapi Tutz Vet. Supplies</p></div>
    </a>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-2">
    <p class="px-3 pb-1 pt-1 text-sm font-semibold text-violet-800">Daily work</p>
    ${navLink('house','Dashboard')}${navLink('calendar','Appointments',false,2)}${navLink('users','Pet owners',true)}${navLink('paw','Pets',false,1)}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Records</p>
    ${navLink('fileText','Medical records')}${navLink('syringe','Vaccinations')}${navLink('bookOpen','Health library')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Clinic</p>
    ${navLink('receipt','Billing')}${navLink('settings','Clinic settings')}
  </nav>
  <div class="border-t border-violet-200 px-3 py-3">
    <a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base text-gray-800 hover:bg-violet-200/70">${ic('logout')}Log out</a>
  </div>
</aside>`;
const topbar = () => `
<header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-8">
  <div class="relative w-full max-w-xl">
    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-500">${ic('search')}</span>
    <input type="search" placeholder="Find a pet or owner" class="${INPUT} pl-10">
  </div>
  <div class="relative ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span>Notifications</span><span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
</header>`;
const frame = (body, overlay = '') => `
<div class="relative flex min-h-[800px] w-[1280px] overflow-hidden rounded-xl border border-gray-300 bg-gray-50 shadow-sm">
  ${sidebar()}
  <div class="min-w-0 flex-1">${topbar()}<main class="px-8 py-6">${body}</main></div>
  ${overlay}
</div>`;

// ---------- Pieces ----------
const link = (t, i = '') => `<a class="inline-flex items-center gap-1.5 font-medium text-blue-600 underline underline-offset-2">${i ? ic(i,'size-4 shrink-0') : ''}${t}</a>`;
const muted = t => `<span class="text-gray-600">${t}</span>`;
// Actions card buttons: same classes as appointments/detail_parts/actions_card.html
const act = {
  primary: (i, l) => `<button type="button" class="${BTN_PRIMARY} min-h-12 w-full font-semibold">${ic(i)}${l}</button>`,
  outline: (i, l) => `<button type="button" class="${BTN_OUTLINE} min-h-12 w-full font-semibold">${ic(i)}${l}</button>`,
  danger: (i, l) => `<button type="button" class="${BTN} min-h-12 w-full border border-red-300 bg-white font-semibold text-red-700 hover:bg-red-50">${ic(i)}${l}</button>`
};
const hr = `<hr class="!my-4 border-gray-200">`;

// owner_avatar.html: new "lg" size (64px) for the page header
const ownerAvatarLg = (name, gray = false) => {
  const p = name.split(' ');
  const ini = (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  return `<span class="grid size-16 shrink-0 place-content-center rounded-full ${gray ? 'bg-gray-100 text-gray-700 ring-gray-300' : 'bg-violet-50 text-violet-700 ring-violet-200'} text-xl font-semibold tracking-wide ring-1" role="img" aria-label="${name}">${ini}</span>`;
};
// pet_avatar.html size "sm"
const petAvatar = (species, photo = false, gray = false) => photo
  ? `<span class="grid size-10 shrink-0 place-content-center rounded-xl bg-gradient-to-br from-stone-300 to-stone-500 text-white">${ic('image','size-5 shrink-0')}</span>`
  : `<span class="grid size-10 shrink-0 place-content-center rounded-xl ${gray ? 'bg-gray-100 text-gray-600 ring-gray-300' : 'bg-violet-50 text-violet-600 ring-violet-200'} ring-1">${ic(species,'size-6 shrink-0',1.5)}</span>`;

const banner = (tone, i, h, p, extra = '') => {
  const t = {
    yellow:'border-yellow-300 bg-yellow-50 text-yellow-900',
    gray:'border-gray-300 bg-gray-100 text-gray-900'
  }[tone];
  return `<div class="mb-6 flex flex-wrap items-start gap-3 rounded-xl border px-5 py-4 ${t}">${ic(i, 'mt-0.5 size-6 shrink-0')}
    <div class="min-w-0 flex-1"><p class="text-lg font-semibold">${h}</p><p class="mt-0.5 text-base">${p}</p></div>${extra}</div>`;
};
// components/flash_messages.html (rendered above the page header)
const flash = (tone, msg) => {
  const t = {
    success:['border-green-200 bg-green-50 text-green-900','circleCheck'],
    warning:['border-yellow-200 bg-yellow-50 text-yellow-900','alert']
  }[tone];
  return `<div class="mb-6 space-y-3"><div class="flex items-start gap-3 rounded-lg border px-4 py-3 text-base ${t[0]}" role="status">${ic(t[1],'mt-0.5 size-5 shrink-0')}<p class="flex-1">${msg}</p>
    <button type="button" class="-my-1 -mr-2 flex min-h-11 items-center gap-1 rounded-md px-2 text-sm font-medium hover:bg-black/5">${ic('x','size-4 shrink-0')}Close</button></div></div>`;
};

const card = (title, body, right = '') => `
<section class="${CARD}">
  <div class="mb-3 flex flex-wrap items-center justify-between gap-3"><h2 class="text-xl font-semibold">${title}</h2>${right}</div>
  ${body}
</section>`;

const dl = rows => `<dl class="divide-y divide-gray-100">${rows.map(([i, t, d]) =>
  `<div class="grid grid-cols-[11rem_1fr] gap-3 py-3"><dt class="flex items-center gap-2 text-base text-gray-600">${ic(i,'size-5 shrink-0 text-gray-500')}${t}</dt><dd class="text-base text-gray-900">${d}</dd></div>`).join('')}</dl>`;

// components/status_badge.html (.badge)
const badge = s => {
  const m = {
    pending:['bg-yellow-100 text-yellow-800','Pending'], confirmed:['bg-blue-100 text-blue-800','Confirmed'],
    completed:['bg-green-100 text-green-800','Completed'], cancelled:['bg-red-100 text-red-800','Cancelled'],
    no_show:['bg-gray-100 text-gray-800','No Show']
  }[s];
  return `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-sm font-medium whitespace-nowrap ${m[0]}">${m[1]}</span>`;
};

// ---------- Sample owners ----------
const LIZA = {
  name:'Liza Cruz', since:'Mar 12, 2025',
  phone:'0917 123 4567', email:'liza.cruz@gmail.com',
  address:'Purok 3, Bognuyan, Gasan, Marinduque',
  links:[['Facebook','facebook.com/liza.cruz.77']],
  pets:[['Brownie','dog','Dog · Aspin','3 years',true],['Choco','dog','Dog · Shih Tzu','1 year',false],['Mingming','cat','Cat · Puspin','5 months',false]],
  archivedPets:[['Bantay','dog','Dog · Aspin','Archived Sep 20']],
  visits:[
    ['Today','2:00 PM','Brownie','Grooming','confirmed'],
    ['Thu, Oct 29','9:30 AM','Mingming','Check-up','completed'],
    ['Mon, Oct 12','10:00 AM','Choco','Deworming','completed'],
    ['Sat, Sep 26','3:00 PM','Brownie','Vaccination','no_show'],
    ['Tue, Sep 8','9:00 AM','Bantay','Check-up','cancelled']
  ]
};
const ANA = {
  name:'Ana Cruz', since:'today', walkin:true,
  phone:'', email:'', address:'', links:[],
  pets:[['Bantay','dog','Dog · Aspin','2 years',false]],
  archivedPets:[],
  visits:[['Today','11:00 AM','Bantay','Check-up','confirmed']]
};

// ---------- Cards ----------
const contactCard = o => card('Contact details', dl([
  ['phone','Phone', o.phone || muted('No phone number')],
  ['mail','Email', o.email || muted('No email')],
  ['mapPin','Address', o.address || muted('No address')],
  ['link','Other contacts', o.links.length ? o.links.map(([p, h]) => `${p}: ${h}`).join('<br>') : muted('None')]
]));

const petsCard = (o, archived = false) => card(
  `Pets <span class="font-normal text-gray-600">(${o.pets.length})</span>`,
  `<ul class="grid grid-cols-1 gap-3 xl:grid-cols-2">${o.pets.map(([n, s, sb, age, photo]) => `
    <li class="flex items-center gap-3 rounded-xl border border-gray-200 px-4 py-3">${petAvatar(s, photo, archived)}
      <div class="min-w-0 flex-1"><p class="text-base font-semibold">${n}</p><p class="text-sm text-gray-700">${sb} · ${age}</p></div>
      <a class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-violet-300 bg-violet-50 px-4 text-base font-semibold text-violet-800 hover:border-violet-400 hover:bg-violet-100">Open${ic('arrowRight')}</a>
    </li>`).join('')}</ul>
  ${o.archivedPets.length ? `
  <details class="mt-4 rounded-xl border border-gray-200">
    <summary class="flex min-h-11 cursor-pointer items-center gap-2 px-4 text-base font-medium text-gray-800">${ic('archive','size-5 shrink-0 text-gray-600')}Archived pets (${o.archivedPets.length})</summary>
    <ul class="border-t border-gray-100 px-4 py-2">${o.archivedPets.map(([n, s, sb, note]) => `
      <li class="flex items-center gap-3 py-2">${petAvatar(s, false, true)}<div class="flex-1"><p class="text-base font-semibold">${n}</p><p class="text-sm text-gray-700">${sb} · ${note}</p></div>${link('Open')}</li>`).join('')}</ul>
  </details>` : ''}`);

const visitsCard = o => card('Recent visits',
  `<ul class="divide-y divide-gray-100">${o.visits.map(([d, t, pet, svc, st]) => `
    <li class="flex flex-wrap items-center gap-x-4 gap-y-1 py-2">
      <span class="w-32 text-base font-medium">${d}</span><span class="w-20 text-base text-gray-700">${t}</span>
      <span class="min-w-0 flex-1 text-base">${pet} · ${svc}</span>${badge(st)}
      <a class="inline-flex min-h-11 items-center px-2 text-base font-medium text-blue-600 underline underline-offset-2">Open</a>
    </li>`).join('')}</ul>
  <p class="mt-3 border-t border-gray-100 pt-3 text-base">${link(`See all visits for ${o.name}`,'arrowRight')}</p>`);

const deletionBanner = () => banner('yellow','clock','Deletion request waiting',
  'Liza Cruz asked to remove <b>Choco</b> on Sat, Oct 31. Reason: rehomed. Open Choco to approve or reject it.',
  `<a class="${BTN} border border-yellow-400 bg-white font-semibold text-yellow-900 hover:bg-yellow-100">Review Choco${ic('arrowRight')}</a>`);

const accountCard = kind => {
  const body = {
    active: `<p class="flex items-start gap-2 text-base text-gray-800">${ic('circleCheck','mt-0.5 size-5 shrink-0 text-green-700')}<span>Liza Cruz can log in and book online.</span></p>`,
    noEmail: `<p class="flex items-start gap-2 text-base text-gray-800">${ic('lock','mt-0.5 size-5 shrink-0 text-gray-600')}<span>Ana Cruz can't log in yet. Add an email and we'll send a link to set a password.</span></p>
      <div class="mt-4">${act.outline('mail','Add email')}</div>`,
    unclaimed: `<p class="flex items-start gap-2 text-base text-gray-800">${ic('clock','mt-0.5 size-5 shrink-0 text-yellow-700')}<span>Ana Cruz hasn't set a password yet. The link was sent to <b>ana.cruz@gmail.com</b>.</span></p>
      <div class="mt-4">${act.outline('send','Send the link again')}</div>`,
    archived: `<p class="flex items-start gap-2 text-base text-gray-800">${ic('lock','mt-0.5 size-5 shrink-0 text-gray-600')}<span>Archived accounts can't log in.</span></p>`
  }[kind];
  return `<section class="${CARD}"><h2 class="mb-4 text-xl font-semibold">Account</h2>${body}</section>`;
};

const actionsCard = (archived = false) => `
<section class="${CARD}">
  <h2 class="mb-4 text-xl font-semibold">What would you like to do?</h2>
  <div class="space-y-3">${archived ? `
    ${act.primary('rotate','Restore account')}
    <p class="flex items-start gap-2 rounded-lg bg-gray-50 px-3 py-3 text-sm text-gray-700">${ic('info','mt-0.5 size-4 shrink-0')}<span>Restore the account to book visits, add pets or change details.</span></p>` : `
    ${act.primary('calendar','Book walk-in')}
    ${act.outline('plus','Add pet')}
    ${act.outline('pencil','Edit details')}
    ${hr}
    ${act.danger('archive','Archive owner')}`}
  </div>
</section>`;

// page_header override, like appointments/detail.html
const head = (o, archived = false) => `
<a class="mb-2 inline-flex min-h-11 items-center gap-2 text-base font-medium text-blue-600 hover:underline">${ic('arrowLeft')}Back to pet owners</a>
<div class="mb-5 flex flex-wrap items-center gap-4">${ownerAvatarLg(o.name, archived)}
  <div><h1 class="flex flex-wrap items-center gap-3 text-2xl font-bold text-gray-900">${o.name}${o.walkin ? `<span class="rounded-full bg-violet-100 px-3 py-1 text-sm font-semibold text-violet-800">Added by the clinic</span>` : ''}${archived ? `<span class="inline-flex items-center gap-1.5 rounded-full bg-gray-200 px-3 py-1 text-sm font-semibold text-gray-800">${ic('archive','size-4 shrink-0')}Archived</span>` : ''}</h1>
  <p class="mt-1 text-base text-gray-600">Pet owner since ${o.since}</p></div>
</div>`;

// Same grid as appointments/detail.html: actions first in the HTML, right column from lg
const grid = (left, right) => `
<div class="grid items-start gap-6 grid-cols-[minmax(0,1fr)_20rem]">
  <div class="sticky top-6 col-start-2 row-start-1 space-y-6">${right}</div>
  <div class="col-start-1 row-start-1 space-y-6">${left}</div>
</div>`;

// ---------- Pages ----------
const lizaPage = (pre = '', overlay = '') => frame(
  pre + head(LIZA) + deletionBanner() +
  grid(contactCard(LIZA) + petsCard(LIZA) + visitsCard(LIZA), actionsCard() + accountCard('active')), overlay);

const anaPage = (kind, pre = '', overlay = '') => {
  const o = kind === 'unclaimed' ? { ...ANA, email:'ana.cruz@gmail.com' } : ANA;
  return frame(pre + head(o) + grid(contactCard(o) + petsCard(o) + visitsCard(o), actionsCard() + accountCard(kind)), overlay);
};

const archivedPage = (overlay = '') => {
  const o = { ...LIZA, visits: LIZA.visits.slice(1) };
  return frame(head(o, true) +
    banner('gray','archive','This owner is archived',
      'Archived on Tue, Oct 27. Liza Cruz can\'t log in, and you can\'t book visits for them. Their pets, visits and records are kept.') +
    grid(contactCard(o) + petsCard(o, true) + visitsCard(o), actionsCard(true) + accountCard('archived')), overlay);
};

// ---------- Dialogs: same classes as appointments/detail_parts/approve_dialog.html ----------
const dialogBox = inner => `<div class="absolute inset-0 flex items-start justify-center bg-gray-900/50 p-8 pt-24">
  <div class="w-[calc(100%-2rem)] max-w-lg rounded-2xl bg-white p-7 text-gray-900 shadow-xl">${inner}</div></div>`;
const dialogButtons = (ok, cls, icon) => `<div class="mt-6 flex flex-wrap justify-end gap-3">
  <button type="button" class="${BTN_OUTLINE} min-h-12 font-semibold ring-2 ring-violet-400 ring-offset-2">Go back</button>
  <button type="button" class="${cls} min-h-12 font-semibold">${ic(icon)}${ok}</button></div>`;

const archiveDialog = dialogBox(`
  <h2 class="text-xl font-bold">Archive Liza Cruz?</h2>
  <p class="mt-2 text-base text-gray-700">Liza Cruz won't be able to log in, and you won't be able to book visits for them. Their pets, visits, medical records and receipts are all kept. You can restore the account at any time.</p>
  <div class="mt-4 flex items-start gap-3 rounded-lg border border-yellow-300 bg-yellow-50 px-4 py-3 text-base text-yellow-900">${ic('alert','mt-0.5 size-5 shrink-0')}
    <p><b>Brownie has a visit today at 2:00 PM.</b> Archiving doesn't cancel it. Cancel it first on the appointment page if it won't happen.</p></div>
  ${dialogButtons('Yes, archive owner', BTN_DANGER, 'archive')}`);

const restoreDialog = dialogBox(`
  <h2 class="text-xl font-bold">Restore Liza Cruz?</h2>
  <p class="mt-2 text-base text-gray-700">Liza Cruz will be able to log in again, and you can book visits for them. Their pets come back on the Pets list.</p>
  ${dialogButtons('Yes, restore account', BTN_PRIMARY, 'rotate')}`);

const resendDialog = dialogBox(`
  <h2 class="text-xl font-bold">Send the link again?</h2>
  <p class="mt-2 text-base text-gray-700">Ana Cruz will get a new email at <b>ana.cruz@gmail.com</b> with a link to set a password. The old link stops working.</p>
  ${dialogButtons('Yes, send it', BTN_PRIMARY, 'send')}`);

// ---------- Phone (below lg: sidebar becomes the Menu drawer; below sm: bell without the word) ----------
const phoneView = () => `
<div class="w-[390px] overflow-hidden rounded-[2rem] border-8 border-gray-800 bg-gray-50 shadow-lg">
  <header class="flex h-16 items-center gap-3 border-b border-gray-200 bg-white px-4">
    <span class="${BTN_OUTLINE}">${ic('menu')}Menu</span>
    <div class="relative w-full max-w-xl"><span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-500">${ic('search')}</span><input type="search" placeholder="Find a pet or owner" class="${INPUT} pl-10"></div>
    <div class="relative ml-auto"><span class="${BTN_OUTLINE} px-3">${ic('bell')}<span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
  </header>
  <main class="space-y-6 px-4 py-6">
    <div class="-mb-6">${head(LIZA)}</div>
    <div class="-mb-6">${deletionBanner()}</div>
    ${actionsCard()}
    ${petsCard(LIZA).replace('xl:grid-cols-2','')}
    ${contactCard(LIZA).replaceAll('grid-cols-[11rem_1fr]','grid-cols-1')}
    ${accountCard('active')}
  </main>
</div>`;

// ---------- States ----------
const states = [
  { id:'full', label:'1 · Owner who signed up', html: lizaPage(),
    caption:`<b>Owner with everything.</b> Frame copied from the real layout (sidebar <code>w-56</code> with the logo block, top bar <code>h-16 px-8</code> with “Find a pet or owner”, page <code>px-8 py-6</code>). Header like the appointment page: back link, a 64 px initials circle (needs a new <b>lg</b> size in owner_avatar.html), name, “Pet owner since”. Yellow banner when one of their pets has a deletion request. Left: Contact details, Pets (pet_avatar sm; archived pets folded away), <b>Recent visits</b> (last 5, status_badge, “See all visits” opens the appointments list searched by the owner's name). Right (sticky, same grid as the appointment page): actions card with <b>Book walk-in</b> as the one violet button, and an <b>Account</b> card.` },
  { id:'noemail', label:'2 · Walk-in, no email', html: anaPage('noEmail'),
    caption:`<b>Walk-in owner without an email.</b> “Added by the clinic” tag. The Account card says they can't log in and offers <b>Add email</b>. Empty fields read “No phone number” / “No email” / “No address”.` },
  { id:'unclaimed', label:'3 · Email, no password yet', html: anaPage('unclaimed'),
    caption:`<b>Email added, account not set up yet</b> (no usable password). The Account card offers <b>Send the link again</b>, the new resend button. Hidden once they've set a password, and for owners who signed up themselves.` },
  { id:'resend', label:'4 · Dialog: send again', html: anaPage('unclaimed', '', resendDialog),
    caption:`<b>Confirmation before sending.</b> Focus starts on Go back. Success flash: “Sent the link again to ana.cruz@gmail.com.” If sending fails, a yellow warning instead of an error page.` },
  { id:'sent', label:'5 · Flash after adding an email', html: anaPage('unclaimed', flash('success','Email added for Ana Cruz. We sent a link to ana.cruz@gmail.com so they can set a password.')),
    caption:`<b>Flash after Add email</b> (components/flash_messages.html, above the back link as in the real layout). If sending fails, the email is still saved and the flash is yellow: “Email saved, but the link couldn't be sent. Use Send the link again later.” This replaces today's 500 error.` },
  { id:'archive', label:'6 · Dialog: archive', html: lizaPage('', archiveDialog),
    caption:`<b>Archive asks first,</b> with a solid red confirm button (the outline red stays on the page). If the owner has Pending or Confirmed visits from today on, a yellow line names the first one and says archiving doesn't cancel it. Success goes back to the owners list.` },
  { id:'archived', label:'7 · Archived owner', html: archivedPage(),
    caption:`<b>Archived.</b> Gray picture and tag, gray banner with the date. Only <b>Restore account</b> is offered. Book walk-in, Add pet, Edit, Add email and the resend button are hidden, and the server refuses them too. Pets and visits stay visible, read-only.` },
  { id:'restore', label:'8 · Dialog: restore', html: archivedPage(restoreDialog),
    caption:`<b>Restore asks first.</b> For an owner without an email (or without a password yet) the text says instead: “You can book visits for Ana Cruz again. They still can't log in until they have an email and set a password.”` },
  { id:'phone', label:'9 · Phone', html: phoneView(),
    caption:`<b>Phone width.</b> The real top bar at phone width: Menu, the global search, and the bell (the word “Notifications” is hidden below sm). Actions come first after the header and banner, then pets, contact details (labels above values), visits and Account.` }
];

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' +
      (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('full');
</script>
</body>
</html>
