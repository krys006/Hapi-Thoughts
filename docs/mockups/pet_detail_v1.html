<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet detail v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-200 text-gray-900 antialiased">

<header class="sticky top-0 z-30 border-b border-gray-300 bg-white/95 px-6 py-3 backdrop-blur">
  <p class="mb-2 text-sm font-semibold text-gray-700">Pet detail v1 · frame copied from layouts/admin.html · pick a state</p>
  <div id="switcher" class="flex flex-wrap gap-2"></div>
</header>

<div class="overflow-x-auto p-6">
  <div id="caption" class="mb-4 max-w-[1280px] rounded-xl border border-violet-200 bg-violet-50 p-4 text-base text-gray-800"></div>
  <div id="stage"></div>
  <p class="mt-3 text-sm text-gray-600">Desktop frame is 1280 px wide: a 1920×1080 screen at 150% zoom. Grey picture tiles stand in for uploaded photos (clinic logo, Brownie).</p>
</div>

<script>
// ---------- Icons (Lucide 1.66 shapes) ----------
const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  bookOpen:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrowRight:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  arrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  phone:'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  mapPin:'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  archive:'<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  rotate:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  circleCheck:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  heart:'<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>',
  calClock:'<path d="M16 14v2.2l1.6 1"/><path d="M16 2v3"/><path d="M21 7.338V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h2.338"/><path d="M3 9h5.859"/><path d="M8 2v3"/><circle cx="16" cy="16" r="6"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  dog:'<path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/>',
  cat:'<path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/><path d="M8 14v.5"/><path d="M16 14v.5"/><path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/>'
};
const ic = (n, c = 'size-5 shrink-0', s = 2) =>
  `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shared classes, copied from assets/tailwind/input.css ----------
const BTN = 'inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-base font-medium whitespace-nowrap transition-colors';
const BTN_PRIMARY = `${BTN} bg-violet-600 text-white hover:bg-violet-700`;
const BTN_OUTLINE = `${BTN} border border-gray-300 bg-white text-gray-800 hover:bg-gray-50`;
const BTN_DANGER = `${BTN} bg-red-600 text-white hover:bg-red-700`;
const INPUT = 'block min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-base text-gray-900 placeholder:text-gray-500';
const CARD = 'rounded-xl border border-gray-200 bg-white p-6 shadow-sm';

// ---------- Frame: layouts/admin.html + admin_sidebar.html + admin_nav_link.html ----------
const navLink = (icon, label, active = false, count = 0) =>
  `<a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base ${active ? 'bg-white font-semibold text-violet-800 shadow-sm ring-1 ring-violet-200' : 'text-gray-800 hover:bg-violet-200/70'}">${ic(icon)}<span class="flex-1">${label}</span>${count ? `<span class="rounded-full bg-violet-600 px-2 text-sm font-semibold text-white">${count}</span>` : ''}</a>`;
const sidebar = () => `
<aside class="flex w-56 shrink-0 flex-col border-r border-violet-200 bg-violet-100">
  <div class="flex h-16 shrink-0 items-center gap-3 px-5">
    <a class="-mx-2 flex min-h-11 min-w-0 flex-1 items-center gap-3 rounded-lg px-2 hover:bg-violet-200/60">
      <span class="grid size-10 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image','size-5 shrink-0')}</span>
      <div class="min-w-0 flex-1"><p class="line-clamp-2 text-base font-semibold leading-5 text-gray-900">Hapi Tutz Vet. Supplies</p></div>
    </a>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-2">
    <p class="px-3 pb-1 pt-1 text-sm font-semibold text-violet-800">Daily work</p>
    ${navLink('house','Dashboard')}${navLink('calendar','Appointments',false,2)}${navLink('users','Pet owners')}${navLink('paw','Pets',true,2)}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Records</p>
    ${navLink('fileText','Medical records')}${navLink('syringe','Vaccinations')}${navLink('bookOpen','Health library')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Clinic</p>
    ${navLink('receipt','Billing')}${navLink('settings','Clinic settings')}
  </nav>
  <div class="border-t border-violet-200 px-3 py-3">
    <a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base text-gray-800 hover:bg-violet-200/70">${ic('logout')}Log out</a>
  </div>
</aside>`;
const topbar = () => `
<header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-8">
  <div class="relative w-full max-w-xl">
    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-500">${ic('search')}</span>
    <input type="search" placeholder="Find a pet or owner" class="${INPUT} pl-10">
  </div>
  <div class="relative ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span>Notifications</span><span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
</header>`;
const frame = (body, overlay = '') => `
<div class="relative flex min-h-[800px] w-[1280px] overflow-hidden rounded-xl border border-gray-300 bg-gray-50 shadow-sm">
  ${sidebar()}
  <div class="min-w-0 flex-1">${topbar()}<main class="px-8 py-6">${body}</main></div>
  ${overlay}
</div>`;


// ---------- Pieces ----------
const link = (t, i = '') => `<a class="inline-flex min-h-11 items-center gap-1.5 font-medium text-blue-600 underline underline-offset-2">${i ? ic(i,'size-4 shrink-0') : ''}${t}</a>`;
const muted = t => `<span class="text-gray-600">${t}</span>`;
const act = {
  primary: (i, l) => `<button type="button" class="${BTN_PRIMARY} min-h-12 w-full font-semibold">${ic(i)}${l}</button>`,
  outline: (i, l) => `<button type="button" class="${BTN_OUTLINE} min-h-12 w-full font-semibold">${ic(i)}${l}</button>`,
  danger: (i, l) => `<button type="button" class="${BTN} min-h-12 w-full border border-red-300 bg-white font-semibold text-red-700 hover:bg-red-50">${ic(i)}${l}</button>`
};
const hr = `<hr class="!my-4 border-gray-200">`;
const pill = (cls, icon, text) => `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-sm font-medium whitespace-nowrap ${cls}">${icon ? ic(icon,'size-4 shrink-0') : ''}${text}</span>`;
const badge = s => ({confirmed:pill('bg-blue-100 text-blue-800','','Confirmed'), completed:pill('bg-green-100 text-green-800','','Completed'), cancelled:pill('bg-red-100 text-red-800','','Cancelled'), no_show:pill('bg-gray-100 text-gray-800','','No Show'), pending:pill('bg-yellow-100 text-yellow-800','','Pending')})[s];
const petLg = (photo, gray = false) => photo
  ? `<span class="grid size-16 shrink-0 place-content-center rounded-2xl bg-gradient-to-br from-stone-300 to-stone-500 text-white">${ic('image','size-7 shrink-0')}</span>`
  : `<span class="grid size-16 shrink-0 place-content-center rounded-2xl ${gray ? 'bg-gray-100 text-gray-600 ring-gray-300' : 'bg-violet-50 text-violet-600 ring-violet-200'} ring-1">${ic('dog','size-9 shrink-0',1.5)}</span>`;
const ownerSm = (gray = false) => `<span class="grid size-10 shrink-0 place-content-center rounded-full ${gray ? 'bg-gray-100 text-gray-700 ring-gray-300' : 'bg-violet-50 text-violet-700 ring-violet-200'} text-base font-semibold tracking-wide ring-1">LC</span>`;
const card = (title, body, right = '') => `
<section class="${CARD}">
  <div class="mb-3 flex flex-wrap items-center justify-between gap-3"><h2 class="text-xl font-semibold">${title}</h2>${right}</div>
  ${body}
</section>`;
const banner = (tone, i, h, p, extra = '') => {
  const t = {yellow:'border-yellow-300 bg-yellow-50 text-yellow-900', gray:'border-gray-300 bg-gray-100 text-gray-900'}[tone];
  return `<div class="mb-6 flex flex-wrap items-start gap-3 rounded-xl border px-5 py-4 ${t}">${ic(i,'mt-0.5 size-6 shrink-0')}
    <div class="min-w-0 flex-1"><p class="text-lg font-semibold">${h}</p><p class="mt-0.5 text-base">${p}</p></div>${extra}</div>`;
};

// ---------- Cards ----------
const infoCard = full => card('Pet details', `<dl class="grid grid-cols-1 gap-x-8 sm:grid-cols-2">${[
  ['Species', 'Dog'], ['Breed', full ? 'Aspin' : muted('Not given')],
  ['Sex', full ? 'Male' : muted('Unknown')], ['Born', full ? 'Mar 3, 2023 · 3 yrs' : muted('Not given')],
  ['Color', full ? 'Brown and white' : muted('Not given')], ['Weight', full ? '12.5 kg' : muted('Not given')],
  ['Registration no.', full ? 'MRQ-2023-0412' : muted('None')]
].map(([t, d]) => `<div class="border-b border-gray-100 py-3"><dt class="text-sm text-gray-600">${t}</dt><dd class="text-base text-gray-900">${d}</dd></div>`).join('')}</dl>`);

const VISITS = [['Today','2:00 PM','Grooming','confirmed'],['Sat, Sep 26','3:00 PM','Vaccination','no_show'],['Mon, Aug 10','9:00 AM','Check-up','completed']];
const visitsCard = has => card('Recent visits', has ? `<ul class="divide-y divide-gray-100">${VISITS.map(([d, t, s, st]) => `
  <li class="flex flex-wrap items-center gap-x-4 gap-y-1 py-2"><span class="w-32 text-base font-medium">${d}</span><span class="w-20 text-base text-gray-700">${t}</span><span class="min-w-0 flex-1 text-base">${s}</span>${badge(st)}<a class="inline-flex min-h-11 items-center px-2 text-base font-medium text-blue-600 underline underline-offset-2">Open</a></li>`).join('')}</ul>
  <p class="mt-3 border-t border-gray-100 pt-3 text-base">${link('See all visits for Brownie','arrowRight')}</p>` : `<p class="text-base text-gray-600">No visits yet.</p>`);

const RECORDS = [['Mon, Aug 10','Mild skin allergy','Mon, Aug 24'],['Tue, Jun 2','Deworming, healthy',''],['Fri, Feb 14','Ear infection (left)','']];
const recordsCard = (has, archived) => card('Medical records', has ? `<ul class="divide-y divide-gray-100">${RECORDS.map(([d, dx, fu]) => `
  <li class="flex flex-wrap items-center gap-x-4 gap-y-1 py-2"><span class="w-32 text-base font-medium">${d}</span><span class="min-w-0 flex-1 text-base">${dx}</span>${fu ? pill('bg-blue-100 text-blue-800','calClock',`Follow-up ${fu}`) : ''}<a class="inline-flex min-h-11 items-center px-2 text-base font-medium text-blue-600 underline underline-offset-2">Open</a></li>`).join('')}</ul>
  <p class="mt-3 border-t border-gray-100 pt-3 text-base">${link('See full medical history (5 records)','arrowRight')}</p>` : `<p class="text-base text-gray-600">No medical records yet.</p>`,
  archived ? '' : `<a class="${BTN_OUTLINE} font-semibold">${ic('plus')}Add record</a>`);

const VACC = [['Anti-rabies','Mon, Nov 16, 2025','Mon, Nov 16', true, false],['6-in-1','Mon, Aug 10','',false,true],['Deworming','Tue, Jun 2','Wed, Dec 2',false,false]];
const vaccCard = (has, archived) => card('Vaccinations', has ? `
  <div class="mb-3 flex items-start gap-3 rounded-lg border border-yellow-300 bg-yellow-50 px-4 py-3 text-base text-yellow-900">${ic('syringe','mt-0.5 size-5 shrink-0')}<p><b>Anti-rabies is due Mon, Nov 16</b> (in 13 days).</p></div>
  <ul class="divide-y divide-gray-100">${VACC.map(([v, given, due, soon, corr]) => `
  <li class="flex flex-wrap items-center gap-x-4 gap-y-1 py-2"><span class="min-w-0 flex-1 text-base"><b class="font-semibold">${v}</b> · given ${given}</span>
    ${corr ? pill('bg-gray-100 text-gray-800','pencil','Corrected') : ''}
    <span class="text-base ${soon ? 'font-semibold text-yellow-900' : 'text-gray-700'}">${due ? `Next due ${due}` : 'No next date'}</span>
    <a class="inline-flex min-h-11 items-center px-2 text-base font-medium text-blue-600 underline underline-offset-2">Open</a></li>`).join('')}</ul>
  <p class="mt-3 border-t border-gray-100 pt-3 text-base">${link('See all vaccinations (6)','arrowRight')}</p>` : `<p class="text-base text-gray-600">No vaccinations yet.</p>`,
  archived ? '' : `<a class="${BTN_OUTLINE} font-semibold">${ic('plus')}Add vaccination</a>`);

const ownerCard = (gray = false) => `
<section class="${CARD}">
  <h2 class="mb-3 text-xl font-semibold">Owner</h2>
  <div class="flex items-center gap-3">${ownerSm(gray)}<div class="min-w-0"><p class="text-base">${link('Liza Cruz')}</p><p class="text-sm text-gray-700">0917 123 4567</p></div></div>
  <p class="mt-3 flex items-start gap-2 text-sm text-gray-700">${ic('mail','mt-0.5 size-4 shrink-0')}<span class="break-all">liza.cruz@gmail.com</span></p>
</section>`;

const actionsCard = kind => `
<section class="${CARD}">
  <h2 class="mb-4 text-xl font-semibold">What would you like to do?</h2>
  <div class="space-y-3">${
    kind === 'archived' ? `${act.primary('rotate','Restore Brownie')}
      <p class="flex items-start gap-2 rounded-lg bg-gray-50 px-3 py-3 text-sm text-gray-700">${ic('info','mt-0.5 size-4 shrink-0')}<span>Restore Brownie to book visits or add records.</span></p>`
    : kind === 'ownerArchived' ? `<p class="flex items-start gap-2 rounded-lg bg-gray-50 px-3 py-3 text-base text-gray-700">${ic('info','mt-0.5 size-5 shrink-0')}<span>Brownie's owner is archived. Restore Liza Cruz on their page to book visits or add records.</span></p>
      <a class="${BTN_OUTLINE} min-h-12 w-full font-semibold">${ic('users')}Open Liza Cruz's page</a>`
    : `${act.primary('calendar','Book walk-in')}
      ${act.outline('fileText','Add medical record')}
      ${act.outline('syringe','Add vaccination')}
      ${act.outline('pencil','Edit details')}`
  }</div>
</section>`;

const head = (gray = false, tag = '') => `
<a class="mb-2 inline-flex min-h-11 items-center gap-2 text-base font-medium text-blue-600 hover:underline">${ic('arrowLeft')}Back to pets</a>
<div class="mb-5 flex flex-wrap items-center gap-4">${petLg(!gray, gray)}
  <div><h1 class="flex flex-wrap items-center gap-3 text-2xl font-bold text-gray-900">Brownie${tag}</h1>
  <p class="mt-1 text-base text-gray-600">Dog · Aspin · 3 yrs · Owner: ${link('Liza Cruz')}</p></div>
</div>`;

const grid = (left, right) => `
<div class="grid items-start gap-6 grid-cols-[minmax(0,1fr)_20rem]">
  <div class="sticky top-6 col-start-2 row-start-1 space-y-6">${right}</div>
  <div class="col-start-1 row-start-1 space-y-6">${left}</div>
</div>`;

const deletionBanner = `<div class="mb-6 rounded-xl border border-yellow-300 bg-yellow-50 px-5 py-4 text-yellow-900">
  <div class="flex items-start gap-3">${ic('clock','mt-0.5 size-6 shrink-0')}
    <div class="min-w-0 flex-1"><p class="text-lg font-semibold">Liza Cruz asked to remove Brownie</p>
      <p class="mt-0.5 text-base">Asked Sat, Oct 31. Reason: <b>rehomed</b>.</p></div></div>
  <div class="mt-3 flex flex-wrap gap-3 pl-9">
    <button type="button" class="${BTN_OUTLINE} min-h-12 font-semibold">${ic('check')}Keep Brownie</button>
    <button type="button" class="${BTN} min-h-12 border border-red-300 bg-white font-semibold text-red-700 hover:bg-red-50">${ic('archive')}Archive Brownie</button>
  </div></div>`;

const page = (kind, overlay = '') => {
  const archived = kind === 'archived' || kind === 'ownerArchived';
  const has = kind !== 'new';
  const pre = kind === 'pending' ? deletionBanner
    : kind === 'archived' ? banner('gray','archive','Brownie is archived','Archived on Sun, Sep 20 after Liza Cruz asked to remove the pet (reason: rehomed). Records and vaccinations are kept.')
    : kind === 'ownerArchived' ? banner('gray','archive','Brownie\'s owner is archived','Liza Cruz was archived on Tue, Oct 27, so Brownie is hidden from walk-ins and online booking. Records and vaccinations are kept.') : '';
  const tag = kind === 'archived' ? pill('bg-gray-200 text-gray-800','archive','Archived') : kind === 'pending' ? pill('bg-yellow-100 text-yellow-900','clock','Deletion requested') : '';
  const right = actionsCard(archived ? kind : 'active') + ownerCard(kind === 'ownerArchived');
  const left = infoCard(kind !== 'new') + visitsCard(has) + recordsCard(has, archived) + vaccCard(has, archived);
  return frame(head(archived, tag) + pre + grid(left, right), overlay);
};

// ---------- Dialogs ----------
const dialogBox = inner => `<div class="absolute inset-0 flex items-start justify-center bg-gray-900/50 p-8 pt-24">
  <div class="w-[calc(100%-2rem)] max-w-lg rounded-2xl bg-white p-7 text-gray-900 shadow-xl">${inner}</div></div>`;
const dialogButtons = (ok, cls, icon) => `<div class="mt-6 flex flex-wrap justify-end gap-3">
  <button type="button" class="${BTN_OUTLINE} min-h-12 font-semibold ring-2 ring-violet-400 ring-offset-2">Go back</button>
  <button type="button" class="${cls} min-h-12 font-semibold">${ic(icon)}${ok}</button></div>`;
const archiveDialog = dialogBox(`
  <h2 class="text-xl font-bold">Archive Brownie?</h2>
  <p class="mt-2 text-base text-gray-700">Liza Cruz asked to remove Brownie (reason: rehomed). Brownie will be hidden from their account and from walk-ins. Medical records and vaccinations are kept, and you can restore Brownie later.</p>
  <div class="mt-4 flex items-start gap-3 rounded-lg border border-yellow-300 bg-yellow-50 px-4 py-3 text-base text-yellow-900">${ic('alert','mt-0.5 size-5 shrink-0')}<p><b>Brownie has a visit today at 2:00 PM.</b> Archiving doesn't cancel it. Cancel it on the appointment page if it won't happen.</p></div>
  <p class="mt-3 flex items-start gap-2 text-sm text-gray-700">${ic('mail','mt-0.5 size-4 shrink-0')}<span>Liza Cruz gets a notification, and an email if they have one.</span></p>
  ${dialogButtons('Yes, archive Brownie', BTN_DANGER, 'archive')}`);
const restoreDialog = dialogBox(`
  <h2 class="text-xl font-bold">Restore Brownie?</h2>
  <p class="mt-2 text-base text-gray-700">Brownie comes back on Liza Cruz's account and on the Pets list. You can book visits and add records again. The old deletion request stays in the history.</p>
  ${dialogButtons('Yes, restore Brownie', BTN_PRIMARY, 'rotate')}`);

// ---------- Phone ----------
const phoneView = () => `
<div class="w-[390px] overflow-hidden rounded-[2rem] border-8 border-gray-800 bg-gray-50 shadow-lg">
  <header class="flex h-16 items-center gap-3 border-b border-gray-200 bg-white px-4">
    <span class="${BTN_OUTLINE}">${ic('menu')}Menu</span>
    <div class="relative w-full"><span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-500">${ic('search')}</span><input type="search" placeholder="Find a pet or owner" class="${INPUT} pl-10"></div>
    <span class="${BTN_OUTLINE} px-3">${ic('bell')}<span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span>
  </header>
  <main class="space-y-6 px-4 py-6">
    <div class="-mb-6">${head()}</div>
    ${actionsCard('active')}
    ${ownerCard()}
    ${infoCard(true)}
    ${vaccCard(true, false)}
  </main>
</div>`;

const states = [
  { id:'full', label:'1 · Active pet', html: page('active'),
    caption:`<b>Pet detail.</b> Same frame and grid as the owner page. Header: back link, 64 px pet picture, name, and “Dog · Aspin · 3 yrs · Owner: Liza Cruz”. Right column (sticky): actions with <b>Book walk-in</b> as the one violet button, then Add medical record, Add vaccination, Edit details; below it an <b>Owner</b> card (name links to the owner page, phone, email). Left column: <b>Pet details</b> (two columns of label/value; empty ones say “Not given”), <b>Recent visits</b> (last 3), <b>Medical records</b> (last 3: date, diagnosis, a blue “Follow-up” pill; private notes are not shown here, only on the record), <b>Vaccinations</b> (last 3, with a yellow line when one is due within 30 days, and a “Corrected” pill). Each list links to its full page (the existing medical history and vaccination history pages). Today's page shows every record in full, with private notes; this keeps it short.` },
  { id:'new', label:'2 · New pet, nothing yet', html: page('new'),
    caption:`<b>A pet with no visits, records or vaccinations.</b> Each card says so in one line; the “Add record” / “Add vaccination” buttons stay in the card headers and in the actions card.` },
  { id:'pending', label:'3 · Deletion request waiting', html: page('pending'),
    caption:`<b>A deletion request is waiting.</b> Yellow tag next to the name, and a yellow banner with who asked, when and why, plus <b>Keep Brownie</b> and <b>Archive Brownie</b> right in the banner (same dialogs as the Deletion requests page). After answering you stay on this page.` },
  { id:'archive', label:'4 · Dialog: archive', html: page('pending', archiveDialog),
    caption:`<b>Archive from the pet page.</b> Same dialog as on the requests page, plus the same warning as the owner archive when the pet has a visit today or later (archiving doesn't cancel it).` },
  { id:'archived', label:'5 · Archived pet', html: page('archived'),
    caption:`<b>Archived pet.</b> Gray picture, “Archived” tag and a gray banner saying when and why. The only action is <b>Restore Brownie</b> (violet, with a confirmation, state 6). Add record / Add vaccination / Edit / Book walk-in are hidden, and the server refuses them too. Everything else stays readable.` },
  { id:'restore', label:'6 · Dialog: restore', html: page('archived', restoreDialog),
    caption:`<b>Restore asks first.</b> Violet confirm.` },
  { id:'ownerArchived', label:'7 · Owner archived', html: page('ownerArchived'),
    caption:`<b>The pet is fine but its owner is archived.</b> No Restore here (it would get out of step with the owner): the actions card says to restore the owner, with a button to the owner's page. Records stay readable.` },
  { id:'phone', label:'8 · Phone', html: phoneView(),
    caption:`<b>Phone width.</b> Actions first, then the Owner card, then Pet details (one column), visits, records and vaccinations.` }
];

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' +
      (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('full');
</script>
</body>
</html>
