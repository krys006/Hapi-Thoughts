const tabs = (active, nActive, nArchived) => {
  const t = (id, label, n) => id === active

  return `<nav class="mb-4 flex flex-wrap gap-2" aria-label="Show">${t('active','Active',nActive)}${t('archived','Archived',nArchived)}</nav>`;

// components/empty_state.html inside a card

const listHead = (title, n, note) => `
<div class="mb-2 flex flex-wrap items-baseline justify-between gap-2">
  <h2 class="text-lg font-semibold">${title} <span class="font-normal text-gray-600">(${n})</span></h2>
  <p class="text-sm text-gray-600">${note}</p>

function matches(o, q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hay = [o[0], o[1], o[2].replace(/\s/g, ''), o[2], o[3]].map(s => s.toLowerCase());
  return words.every(w => hay.some(h => h.includes(w)));
}

// ---------- Pages ----------

  header() + tabs('active', OWNERS.length, ARCHIVED.length) +

  listCard(OWNERS.slice(0, PAGE_SIZE).map(o => row(o)).join(''), pager(1, PAGE_SIZE, OWNERS.length)));

const searchPage = q => {
  const hits = OWNERS.filter(o => matches(o, q));
  return frame(header() + tabs('active', OWNERS.length, ARCHIVED.length) + resultsLine(q, hits.length, 'active owners') +
    listCard(hits.map(o => row(o)).join(''), pagerAll(hits.length)), q);
};

const noMatchPage = q => frame(
  header() + tabs('active', OWNERS.length, ARCHIVED.length) + resultsLine(q, 0, 'active owners') +
  empty('search', `No owner matches “${q}”`, 'Check the spelling, or look in the Archived tab. To add someone new, use Add owner at the top.'), q);

const archivedPage = () => frame(
  header() + tabs('archived', OWNERS.length, ARCHIVED.length) +
  `<div class="mb-4 flex items-start gap-3 rounded-lg border border-gray-300 bg-gray-100 px-4 py-3 text-base text-gray-900">${ic('archive','mt-0.5 size-5 shrink-0')}<p>Archived owners can't log in, and you can't book visits for them. Their pets, visits and records are kept. Open an owner to restore their account.</p></div>` +
  listHead('Archived owners', ARCHIVED.length, 'Newest first') +
  listCard(ARCHIVED.map(o => row(o, true)).join(''), pagerAll(ARCHIVED.length)));

const noOwnersPage = () => frame(
  header() + tabs('active', 0, 0) +
  empty('users', 'No pet owners yet', 'Owners appear here when they sign up online, or when you add them with Add owner or a walk-in.'));

// Phone: top bar = Menu + bell (this page's search is hidden below md); search moves into the page body
const phoneView = () => `
<div class="w-[390px] overflow-hidden rounded-[2rem] border-8 border-gray-800 bg-gray-50 shadow-lg">
  <header class="flex h-16 items-center gap-3 border-b border-gray-200 bg-white px-4">
    <span class="${BTN_OUTLINE}">${ic('menu')}Menu</span>
    <div class="relative ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
  </header>
  <main class="px-4 py-6">
    ${pageHeader('Pet owners', 'Everyone who brings a pet to the clinic.', `<a class="${BTN_PRIMARY}">${ic('userPlus')}Add owner</a>`)}
    ${ownerSearch('', 'mb-4 flex items-center gap-3')}
    ${tabs('active', OWNERS.length, ARCHIVED.length)}
    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm"><ul>
      ${OWNERS.slice(15, 18).map(([f, l, phone, email, pets]) => `
      <li class="border-t border-gray-100 p-4 first:border-t-0">
        <div class="flex items-start gap-3">${ownerAvatar(f, l)}
          <div class="min-w-0 flex-1"><p class="text-lg font-semibold">${f} ${l}</p>
            <p class="text-sm text-gray-700">${phone || 'No phone number'}</p>
            <p class="truncate text-sm text-gray-700">${email || 'No email'}</p>
            ${petsLine(pets)}</div></div>
        <span class="mt-3 flex min-h-11 items-center justify-center gap-2 rounded-lg border border-violet-300 bg-violet-50 text-base font-semibold text-violet-800">Open${ic('arrowRight')}</span>
      </li>`).join('')}
    </ul>${pager(1, 25, 32)}</div>
  </main>
</div>`;

// ---------- States ----------
const states = [
  { id:'active', label:'1 · Active (page 1)', html: activePage(),
    caption:`<b>Default view.</b> The frame now uses the real classes: sidebar <code>w-56 bg-violet-100</code> with the clinic logo + name block (<code>h-16</code>, level with the top bar), top bar <code>h-16 px-8</code>, page <code>px-8 py-6</code>, the default page header (<code>text-2xl</code> title, subtitle, actions on the right). Tabs, pager and Open button use the same classes as the appointments list. One row per owner: owner_avatar, name, phone, email, active pets with species icons. A to Z by first name, 25 per page. <b>Add owner</b> is the only violet button.` },
  { id:'search', label:'2 · Search “cruz”', html: searchPage('cruz'),
    caption:`<b>Search</b> replaces “Find a pet or owner” in the top bar on this page (same pattern as the appointments list). Every word must match first or last name, phone or email, inside the open tab. Results line + <b>Clear search</b>. Plain GET form, no type-ahead.` },
  { id:'nomatch', label:'3 · No match', html: noMatchPage('Bernardo'),
    caption:`<b>No match.</b> components/empty_state.html in a card. Points to the Archived tab and to Add owner.` },
  { id:'archived', label:'4 · Archived tab', html: archivedPage(),
    caption:`<b>Archived owners.</b> A grey note explains what archived means. Gray initials and an “Archived Oct 27” tag on each row. Newest archived first. Restoring is done on the owner page, with a confirmation.` },
  { id:'empty', label:'5 · No owners at all', html: noOwnersPage(),
    caption:`<b>Fresh install.</b> Only shows when there are no owners in either tab.` },
  { id:'phone', label:'6 · Phone', html: phoneView(),
    caption:`<b>Phone width</b> (below md). The top bar has Menu and the bell; this page's search moves into the page body, as on the appointments list. “Notifications” text is hidden below sm, so only the bell and the count show.` }
];

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' +
      (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('active');
</script>
</body>
</html>
