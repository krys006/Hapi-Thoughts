<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt list v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-200 text-gray-900 antialiased">
<header class="sticky top-0 z-30 border-b border-gray-300 bg-white/95 px-6 py-3 backdrop-blur">
  <p class="mb-2 text-sm font-semibold text-gray-700">Slice 6 · Receipt list v1 · frame copied from layouts/admin.html · today is Fri, Nov 6, 2026 · pick a state</p>
  <div id="switcher" class="flex flex-wrap gap-2"></div>
</header>
<div class="overflow-x-auto p-6">
  <div id="caption" class="mb-4 max-w-[1280px] rounded-xl border border-violet-200 bg-violet-50 p-4 text-base text-gray-800"></div>
  <div id="stage"></div>
  <p class="mt-3 text-sm text-gray-600">Desktop frame is 1280 px wide: a 1920×1080 screen at 150% zoom.</p>
</div>
<script>
// ---------- Icons (Lucide shapes; when built, copy new ones from lucide-static@1.66.0: printer, percent, ban) ----------
const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  bookOpen:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="m4.9 4.9 2.1 2.1"/><path d="m17 17 2.1 2.1"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.9 19.1 2.1-2.1"/><path d="m17 7 2.1-2.1"/>',
  logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrowRight:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  arrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  phone:'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  circleCheck:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  printer:'<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  percent:'<line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  ban:'<circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/>',
  dog:'<path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/>'
};
const ic = (n, c = 'size-5 shrink-0', s = 2) =>
  `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shared classes (assets/tailwind/input.css) ----------
const BTN = 'inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-base font-medium whitespace-nowrap transition-colors';
const BTN_PRIMARY = `${BTN} bg-violet-600 text-white hover:bg-violet-700`;
const BTN_OUTLINE = `${BTN} border border-gray-300 bg-white text-gray-800 hover:bg-gray-50`;
const BTN_DANGER = `${BTN} bg-red-600 text-white hover:bg-red-700`;
const BTN_RED_OUTLINE = `${BTN} border border-red-300 bg-white font-semibold text-red-700 hover:bg-red-50`;
const INPUT = 'block min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-base text-gray-900 placeholder:text-gray-500';
const CARD = 'rounded-xl border border-gray-200 bg-white p-6 shadow-sm';

// ---------- Frame ----------
const navLink = (icon, label, active = false, count = 0) =>
  `<a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base ${active ? 'bg-white font-semibold text-violet-800 shadow-sm ring-1 ring-violet-200' : 'text-gray-800 hover:bg-violet-200/70'}">${ic(icon)}<span class="flex-1">${label}</span>${count ? `<span class="rounded-full bg-violet-600 px-2 text-sm font-semibold text-white">${count}</span>` : ''}</a>`;
const sidebar = () => `
<aside class="flex w-56 shrink-0 flex-col border-r border-violet-200 bg-violet-100">
  <div class="flex h-16 shrink-0 items-center gap-3 px-5">
    <a class="-mx-2 flex min-h-11 min-w-0 flex-1 items-center gap-3 rounded-lg px-2"><span class="grid size-10 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image')}</span>
      <p class="line-clamp-2 text-base font-semibold leading-5 text-gray-900">Hapi Tutz Vet. Supplies</p></a>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-2">
    <p class="px-3 pb-1 pt-1 text-sm font-semibold text-violet-800">Daily work</p>
    ${navLink('house','Dashboard')}${navLink('calendar','Appointments',false,2)}${navLink('users','Pet owners')}${navLink('paw','Pets')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Records</p>
    ${navLink('fileText','Medical records')}${navLink('syringe','Vaccinations')}${navLink('bookOpen','Health library')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Clinic</p>
    ${navLink('receipt','Billing',true)}${navLink('settings','Clinic settings')}
  </nav>
  <div class="border-t border-violet-200 px-3 py-3"><a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base text-gray-800">${ic('logout')}Log out</a></div>
</aside>`;
const frame = (body, overlay = '', search = '') => `
<div class="relative flex min-h-[900px] w-[1280px] overflow-hidden rounded-xl border border-gray-300 bg-gray-50 shadow-sm">
  ${sidebar()}
  <div class="min-w-0 flex-1">
    <header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-8">
      ${search}
      <div class="ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span>Notifications</span><span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
    </header>
    <main class="px-8 py-6">${body}</main>
  </div>
  ${overlay}
</div>`;

// ---------- Pieces ----------
const peso = n => '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const aLink = t => `<a class="font-medium text-blue-600 underline underline-offset-2">${t}</a>`;
const pill = (cls, icon, text) => `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-sm font-medium ${cls}">${icon ? ic(icon,'size-4 shrink-0') : ''}${text}</span>`;
const BADGE = {
  pending: pill('bg-yellow-100 text-yellow-800', 'clock', 'Unpaid'),
  paid: pill('bg-green-100 text-green-800', 'check', 'Paid'),
  cancelled: pill('bg-red-100 text-red-800', 'ban', 'Cancelled')
};
const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('');
const avatar = (n, muted) => `<span class="grid size-10 shrink-0 place-content-center rounded-full text-base font-semibold ring-1 ${muted ? 'bg-gray-100 text-gray-700 ring-gray-300' : 'bg-violet-100 text-violet-800 ring-violet-200'}" aria-hidden="true">${initials(n)}</span>`;

const searchForm = (q = '', where = 'top') => `
<form class="flex w-full ${where === 'top' ? 'max-w-[36rem]' : ''} items-center gap-2" role="search">
  <label class="sr-only">Search receipts</label>
  <div class="relative flex-1"><span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-600">${ic('search')}</span>
  <input type="search" value="${q}" placeholder="Search receipts: number, owner or pet" class="${INPUT} pl-10"></div>
  <button type="submit" class="${BTN_OUTLINE} font-semibold">Search</button>
</form>`;

// ---------- Data (today is Fri, Nov 6, 2026) ----------
const UNPAID = [
  { n:'HV-2026-0009', s:'pending', owner:'Liza Cruz', pet:'Brownie', line:'Created Mon, Nov 2 · From the visit Mon, Nov 2', total:1180 },
  { n:'HV-2026-0012', s:'pending', owner:'Ana Cruz', pet:'Bantay', line:'Created Today · From the visit Today at 9:00 AM', total:630 },
  { n:'HV-2026-0013', s:'pending', owner:'Jun Reyes', pet:'', line:'Created Today · Over the counter', total:990 },
  { n:'HV-2026-0014', s:'pending', owner:'Marites Lopez', pet:'Bella', line:'Created Today · From the visit Today at 10:00 AM', total:0, empty:true }
];
const PAID = [
  { n:'HV-2026-0010', s:'paid', owner:'Rosa Dela Cruz', pet:'Max', line:'Paid Today · From the visit Today at 8:00 AM', total:450 },
  { n:'HV-2026-0008', s:'paid', owner:'Noel Gonzales', pet:'Spot', line:'Paid Yesterday · From the visit Thu, Nov 5', total:2350 },
  { n:'HV-2026-0007', s:'paid', owner:'Carmen Villanueva', pet:'Mingming', line:'Paid Yesterday · Over the counter', total:385 },
  { n:'HV-2026-0006', s:'paid', owner:'Liza Cruz', pet:'Brownie', line:'Paid Wed, Nov 4 · From the visit Wed, Nov 4', total:800 },
  { n:'HV-2026-0005', s:'paid', owner:'Pedro Santos', pet:'Choco', line:'Paid Tue, Nov 3 · From the visit Tue, Nov 3', total:0 }
];
const CANCELLED = [
  { n:'HV-2026-0011', s:'cancelled', owner:'Ana Cruz', pet:'Bantay', line:'Created Today · From the visit Today at 9:00 AM', total:300 },
  { n:'HV-2026-0003', s:'cancelled', owner:'Jun Reyes', pet:'', line:'Created Sun, Nov 1 · Over the counter', total:0, empty:true }
];
const ALL = [...UNPAID.slice().reverse(), PAID[0], CANCELLED[0], ...PAID.slice(1)].sort((a, b) => b.n.localeCompare(a.n));

// ---------- Page parts ----------
const pageHeader = () => `
<div class="mb-6 flex flex-wrap items-start justify-between gap-4">
  <div><h1 class="text-2xl font-bold text-gray-900">Billing</h1>
    <p class="mt-1 text-base text-gray-700">Receipts for visits and supplies. Payment is cash.</p></div>
  <a class="${BTN_PRIMARY} font-semibold">${ic('plus')}New receipt</a>
</div>`;

const COUNTS = { pending: 4, paid: 128, cancelled: 2, all: 134 };
const tab = (label, count, active, countCls = 'bg-gray-100 text-gray-800') => `
<a class="inline-flex min-h-12 items-center gap-2 rounded-lg px-4 text-base ${active ? 'bg-violet-50 font-semibold text-violet-800 ring-2 ring-violet-600' : 'text-gray-800 hover:bg-gray-100'}" ${active ? 'aria-current="page"' : ''}>${label}${count !== null ? `<span class="rounded-full px-2 text-sm font-semibold ${active && !countCls.includes('yellow') ? 'bg-violet-100 text-violet-800' : countCls}">${count}</span>` : ''}</a>`;
const tabs = (active, counts = COUNTS) => `
<nav aria-label="Billing sections" class="mb-6 flex flex-wrap items-center gap-2 rounded-xl border border-gray-200 bg-white p-2 shadow-sm">
  ${tab('Unpaid', counts.pending, active === 'pending', counts.pending ? 'bg-yellow-200 text-yellow-900' : 'bg-gray-100 text-gray-800')}
  ${tab('Paid', counts.paid, active === 'paid')}
  ${tab('Cancelled', counts.cancelled, active === 'cancelled')}
  ${tab('All', counts.all, active === 'all')}
  <span class="mx-2 h-8 w-px bg-gray-300" aria-hidden="true"></span>
  <a class="inline-flex min-h-12 items-center gap-2 rounded-lg px-4 text-base text-gray-800 hover:bg-gray-100">${ic('fileText')}Services and prices</a>
</nav>`;

const listHead = (title, sort) => `
<div class="mb-3 flex flex-wrap items-baseline justify-between gap-2">
  <h2 class="text-xl font-semibold text-gray-900">${title}</h2><p class="text-sm text-gray-700">${sort}</p>
</div>`;

const results = (txt) => `
<div class="mb-3 flex flex-wrap items-center justify-between gap-3">
  <h2 class="text-xl font-semibold text-gray-900" aria-live="polite">${txt}</h2>
  <a class="${BTN_OUTLINE} font-semibold">${ic('x')}Clear search</a>
</div>`;

const ROW_COLS = 'grid-cols-[minmax(0,1.1fr)_1px_minmax(0,1fr)_9rem_auto]';
const row = (r, showBadge) => {
  const muted = r.s === 'cancelled';
  return `
<li class="grid ${ROW_COLS} items-center gap-5 border-b border-gray-100 px-5 py-4 last:border-b-0 hover:bg-gray-50">
  <div class="flex min-w-0 items-center gap-3">
    <span class="grid size-10 shrink-0 place-content-center rounded-xl ring-1 ${muted ? 'bg-gray-100 text-gray-600 ring-gray-300' : 'bg-violet-50 text-violet-700 ring-violet-200'}">${ic('receipt')}</span>
    <div class="min-w-0">
      <p class="flex flex-wrap items-center gap-2 text-lg font-semibold text-gray-900">${r.n}${showBadge ? BADGE[r.s] : ''}</p>
      <p class="text-sm text-gray-700">${r.line}</p>
    </div>
  </div>
  <span class="h-10 w-px bg-gray-200" aria-hidden="true"></span>
  <div class="flex min-w-0 items-center gap-3">
    ${avatar(r.owner, muted)}
    <div class="min-w-0"><p class="text-base">${aLink(r.owner)}</p>
      <p class="text-sm text-gray-700">${r.pet ? `for ${r.pet}` : 'not for a specific pet'}</p></div>
  </div>
  <div class="text-right"><p class="text-lg font-semibold ${muted ? 'text-gray-600 line-through decoration-gray-400' : 'text-gray-900'}">${peso(r.total)}</p>${r.empty ? '<p class="text-sm text-gray-700">No items yet</p>' : ''}</div>
  <a class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-violet-300 bg-violet-50 px-5 text-base font-semibold text-violet-800 hover:border-violet-400 hover:bg-violet-100">Open<span class="sr-only"> receipt ${r.n}</span>${ic('arrowRight')}</a>
</li>`;
};
const listCard = (rows, showBadge = false, pager = '') => `
<section class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
  <div class="grid ${ROW_COLS} gap-5 border-b border-gray-200 bg-gray-50 px-5 py-2 text-sm font-semibold text-gray-700" aria-hidden="true">
    <span>Receipt</span><span></span><span>Billed to</span><span class="text-right">Total</span><span class="w-[7.5rem]"></span></div>
  <ul>${rows.map(r => row(r, showBadge)).join('')}</ul>${pager}
</section>`;
const pager = (txt) => `
<div class="flex flex-wrap items-center justify-between gap-3 border-t border-gray-200 bg-gray-50 px-5 py-3">
  <span class="${BTN_OUTLINE} cursor-not-allowed text-gray-500" aria-disabled="true">${ic('arrowLeft')}Previous</span>
  <p class="text-base text-gray-700">${txt}</p>
  <a class="${BTN_OUTLINE} font-semibold">Next${ic('arrowRight')}</a>
</div>`;

const note = (icon, html, cls = 'border-gray-200 bg-gray-50 text-gray-800') => `
<p class="mb-4 flex items-start gap-2 rounded-lg border px-4 py-3 text-base ${cls}">${ic(icon,'mt-0.5 size-5 shrink-0')}<span>${html}</span></p>`;

const emptyState = (icon, title, text, extra = '') => `
<section class="rounded-xl border border-gray-200 bg-white px-6 py-12 text-center shadow-sm">
  <span class="mx-auto grid size-14 place-content-center rounded-full bg-gray-100 text-gray-600">${ic(icon,'size-7')}</span>
  <p class="mt-3 text-lg font-semibold text-gray-900">${title}</p>
  <p class="mt-1 text-base text-gray-700">${text}</p>${extra}
</section>`;

const page = (body, q = '') => frame(`${pageHeader()}${body}`, '', searchForm(q));

// ---------- Phone ----------
const phoneRow = r => `
<li class="border-b border-gray-100 p-4 last:border-b-0">
  <a class="group block">
    <div class="flex items-start justify-between gap-3">
      <p class="text-lg font-semibold">${r.n}</p><p class="text-lg font-semibold">${peso(r.total)}</p>
    </div>
    <p class="text-sm text-gray-700">${r.line}</p>
    <div class="mt-2 flex items-center gap-3 rounded-lg bg-gray-50 p-3">${avatar(r.owner)}<div><p class="text-base font-medium">${r.owner}</p><p class="text-sm text-gray-700">${r.pet ? `for ${r.pet}` : 'not for a specific pet'}</p></div></div>
    ${r.empty ? '<p class="mt-2 text-sm text-gray-700">No items yet</p>' : ''}
    <span class="mt-3 flex min-h-11 w-full items-center justify-center gap-2 rounded-lg border border-violet-300 bg-violet-50 text-base font-semibold text-violet-800 group-hover:bg-violet-100">Open${ic('arrowRight')}</span>
  </a>
</li>`;
const phoneView = () => `
<div class="w-[390px] overflow-hidden rounded-[2rem] border-8 border-gray-800 bg-gray-50 shadow-lg">
  <header class="flex h-16 items-center gap-3 border-b border-gray-200 bg-white px-4">
    <span class="${BTN_OUTLINE}">${ic('menu')}Menu</span>
    <div class="ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
  </header>
  <main class="space-y-4 px-4 py-6">
    <div><h1 class="text-2xl font-bold">Billing</h1><p class="mt-1 text-base text-gray-700">Receipts for visits and supplies. Payment is cash.</p></div>
    <a class="${BTN_PRIMARY} w-full font-semibold">${ic('plus')}New receipt</a>
    ${searchForm('', 'page')}
    <nav aria-label="Billing sections" class="grid grid-cols-2 gap-2 rounded-xl border border-gray-200 bg-white p-2">
      ${tab('Unpaid', 4, true, 'bg-yellow-200 text-yellow-900')}${tab('Paid', 128, false)}${tab('Cancelled', 2, false)}${tab('All', 134, false)}
      <a class="col-span-2 inline-flex min-h-12 items-center justify-center gap-2 rounded-lg border-t border-gray-200 text-base text-gray-800">${ic('fileText')}Services and prices</a>
    </nav>
    <div><h2 class="text-xl font-semibold">Unpaid receipts (4)</h2><p class="text-sm text-gray-700">Oldest first</p></div>
    <section class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm"><ul>${UNPAID.slice(0, 2).map(phoneRow).join('')}</ul></section>
    <p class="text-center text-sm text-gray-600">… 2 more rows</p>
  </main>
</div>`;

// ---------- States ----------
const states = [
  { id:'unpaid', label:'1 · Unpaid (default)',
    html: page(`${tabs('pending')}${listHead('Unpaid receipts (4)','Oldest first')}${listCard(UNPAID)}`),
    caption:`<b>Billing opens on Unpaid</b> (the dashboard's “Unpaid bills” card links here; <code>?status=pending</code> keeps working). Header “Billing” with <b>New receipt</b> the one violet button. Search moves into the top bar: “Search receipts: number, owner or pet”, it stays inside the open tab. Tabs <b>Unpaid · Paid · Cancelled · All</b> with counts (Unpaid's count yellow while there are any), then <b>Services and prices</b> after a divider (as Deletion requests on the Pets page). Rows (one card, split like the medical lists): receipt tile, number, “Created … · From the visit …” or “Over the counter”; owner (link to their page) and the pet or “not for a specific pet”; the total; light-violet <b>Open</b>. An empty receipt shows ₱0.00 and “No items yet”. Oldest first, so the longest-waiting bill is on top. The split pane and the New Receipt modal are gone: Open goes to the receipt page.` },
  { id:'paid', label:'2 · Paid',
    html: page(`${tabs('paid')}${listHead('Paid receipts (128)','Newest paid first')}${listCard(PAID, false, pager('Page 1 of 6 · 25 per page'))}`),
    caption:`<b>Paid tab</b>: newest paid first, the date paid on each row (“Paid Today”, “Paid Yesterday”, “Paid Wed, Nov 4”), 25 per page with the shared pager (Previous disabled on page 1). A ₱0.00 paid receipt (a free check-up) is allowed.` },
  { id:'cancelled', label:'3 · Cancelled',
    html: page(`${tabs('cancelled')}${listHead('Cancelled receipts (2)','Newest first')}${note('info','Cancelled receipts are kept for the clinic. Owners don\'t see them, and they can\'t be changed.')}${listCard(CANCELLED)}`),
    caption:`<b>Cancelled tab</b>: a gray note says what cancelled means, rows have a gray tile and avatar and the total struck through (it was never charged).` },
  { id:'all', label:'4 · All',
    html: page(`${tabs('all')}${listHead('All receipts (134)','Newest first')}${listCard(ALL.slice(0, 7), true, pager('Page 1 of 6 · 25 per page'))}`),
    caption:`<b>All tab</b>: every status, newest receipt number first, and only here each row also gets its status badge (Unpaid / Paid / Cancelled).` },
  { id:'search', label:'5 · Search',
    html: page(`${tabs('pending')}${results('2 receipts match “cruz” in unpaid receipts')}${listCard(UNPAID.slice(0, 2))}`, 'cruz'),
    caption:`<b>Search</b> matches the receipt number (“0012” or “HV-2026-0012”), the owner's first or last name and the pet's name; every word must match. It stays inside the tab; the tabs keep the search, the counts don't change with it. Results line + <b>Clear search</b> (keeps the tab). No match: “No receipt matches “…” in unpaid receipts” + “Check the spelling, try another tab, or clear the search.”` },
  { id:'none', label:'6 · Nothing unpaid',
    html: page(`${tabs('pending', { pending: 0, paid: 128, cancelled: 2, all: 130 })}${emptyState('circleCheck','Nothing unpaid','Every receipt is paid or cancelled.', `<p class="mt-3">${aLink('See paid receipts')}</p>`)}`),
    caption:`<b>Empty states</b>: Unpaid “Nothing unpaid” (count turns gray) with a link to Paid; Paid “No paid receipts yet”; Cancelled “No cancelled receipts”; All (no receipts at all) “No receipts yet” + “Make one with New receipt, or from a visit's page.”` },
  { id:'phone', label:'7 · Phone', html: phoneView(),
    caption:`<b>Phone width.</b> Search in the page body (the top bar is too narrow), New receipt full width, tabs as a 2×2 grid with Services and prices under them, each receipt one card-link: number and total, the date line, the owner in a gray box, Open full width.` }
];

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' + (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('unpaid');
</script>
</body>
</html>
