<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaccination form v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-200 text-gray-900 antialiased">
<header class="sticky top-0 z-30 border-b border-gray-300 bg-white/95 px-6 py-3 backdrop-blur">
  <p class="mb-2 text-sm font-semibold text-gray-700">Slice 5 · Vaccination form (new + edit) v1 · frame copied from layouts/admin.html · today is Tue, Nov 3, 2026 · pick a state</p>
  <div id="switcher" class="flex flex-wrap gap-2"></div>
</header>
<div class="overflow-x-auto p-6">
  <div id="caption" class="mb-4 max-w-[1280px] rounded-xl border border-violet-200 bg-violet-50 p-4 text-base text-gray-800"></div>
  <div id="stage"></div>
  <p class="mt-3 text-sm text-gray-600">Desktop frame is 1280 px wide: a 1920×1080 screen at 150% zoom. The grey picture tile stands in for an uploaded pet photo.</p>
</div>
<script>
// ---------- Icons (Lucide shapes; new ones must be copied from lucide-static@1.66.0 when built) ----------
const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  bookOpen:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="m4.9 4.9 2.1 2.1"/><path d="m17 17 2.1 2.1"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.9 19.1 2.1-2.1"/><path d="m17 7 2.1-2.1"/>',
  logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrowRight:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  arrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  phone:'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  upload:'<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
  archive:'<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  chevronDown:'<path d="m6 9 6 6 6-6"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  dog:'<path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/>'
};
const ic = (n, c = 'size-5 shrink-0', s = 2) =>
  `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shared classes (assets/tailwind/input.css) ----------
const BTN = 'inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-base font-medium whitespace-nowrap transition-colors';
const BTN_PRIMARY = `${BTN} bg-violet-600 text-white hover:bg-violet-700`;
const BTN_OUTLINE = `${BTN} border border-gray-300 bg-white text-gray-800 hover:bg-gray-50`;
const BTN_DANGER = `${BTN} bg-red-600 text-white hover:bg-red-700`;
const BTN_RED_OUTLINE = `${BTN} border border-red-300 bg-white font-semibold text-red-700 hover:bg-red-50`;
const INPUT = 'block min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-base text-gray-900 placeholder:text-gray-500';
const CARD = 'rounded-xl border border-gray-200 bg-white p-6 shadow-sm';

// ---------- Frame ----------
const navLink = (icon, label, active = false, count = 0) =>
  `<a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base ${active ? 'bg-white font-semibold text-violet-800 shadow-sm ring-1 ring-violet-200' : 'text-gray-800 hover:bg-violet-200/70'}">${ic(icon)}<span class="flex-1">${label}</span>${count ? `<span class="rounded-full bg-violet-600 px-2 text-sm font-semibold text-white">${count}</span>` : ''}</a>`;
const sidebar = () => `
<aside class="flex w-56 shrink-0 flex-col border-r border-violet-200 bg-violet-100">
  <div class="flex h-16 shrink-0 items-center gap-3 px-5">
    <a class="-mx-2 flex min-h-11 min-w-0 flex-1 items-center gap-3 rounded-lg px-2"><span class="grid size-10 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image')}</span>
      <p class="line-clamp-2 text-base font-semibold leading-5 text-gray-900">Hapi Tutz Vet. Supplies</p></a>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-2">
    <p class="px-3 pb-1 pt-1 text-sm font-semibold text-violet-800">Daily work</p>
    ${navLink('house','Dashboard')}${navLink('calendar','Appointments',false,2)}${navLink('users','Pet owners')}${navLink('paw','Pets',false,2)}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Records</p>
    ${navLink('fileText','Medical records')}${navLink('syringe','Vaccinations',true)}${navLink('bookOpen','Health library')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Clinic</p>
    ${navLink('receipt','Billing')}${navLink('settings','Clinic settings')}
  </nav>
  <div class="border-t border-violet-200 px-3 py-3"><a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base text-gray-800">${ic('logout')}Log out</a></div>
</aside>`;
const frame = (body, overlay = '') => `
<div class="relative flex min-h-[900px] w-[1280px] overflow-hidden rounded-xl border border-gray-300 bg-gray-50 shadow-sm">
  ${sidebar()}
  <div class="min-w-0 flex-1">
    <header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-8">
      <div class="relative w-full max-w-[30rem]"><span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-600">${ic('search')}</span><input type="search" placeholder="Find a pet or owner" class="${INPUT} pl-10"></div>
      <div class="ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span>Notifications</span><span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
    </header>
    <main class="px-8 py-6">${body}</main>
  </div>
  ${overlay}
</div>`;

// ---------- Pieces ----------
const link = (t, i = '') => `<a class="inline-flex min-h-11 items-center gap-2 text-base font-medium text-blue-600 underline underline-offset-2">${i ? ic(i) : ''}${t}</a>`;
const req = ' <span class="text-red-700">*</span>';
const opt = ' <span class="font-normal text-gray-600">(optional)</span>';
const errLine = e => e ? `<p class="mt-1 flex items-center gap-1.5 text-base text-red-700">${ic('alert','size-4 shrink-0')}${e}</p>` : '';
const errCls = e => e ? 'border-red-600 ring-1 ring-red-600' : '';
const input = (label, value, { required = false, placeholder = '', help = '', err = '', type = 'text', w = '' } = {}) => `
<div><label class="block text-base font-semibold text-gray-900">${label}${required ? req : opt}</label>
  <input type="${type}" value="${value}" placeholder="${placeholder}" class="${INPUT} mt-1 ${w} ${errCls(err)}">
  ${help ? `<p class="mt-1 text-sm text-gray-700">${help}</p>` : ''}${errLine(err)}</div>`;
const VACCINES = ['Deworming','Ivermectin','Anti-rabies','6-in-1','7-in-1','8-in-1','Bordetella'];
const select = (value, err = '') => `
<div><label class="block text-base font-semibold text-gray-900">Vaccine${req}</label>
  <div class="relative mt-1 max-w-sm">
    <select class="${INPUT} appearance-none pr-10 ${errCls(err)}">
      <option ${value === '' ? 'selected' : ''}>Choose one</option>
      ${VACCINES.map(v => `<option ${v === value ? 'selected' : ''}>${v}</option>`).join('')}
      <option ${value === 'Other' ? 'selected' : ''}>Other (type it)</option>
    </select>
    <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-600">${ic('chevronDown')}</span>
  </div>
  ${errLine(err)}</div>`;

const petAvatarSm = (species, photo) => photo
  ? `<span class="grid size-10 shrink-0 place-content-center rounded-xl bg-gradient-to-br from-stone-300 to-stone-500 text-white">${ic('image')}</span>`
  : `<span class="grid size-10 shrink-0 place-content-center rounded-xl bg-violet-50 text-violet-600 ring-1 ring-violet-200">${ic(species,'size-6 shrink-0',1.5)}</span>`;

const V = {
  standalone: { mode:'add', pet:'Bella', species:'dog', owner:'Marites Lopez', record:'', back:'Back to Bella',
    vaccine:'', typed:'', given:'2026-11-03', givenHelp:'Today.', due:'', weight:'', site:'', batch:'', maker:'', by:'Dr. Edgar Sadiwa',
    after:"After saving you'll see Bella's vaccinations with the new one at the top." },
  onRecord: { mode:'add', pet:'Brownie', species:'dog', photo:true, owner:'Liza Cruz', record:'Mon, Nov 2', back:'Back to the record',
    vaccine:'8-in-1', typed:'', given:'2026-11-02', givenHelp:'Taken from the record.', due:'2027-11-02', dueHelp:'Tuesday, November 2, 2027 · in 1 year', weight:'12.5', site:'Right hind leg', batch:'A2311-07', maker:'Zoetis', by:'Dr. Edgar Sadiwa',
    after:"After saving you'll go back to the record." },
  other: { mode:'add', pet:'Chloe', species:'cat', owner:'Nena Reyes', record:'', back:'Back to Chloe',
    vaccine:'Other', typed:'FVRCP', given:'2026-11-03', givenHelp:'Today.', due:'2027-11-03', dueHelp:'Wednesday, November 3, 2027 · in 1 year', weight:'3.8', site:'', batch:'', maker:'', by:'Dr. Edgar Sadiwa',
    after:"After saving you'll see Chloe's vaccinations with the new one at the top." },
  errors: { mode:'add', pet:'Bella', species:'dog', owner:'Marites Lopez', record:'', back:'Back to Bella', count:3,
    vaccine:'Other', typed:'', typedErr:'Type the vaccine name.', given:'2026-11-30', givenErr:"The date given can't be in the future.", due:'2026-11-10', dueErr:'The next dose must be after the date given.', weight:'', site:'', batch:'', maker:'', by:'Dr. Edgar Sadiwa',
    after:"After saving you'll see Bella's vaccinations with the new one at the top." },
  edit: { mode:'edit', pet:'Brownie', species:'dog', photo:true, owner:'Liza Cruz', record:'Tue, Oct 6', back:"Back to Brownie's vaccinations",
    vaccine:'8-in-1', typed:'', given:'2026-10-06', due:'2026-11-05', dueHelp:'Thursday, November 5 · in 2 days', weight:'12.5', site:'Right hind leg', batch:'A2311-07', maker:'Zoetis', by:'Dr. Edgar Sadiwa',
    history:['Wed, Oct 7, 2026: Next dose date was typed as Oct 5, 2027. It is Nov 5, 2026.'] },
  editErr: { mode:'edit', pet:'Brownie', species:'dog', photo:true, owner:'Liza Cruz', record:'Tue, Oct 6', back:"Back to Brownie's vaccinations", count:1,
    vaccine:'8-in-1', typed:'', given:'2026-10-05', changed:true, due:'2026-11-05', dueHelp:'Thursday, November 5 · in 2 days', weight:'12.5', site:'Right hind leg', batch:'A2311-07', maker:'Zoetis', by:'Dr. Edgar Sadiwa',
    history:['Wed, Oct 7, 2026: Next dose date was typed as Oct 5, 2027. It is Nov 5, 2026.'], reasonErr:'You changed the date given. Write why, so the change is on record.' },
};

const headerBlock = v => `
<p class="mb-2">${link(v.back,'arrowLeft')}</p>
<h1 class="text-2xl font-bold text-gray-900">${v.mode === 'add' ? `New vaccination for ${v.pet}` : `Edit vaccination · ${v.pet}`}</h1>
<p class="mt-1 text-base text-gray-600">${v.mode === 'add' ? 'Required: the vaccine and the date given.' : 'Fix the label details freely. A change to the vaccine, dates, weight or site is a correction and needs a reason.'}</p>`;

const whoCard = v => `
<section class="${CARD}">
  <div class="flex flex-wrap items-center gap-4">${petAvatarSm(v.species, v.photo)}
    <div class="min-w-0 flex-1"><p class="text-sm text-gray-600">Pet</p><p class="text-lg font-semibold text-gray-900">${v.pet} <span class="text-base font-normal text-gray-700">· Owner: ${v.owner}</span></p></div></div>
  <p class="mt-3 flex items-center gap-2 rounded-lg ${v.record ? 'bg-violet-50 text-gray-900' : 'bg-gray-50 text-gray-700'} px-3 py-2 text-base">${ic('fileText','size-5 shrink-0 text-gray-600')}${v.record ? `Part of the visit record from <b class="font-semibold">${v.record}</b>` : 'Not part of a visit record'}</p>
</section>`;

const clinicalCard = v => `
<section class="${CARD} space-y-5">
  <div class="flex flex-wrap items-start justify-between gap-2">
    <h2 class="flex items-center gap-2 text-xl font-semibold">${ic('syringe','size-5 shrink-0 text-gray-600')}The vaccination</h2>
    ${v.mode === 'edit' ? `<span class="inline-flex items-center gap-1.5 rounded-full bg-gray-100 px-2.5 py-1 text-sm font-medium text-gray-800">${ic('pencil','size-4 shrink-0')}Changing these is a correction</span>` : ''}
  </div>
  ${select(v.vaccine)}
  ${v.vaccine === 'Other' ? `<div class="border-l-4 border-violet-200 pl-4">${input('Vaccine name', v.typed, { required: true, placeholder: 'For example: FVRCP', err: v.typedErr, w: 'max-w-sm' })}</div>` : ''}
  <div class="grid grid-cols-2 gap-4">
    ${input('Date given', v.given, { required: true, type: 'date', help: v.givenHelp, err: v.givenErr })}
    ${input('Next dose due', v.due, { type: 'date', help: v.dueHelp || 'Leave empty if no next dose. The owner gets a reminder before it.', err: v.dueErr })}
  </div>
  <div class="grid grid-cols-2 gap-4">
    ${input('Weight (kg)', v.weight, { placeholder: 'For example: 12.5' })}
    ${input('Where it was given', v.site, { placeholder: 'For example: Right hind leg' })}
  </div>
</section>`;

const labelCard = v => `
<section class="${CARD} space-y-5">
  <h2 class="flex items-center gap-2 text-xl font-semibold">${ic('info','size-5 shrink-0 text-gray-600')}From the vial label</h2>
  <div class="grid grid-cols-2 gap-4">
    ${input('Batch / lot no.', v.batch, { placeholder: 'For example: A2311-07' })}
    ${input('Maker', v.maker, { placeholder: 'For example: Zoetis' })}
  </div>
  ${input('Given by', v.by, { help: v.mode === 'add' ? 'Filled in with the clinic vet from Clinic settings.' : '', w: 'max-w-sm' })}
  ${v.mode === 'edit' ? '<p class="text-sm text-gray-700">These can be fixed any time without a reason.</p>' : ''}
</section>`;

const correctionCard = v => v.mode !== 'edit' ? '' : `
<section class="rounded-xl border-2 ${v.reasonErr ? 'border-red-300' : 'border-gray-300'} bg-white p-6 shadow-sm">
  <h2 class="flex items-center gap-2 text-xl font-semibold">${ic('pencil','size-5 shrink-0 text-gray-600')}Reason for a correction</h2>
  <p class="mt-1 text-base text-gray-700">Needed only if you change something in “The vaccination”. The record then shows a <b>Corrected</b> tag with this reason and today's date.</p>
  ${v.changed ? `<p class="mt-3 flex items-start gap-2 rounded-lg bg-yellow-50 px-3 py-2 text-base text-gray-900">${ic('alert','mt-0.5 size-5 shrink-0 text-yellow-700')}You changed: <b>Date given</b> (was Tue, Oct 6).</p>` : ''}
  <textarea rows="2" placeholder="For example: wrong date typed, it was given the day before" class="${INPUT} mt-3 ${errCls(v.reasonErr)}"></textarea>
  ${errLine(v.reasonErr)}
  ${v.history ? `<div class="mt-4 rounded-lg bg-gray-50 p-4"><p class="text-sm font-semibold text-gray-800">Corrected before</p>
    <ul class="mt-1 space-y-1 text-base text-gray-800">${v.history.map(h => `<li>${h}</li>`).join('')}</ul>
    <p class="mt-2 text-sm text-gray-700">Earlier reasons are kept. A new one is added below them.</p></div>` : ''}
</section>`;

const errorSummary = n => n ? `
<div class="mb-6 flex items-start gap-3 rounded-xl border-2 border-red-300 bg-red-50 px-5 py-4 text-base text-gray-900" role="alert">${ic('alert','mt-0.5 size-5 shrink-0 text-red-700')}
  <p><b>Please fix the ${n === 1 ? 'item' : n + ' items'} below.</b> Nothing was saved yet.</p></div>` : '';

const buttons = v => `
<div class="flex flex-wrap items-center justify-end gap-3 border-t border-gray-200 pt-6">
  ${v.after ? `<p class="mr-auto text-sm text-gray-700">${v.after}</p>` : ''}
  <a class="${BTN_OUTLINE} min-h-12 font-semibold">Cancel</a>
  <button type="button" class="${BTN_PRIMARY} min-h-12 font-semibold">${ic('check')}${v.mode === 'add' ? 'Save vaccination' : 'Save changes'}</button>
</div>`;

const page = key => {
  const v = V[key];
  return frame(`<div class="mx-auto max-w-3xl">
    <div class="mb-6">${headerBlock(v)}</div>${errorSummary(v.count)}
    <div class="space-y-6">${whoCard(v)}${clinicalCard(v)}${labelCard(v)}${correctionCard(v)}${buttons(v)}</div></div>`);
};

const phoneView = () => {
  const v = V.other;
  return `
<div class="w-[390px] overflow-hidden rounded-[2rem] border-8 border-gray-800 bg-gray-50 shadow-lg">
  <header class="flex h-16 items-center gap-3 border-b border-gray-200 bg-white px-4">
    <span class="${BTN_OUTLINE}">${ic('menu')}Menu</span>
    <div class="ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
  </header>
  <main class="space-y-6 px-4 py-6">${headerBlock(v)}${whoCard(v)}
    <section class="${CARD} space-y-5">${select(v.vaccine)}<div class="border-l-4 border-violet-200 pl-4">${input('Vaccine name', v.typed, { required: true })}</div>
      ${input('Date given', v.given, { required: true, type: 'date' })}${input('Next dose due', v.due, { type: 'date' })}</section>
    <p class="text-center text-sm text-gray-600">… two-column rows become one column; buttons full width</p></main>
</div>`;
};

const states = [
  { id:'standalone', label:'1 · New, from the pet page', html: page('standalone'),
    caption:`<b>New vaccination from the pet page</b> (no record). Same frame as the record form. First card: pet, owner, “Not part of a visit record”. <b>The vaccination</b>: Vaccine select (“Choose one”, the seven clinic vaccines, “Other (type it)” last, like the species select), Date given (today), Next dose due (help: leave empty if none; the owner gets a reminder), Weight (kg), Where it was given. <b>From the vial label</b>: Batch / lot no., Maker, Given by (pre-filled with the vet name from Clinic settings). Save → the pet's vaccination history with the new row highlighted.` },
  { id:'onrecord', label:'2 · New, on a record', html: page('onRecord'),
    caption:`<b>Add vaccination from a record</b> now opens this page (replacing the inline form). A violet line says which record it belongs to; the date given starts on the record's date. Long-form date under Next dose due once picked. Save → back to the record.` },
  { id:'other', label:'3 · Other (type it)', html: page('other'),
    caption:`<b>Other</b> shows the “Vaccine name” box (indented, required). Picking a listed vaccine hides it and the server clears any typed name, so a leftover name can't break the “later dose” matching. Without JavaScript the box always shows.` },
  { id:'errors', label:'4 · Errors', html: page('errors'),
    caption:`<b>Errors</b>, same summary box as the other forms: Other with no name, a date given in the future, a next dose on or before the date given. Every typed value is kept.` },
  { id:'edit', label:'5 · Edit', html: page('edit'),
    caption:`<b>Edit</b> (from the vaccination history's Edit button). “The vaccination” carries a gray tag <b>Changing these is a correction</b>; “From the vial label” says those can be fixed any time. A <b>Reason for a correction</b> card at the bottom, needed only if a clinical field changed, with <b>Corrected before</b> showing the earlier dated reasons (kept; a new one is added below, never replacing them). This replaces the hidden Correct page, and fixes both bugs: an empty weight or next date no longer counts as a change, and an old reason no longer counts as a new one.` },
  { id:'editerr', label:'6 · Edit: reason missing', html: page('editErr'),
    caption:`<b>A clinical field changed without a reason.</b> The card turns red-bordered, a yellow line names what changed and its old value (“Date given (was Tue, Oct 6)”), and the error asks for the reason. The server works out what changed; no JavaScript needed.` },
  { id:'phone', label:'7 · Phone', html: phoneView(),
    caption:`<b>Phone width.</b> One column; the paired fields stack.` }
];

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' + (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('standalone');

</script>
</body>
</html>
