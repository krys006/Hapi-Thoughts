<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt page v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-200 text-gray-900 antialiased">
<header class="sticky top-0 z-30 border-b border-gray-300 bg-white/95 px-6 py-3 backdrop-blur">
  <p class="mb-2 text-sm font-semibold text-gray-700">Slice 6 · Receipt page v1 · frame copied from layouts/admin.html · today is Fri, Nov 6, 2026 · pick a state</p>
  <div id="switcher" class="flex flex-wrap gap-2"></div>
</header>
<div class="overflow-x-auto p-6">
  <div id="caption" class="mb-4 max-w-[1280px] rounded-xl border border-violet-200 bg-violet-50 p-4 text-base text-gray-800"></div>
  <div id="stage"></div>
  <p class="mt-3 text-sm text-gray-600">Desktop frame is 1280 px wide: a 1920×1080 screen at 150% zoom.</p>
</div>
<script>
// ---------- Icons (Lucide shapes; when built, copy new ones from lucide-static@1.66.0: printer, percent, ban) ----------
const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  bookOpen:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="m4.9 4.9 2.1 2.1"/><path d="m17 17 2.1 2.1"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.9 19.1 2.1-2.1"/><path d="m17 7 2.1-2.1"/>',
  logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrowRight:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  arrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  phone:'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  circleCheck:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  printer:'<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  percent:'<line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  ban:'<circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/>',
  dog:'<path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/>'
};
const ic = (n, c = 'size-5 shrink-0', s = 2) =>
  `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shared classes (assets/tailwind/input.css) ----------
const BTN = 'inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-base font-medium whitespace-nowrap transition-colors';
const BTN_PRIMARY = `${BTN} bg-violet-600 text-white hover:bg-violet-700`;
const BTN_OUTLINE = `${BTN} border border-gray-300 bg-white text-gray-800 hover:bg-gray-50`;
const BTN_DANGER = `${BTN} bg-red-600 text-white hover:bg-red-700`;
const BTN_RED_OUTLINE = `${BTN} border border-red-300 bg-white font-semibold text-red-700 hover:bg-red-50`;
const INPUT = 'block min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-base text-gray-900 placeholder:text-gray-500';
const CARD = 'rounded-xl border border-gray-200 bg-white p-6 shadow-sm';

// ---------- Frame ----------
const navLink = (icon, label, active = false, count = 0) =>
  `<a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base ${active ? 'bg-white font-semibold text-violet-800 shadow-sm ring-1 ring-violet-200' : 'text-gray-800 hover:bg-violet-200/70'}">${ic(icon)}<span class="flex-1">${label}</span>${count ? `<span class="rounded-full bg-violet-600 px-2 text-sm font-semibold text-white">${count}</span>` : ''}</a>`;
const sidebar = () => `
<aside class="flex w-56 shrink-0 flex-col border-r border-violet-200 bg-violet-100">
  <div class="flex h-16 shrink-0 items-center gap-3 px-5">
    <a class="-mx-2 flex min-h-11 min-w-0 flex-1 items-center gap-3 rounded-lg px-2"><span class="grid size-10 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image')}</span>
      <p class="line-clamp-2 text-base font-semibold leading-5 text-gray-900">Hapi Tutz Vet. Supplies</p></a>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-2">
    <p class="px-3 pb-1 pt-1 text-sm font-semibold text-violet-800">Daily work</p>
    ${navLink('house','Dashboard')}${navLink('calendar','Appointments',false,2)}${navLink('users','Pet owners')}${navLink('paw','Pets')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Records</p>
    ${navLink('fileText','Medical records')}${navLink('syringe','Vaccinations')}${navLink('bookOpen','Health library')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Clinic</p>
    ${navLink('receipt','Billing',true)}${navLink('settings','Clinic settings')}
  </nav>
  <div class="border-t border-violet-200 px-3 py-3"><a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base text-gray-800">${ic('logout')}Log out</a></div>
</aside>`;
const frame = (body, overlay = '') => `
<div class="relative flex min-h-[900px] w-[1280px] overflow-hidden rounded-xl border border-gray-300 bg-gray-50 shadow-sm">
  ${sidebar()}
  <div class="min-w-0 flex-1">
    <header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-8">
      <div class="relative w-full max-w-[30rem]"><span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-600">${ic('search')}</span><input type="search" placeholder="Find a pet or owner" class="${INPUT} pl-10"></div>
      <div class="ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span>Notifications</span><span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
    </header>
    <main class="px-8 py-6">${body}</main>
  </div>
  ${overlay}
</div>`;

// ---------- Pieces ----------
const peso = n => '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const link = (t, i = '', cls = '') => `<a class="inline-flex min-h-11 items-center gap-2 text-base font-medium text-blue-600 underline underline-offset-2 ${cls}">${i ? ic(i) : ''}${t}</a>`;
const aLink = t => `<a class="font-medium text-blue-600 underline underline-offset-2">${t}</a>`;
const pill = (cls, icon, text) => `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-sm font-medium ${cls}">${icon ? ic(icon,'size-4 shrink-0') : ''}${text}</span>`;
const BADGE = {
  pending: pill('bg-yellow-100 text-yellow-800', 'clock', 'Unpaid'),
  paid: pill('bg-green-100 text-green-800', 'check', 'Paid'),
  cancelled: pill('bg-red-100 text-red-800', 'ban', 'Cancelled')
};
const cardHead = (title, icon, right = '', sub = '') => `
<div class="mb-4 flex flex-wrap items-start justify-between gap-3">
  <div><h2 class="flex items-center gap-2 text-xl font-semibold text-gray-900">${ic(icon,'size-5 shrink-0 text-gray-600')}${title}</h2>${sub ? `<p class="mt-1 text-sm text-gray-600">${sub}</p>` : ''}</div>${right}
</div>`;
const smallOutline = (icon, text) => `<button type="button" class="${BTN_OUTLINE} font-semibold">${ic(icon)}${text}</button>`;

// ---------- Data ----------
const ITEMS = [
  { name:'Consultation', from:true, qty:1, unit:300 },
  { name:'Anti-rabies vaccine', from:true, qty:1, unit:250 },
  { name:'Amoxicillin 250 mg', from:false, qty:10, unit:15 }
];
const BASE = {
  number:'HV-2026-0012', owner:'Ana Cruz', first:'Ana', phone:'0917 555 0142', email:'ana.cruz@gmail.com',
  pet:'Bantay', petLine:'Dog · Aspin', visit:'Today at 9:00 AM', created:'Today, 9:52 AM',
  items: ITEMS, discount:{ label:'10% · Loyal client', pct:10 }
};
const R = {
  pending: { ...BASE, status:'pending' },
  empty: { ...BASE, status:'pending', items:[], discount:null, created:'Today, 10:05 AM' },
  paid: { ...BASE, status:'paid', paidOn:'today, Friday, November 6' },
  cancelled: { ...BASE, status:'cancelled', number:'HV-2026-0011', items:[ITEMS[0]], discount:null, created:'Today, 8:40 AM' },
  counter: { ...BASE, status:'pending', number:'HV-2026-0013', owner:'Jun Reyes', first:'Jun', phone:'0999 210 3344', email:'',
    pet:'', visit:'', created:'Today, 11:15 AM', discount:null,
    items:[{ name:'Dog food, Pedigree Adult 1.5 kg', from:false, qty:2, unit:385 }, { name:'Flea shampoo 250 ml', from:false, qty:1, unit:220 }] }
};
const totals = r => {
  const sub = r.items.reduce((s, i) => s + i.qty * i.unit, 0);
  const disc = r.discount ? Math.min(sub, Math.round(sub * r.discount.pct) / 100) : 0;
  return { sub, disc, total: sub - disc };
};

// ---------- Page parts ----------
const header = r => `
<p class="mb-2">${link('Back to receipts','arrowLeft')}</p>
<div class="mb-6 flex flex-wrap items-center gap-4">
  <span class="grid size-16 shrink-0 place-content-center rounded-2xl ${r.status === 'cancelled' ? 'bg-gray-100 text-gray-600 ring-gray-300' : 'bg-violet-50 text-violet-600 ring-violet-200'} ring-1">${ic('receipt','size-8 shrink-0',1.5)}</span>
  <div class="min-w-0">
    <h1 class="flex flex-wrap items-center gap-3 text-2xl font-bold text-gray-900">Receipt ${r.number}${BADGE[r.status]}</h1>
    <p class="mt-1 text-base text-gray-700">Billed to ${aLink(r.owner)} · ${r.pet ? `for ${aLink(r.pet)}` : '<span class="text-gray-600">not for a specific pet</span>'}</p>
    <p class="mt-1 text-base text-gray-700">${r.visit ? `${ic('calendar','mr-1 inline size-4 -translate-y-px')}From the visit ${aLink(r.visit)}` : '<span class="text-gray-600">Not linked to a visit</span>'}</p>
  </div>
</div>`;

const banner = r => {
  if (r.status === 'pending') return `
<div class="mb-6 flex items-start gap-3 rounded-xl border border-yellow-300 bg-yellow-50 px-5 py-4 text-base text-gray-900">${ic('clock','mt-0.5 size-5 shrink-0 text-yellow-800')}
  <p><b>Not paid yet.</b> ${r.items.length ? `Check the items, then press <b>Mark as paid</b> when ${r.owner} pays in cash.` : `Add what ${r.owner} is paying for: services, medicines or supplies.`}</p></div>`;
  if (r.status === 'paid') return `
<div class="mb-6 flex items-start gap-3 rounded-xl border border-green-300 bg-green-50 px-5 py-4 text-base text-gray-900">${ic('circleCheck','mt-0.5 size-5 shrink-0 text-green-700')}
  <p><b>Paid in cash ${r.paidOn}.</b> This receipt is locked and can't be changed.</p></div>`;
  return `
<div class="mb-6 flex items-start gap-3 rounded-xl border border-gray-300 bg-gray-100 px-5 py-4 text-base text-gray-900">${ic('ban','mt-0.5 size-5 shrink-0 text-gray-700')}
  <p><b>This receipt was cancelled.</b> It is locked and can't be changed. ${r.owner} doesn't see it.</p></div>`;
};

const itemsCard = r => {
  const open = r.status === 'pending';
  const t = totals(r);
  const add = open ? smallOutline('plus','Add item') : '';
  const cols = open ? 'grid-cols-[minmax(0,1fr)_4rem_8rem_8rem_7.5rem]' : 'grid-cols-[minmax(0,1fr)_4rem_8rem_8rem]';
  const head = `<div class="grid ${cols} items-center gap-4 border-b border-gray-200 pb-2 text-sm font-semibold text-gray-700" aria-hidden="true">
      <span>Item</span><span class="text-right">Qty</span><span class="text-right">Unit price</span><span class="text-right">Amount</span>${open ? '<span></span>' : ''}</div>`;
  const rows = r.items.map(i => `
    <li class="grid ${cols} items-center gap-4 border-b border-gray-100 py-3">
      <div class="min-w-0"><p class="text-base font-semibold text-gray-900">${i.name}</p>${i.from ? '<p class="text-sm text-gray-600">From the price list</p>' : ''}</div>
      <span class="text-right text-base">${i.qty}</span>
      <span class="text-right text-base">${peso(i.unit)}</span>
      <span class="text-right text-base font-semibold">${peso(i.qty * i.unit)}</span>
      ${open ? `<button type="button" class="${BTN_RED_OUTLINE} px-3">${ic('x')}Remove<span class="sr-only"> ${i.name}</span></button>` : ''}
    </li>`).join('');
  const totalsBlock = `
  <dl class="ml-auto mt-4 w-96 space-y-2 text-base">
    <div class="flex justify-between"><dt class="text-gray-700">Subtotal</dt><dd>${peso(t.sub)}</dd></div>
    ${r.discount ? `<div class="flex justify-between"><dt class="text-gray-700">Discount · ${r.discount.label}</dt><dd>−${peso(t.disc)}</dd></div>` : `<div class="flex justify-between text-gray-600"><dt>No discount</dt><dd></dd></div>`}
    <div class="flex justify-between border-t-2 border-gray-200 pt-3 text-xl font-bold"><dt>Total</dt><dd>${peso(t.total)}</dd></div>
  </dl>`;
  if (!r.items.length) return `<section class="${CARD}">${cardHead('Items (0)','receipt',add)}
    <div class="rounded-lg border-2 border-dashed border-gray-300 px-6 py-8 text-center">
      <p class="text-lg font-semibold text-gray-900">No items yet</p>
      <p class="mt-1 text-base text-gray-700">Add each service, medicine or supply. The total adds up as you go.</p>
      <button type="button" class="${BTN_OUTLINE} mt-4 font-semibold">${ic('plus')}Add item</button>
    </div></section>`;
  return `<section class="${CARD}">${cardHead(`Items (${r.items.length})`,'receipt',add)}${head}<ul>${rows}</ul>${totalsBlock}</section>`;
};

const actionsCard = r => {
  if (r.status === 'paid') return `
<section class="${CARD}">
  <h2 class="text-xl font-semibold">Actions</h2>
  <div class="mt-4 flex flex-col gap-3"><button type="button" class="${BTN_PRIMARY} font-semibold">${ic('printer')}Print receipt</button></div>
  <p class="mt-3 text-sm text-gray-700">To save it as a PDF, pick “Save as PDF” in the print window.</p>
</section>`;
  if (r.status === 'cancelled') return `
<section class="${CARD}">
  <h2 class="text-xl font-semibold">Actions</h2>
  <div class="mt-4 flex flex-col gap-3"><button type="button" class="${BTN_OUTLINE} font-semibold">${ic('printer')}Print receipt</button></div>
  <p class="mt-3 text-sm text-gray-700">The printout says “Cancelled”.</p>
</section>`;
  if (!r.items.length) return `
<section class="${CARD}">
  <h2 class="text-xl font-semibold">Actions</h2>
  <div class="mt-4 flex flex-col gap-3">
    <button type="button" class="${BTN_PRIMARY} font-semibold">${ic('plus')}Add item</button>
  </div>
  <p class="mt-3 text-sm text-gray-700">Mark as paid shows once the receipt has an item.</p>
  <hr class="my-4 border-gray-200">
  <button type="button" class="${BTN_RED_OUTLINE} w-full">${ic('ban')}Cancel receipt</button>
</section>`;
  return `
<section class="${CARD}">
  <h2 class="text-xl font-semibold">Actions</h2>
  <div class="mt-4 flex flex-col gap-3">
    <button type="button" class="${BTN_PRIMARY} font-semibold">${ic('circleCheck')}Mark as paid</button>
    <button type="button" class="${BTN_OUTLINE} font-semibold">${ic('plus')}Add item</button>
    <button type="button" class="${BTN_OUTLINE} font-semibold">${ic('percent')}${r.discount ? 'Change discount' : 'Add discount'}</button>
    <button type="button" class="${BTN_OUTLINE} font-semibold">${ic('printer')}Print</button>
  </div>
  <hr class="my-4 border-gray-200">
  <button type="button" class="${BTN_RED_OUTLINE} w-full">${ic('ban')}Cancel receipt</button>
</section>`;
};

const billedCard = r => `
<section class="${CARD}">
  <h2 class="text-xl font-semibold">Billed to</h2>
  <p class="mt-3 text-base">${aLink(r.owner)}</p>
  <p class="mt-2 flex items-center gap-2 text-base ${r.phone ? 'text-gray-900' : 'text-gray-600'}">${ic('phone','size-5 shrink-0 text-gray-600')}${r.phone || 'No phone number'}</p>
  <p class="mt-2 flex items-center gap-2 text-base ${r.email ? 'text-gray-900' : 'text-gray-600'}">${ic('mail','size-5 shrink-0 text-gray-600')}${r.email || 'No email'}</p>
  <p class="mt-3 border-t border-gray-100 pt-3 text-sm font-semibold text-gray-700">Pet</p>
  <p class="mt-1 text-base">${r.pet ? `${aLink(r.pet)} · ${r.petLine}` : '<span class="text-gray-600">Not for a specific pet</span>'}</p>
</section>`;

const infoCard = r => {
  const seen = r.status === 'cancelled' ? `Hidden from ${r.owner}.` : r.status === 'paid' ? `${r.owner} sees it as Paid in their Billing page and can print it.` : `${r.owner} sees it as Unpaid in their Billing page.`;
  return `
<section class="rounded-xl border border-gray-200 bg-white p-5 text-base text-gray-700 shadow-sm">
  <p>Created ${r.created}</p>
  ${r.status === 'paid' ? '<p class="mt-1">Paid Today (Fri, Nov 6) · Cash</p>' : '<p class="mt-1">Payment: cash</p>'}
  <p class="mt-3 flex items-start gap-2 text-sm">${ic('eye','mt-0.5 size-4 shrink-0')}${seen}</p>
</section>`;
};

const flash = (txt) => `
<div class="mb-6 flex items-start gap-3 rounded-xl border border-green-300 bg-green-50 px-5 py-3 text-base text-green-900">${ic('circleCheck','mt-0.5 size-5 shrink-0')}
  <p class="flex-1">${txt}</p><button type="button" class="${BTN_OUTLINE} min-h-10 px-3 py-1.5">${ic('x','size-4 shrink-0')}Close</button></div>`;

const page = (key, overlay = '', pre = '') => {
  const r = R[key];
  return frame(`${pre}${header(r)}${banner(r)}
<div class="grid grid-cols-3 items-start gap-6">
  <div class="col-span-2 space-y-6">${itemsCard(r)}</div>
  <div class="sticky top-6 space-y-6">${actionsCard(r)}${billedCard(r)}${infoCard(r)}</div>
</div>`, overlay);
};

// ---------- Dialogs ----------
const dialogBox = (inner, w = 'max-w-lg') => `<div class="absolute inset-0 flex items-start justify-center bg-gray-900/50 p-8 pt-20">
  <div class="w-[calc(100%-2rem)] ${w} rounded-2xl bg-white p-7 text-gray-900 shadow-xl">${inner}</div></div>`;
const dialogButtons = (ok, cls, icon, back = 'Go back') => `<div class="mt-6 flex flex-wrap justify-end gap-3">
  <button type="button" class="${BTN_OUTLINE} min-h-12 font-semibold ring-2 ring-violet-400 ring-offset-2">${back}</button>
  <button type="button" class="${cls} min-h-12 font-semibold">${ic(icon)}${ok}</button></div>`;
const errLine = e => e ? `<p class="mt-1 flex items-center gap-1.5 text-base text-red-700">${ic('alert','size-4 shrink-0')}${e}</p>` : '';
const ff = (label, value = '', { opt = false, placeholder = '', help = '', err = '', prefix = '' } = {}) => `
<div class="mt-4"><label class="block text-base font-semibold text-gray-900">${label}${opt ? ' <span class="font-normal text-gray-600">(optional)</span>' : ' <span class="text-red-700">*</span>'}</label>
  <div class="relative mt-1">${prefix ? `<span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-base text-gray-700">${prefix}</span>` : ''}
  <input value="${value}" placeholder="${placeholder}" class="${INPUT} ${prefix ? 'pl-8' : ''} ${err ? 'border-red-600 ring-1 ring-red-600' : ''}"></div>
  ${help ? `<p class="mt-1 text-sm text-gray-700">${help}</p>` : ''}${errLine(err)}</div>`;
const sel = (label, value, { help = '', err = '' } = {}) => `
<div class="mt-4"><label class="block text-base font-semibold text-gray-900">${label} <span class="text-red-700">*</span></label>
  <div class="relative mt-1"><select class="${INPUT} appearance-none pr-10 ${err ? 'border-red-600 ring-1 ring-red-600' : ''}"><option>${value}</option></select>
  <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-600"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span></div>
  ${help ? `<p class="mt-1 text-sm text-gray-700">${help}</p>` : ''}${errLine(err)}</div>`;

const addItemDialog = dialogBox(`
  <h2 class="text-xl font-bold">Add an item to ${BASE.number}</h2>
  <p class="mt-1 text-base text-gray-700">Pick it from the price list, or choose “Other (type it)” for a medicine or supply.</p>
  ${sel('What is it?','Deworming · ₱150.00')}
  ${ff('Description','Deworming',{ help:'Printed on the receipt. You can change it.' })}
  <div class="grid grid-cols-2 gap-4">${ff('Quantity','1')}${ff('Unit price','150.00',{ prefix:'₱', help:'Price list: ₱150.00.' })}</div>
  ${dialogButtons('Add item', BTN_PRIMARY, 'plus')}`, 'max-w-2xl');

const addItemErrorDialog = dialogBox(`
  <h2 class="text-xl font-bold">Add an item to ${BASE.number}</h2>
  <p class="mt-1 text-base text-gray-700">Pick it from the price list, or choose “Other (type it)” for a medicine or supply.</p>
  <div class="mt-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-base text-red-900">${ic('alert','mr-1 inline size-5 -translate-y-px')}Please fix the 2 items below.</div>
  ${sel('What is it?','Wound cleaning and dressing · ₱300.00 to ₱800.00')}
  ${ff('Description','Wound cleaning and dressing',{ help:'Printed on the receipt. You can change it.' })}
  <div class="grid grid-cols-2 gap-4">${ff('Quantity','0',{ err:'The quantity must be from 1 to 999.' })}${ff('Unit price','',{ prefix:'₱', help:'Usual price ₱300.00 to ₱800.00. You can bill outside it.', err:'Type the price.' })}</div>
  ${dialogButtons('Add item', BTN_PRIMARY, 'plus')}`, 'max-w-2xl');

const discountDialog = dialogBox(`
  <h2 class="text-xl font-bold">Discount for ${BASE.number}</h2>
  <p class="mt-1 text-base text-gray-700">Subtotal now: <b>₱700.00</b>.</p>
  <div class="mt-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-base text-red-900">${ic('alert','mr-1 inline size-5 -translate-y-px')}Please fix the 1 item below.</div>
  ${sel('Discount','Percent off (%)',{ help:'Choose “No discount” to remove it.' })}
  ${ff('How much','120',{ prefix:'%', err:'A discount can\'t be more than 100%.' })}
  ${ff('Note','Loyal client',{ opt:true, placeholder:'For example: Loyal client', help:'Printed next to the discount.' })}
  ${dialogButtons('Save discount', BTN_PRIMARY, 'check')}`);

const removeItemDialog = dialogBox(`
  <h2 class="text-xl font-bold">Remove Amoxicillin 250 mg?</h2>
  <p class="mt-2 text-base text-gray-700">It comes off this receipt. The total goes from <b>₱630.00</b> to <b>₱495.00</b>.</p>
  ${dialogButtons('Yes, remove it', BTN_DANGER, 'x')}`);

const paidDialog = dialogBox(`
  <h2 class="text-xl font-bold">Mark ${BASE.number} as paid?</h2>
  <p class="mt-3 text-base text-gray-800">Ana Cruz paid</p>
  <p class="text-3xl font-bold text-gray-900">₱630.00 <span class="text-lg font-semibold text-gray-700">in cash today</span></p>
  <p class="mt-4 flex items-start gap-2 rounded-lg bg-gray-50 px-3 py-2 text-base text-gray-800">${ic('info','mt-0.5 size-5 shrink-0')}After this the receipt is locked: no more items, discount changes or cancelling.</p>
  <p class="mt-3 flex items-start gap-2 text-sm text-gray-700">${ic('mail','mt-0.5 size-4 shrink-0')}<span>Ana Cruz gets a notification in the app and an email, so they can view or print the receipt.</span></p>
  ${dialogButtons('Yes, mark as paid', BTN_PRIMARY, 'circleCheck')}`);

const cancelDialog = dialogBox(`
  <h2 class="text-xl font-bold">Cancel receipt ${BASE.number}?</h2>
  <p class="mt-2 text-base text-gray-700">Use this for a receipt made by mistake, or when nothing will be charged.</p>
  <ul class="mt-3 list-disc space-y-1 pl-6 text-base text-gray-800">
    <li>It can't be changed or paid after this, and it can't be undone.</li>
    <li>Ana Cruz won't see it. It stays on the <b>Cancelled</b> tab for the clinic.</li>
    <li>This visit can't get another receipt.</li>
  </ul>
  ${dialogButtons('Yes, cancel receipt', BTN_DANGER, 'ban', 'Keep it')}`);

// ---------- Print preview ----------
const printPreview = () => {
  const r = R.paid, t = totals(r);
  return `
<div class="w-[1280px]">
<div class="mx-auto w-[720px] bg-white p-12 text-black shadow-lg ring-1 ring-gray-300" style="font-family: Arial, sans-serif;">
  <div class="flex items-center gap-4 border-b-2 border-black pb-4">
    <span class="grid size-16 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image','size-7')}</span>
    <div><p class="text-xl font-bold">Hapi Tutz Vet. Supplies</p><p class="text-sm">Bognuyan, Gasan, Marinduque</p><p class="text-sm">0917 000 0000 · hapitutzvet@gmail.com</p></div>
  </div>
  <div class="mt-5 flex justify-between">
    <div><p class="text-2xl font-bold tracking-wide">RECEIPT</p><p class="mt-1 text-sm">Receipt no. <b>${r.number}</b></p><p class="text-sm">Date: November 6, 2026</p></div>
    <div class="text-right"><p class="inline-block rounded border-2 border-black px-3 py-1 text-base font-bold">PAID</p><p class="mt-1 text-sm">Cash · November 6, 2026</p></div>
  </div>
  <div class="mt-5 border-t border-gray-400 pt-3 text-sm"><p class="font-bold">BILLED TO</p><p>${r.owner} · ${r.phone}</p><p>Pet: ${r.pet}</p></div>
  <table class="mt-5 w-full text-sm">
    <thead><tr class="border-y border-black"><th class="py-2 text-left">Qty</th><th class="py-2 text-left">Description</th><th class="py-2 text-right">Unit</th><th class="py-2 text-right">Amount</th></tr></thead>
    <tbody>${r.items.map(i => `<tr class="border-b border-gray-300"><td class="py-2">${i.qty}</td><td class="py-2">${i.name}</td><td class="py-2 text-right">${peso(i.unit)}</td><td class="py-2 text-right">${peso(i.qty*i.unit)}</td></tr>`).join('')}</tbody>
  </table>
  <dl class="ml-auto mt-4 w-72 space-y-1 text-sm">
    <div class="flex justify-between"><dt>Subtotal</dt><dd>${peso(t.sub)}</dd></div>
    <div class="flex justify-between"><dt>Discount (${r.discount.label})</dt><dd>−${peso(t.disc)}</dd></div>
    <div class="flex justify-between border-t-2 border-black pt-2 text-lg font-bold"><dt>TOTAL</dt><dd>${peso(t.total)}</dd></div>
  </dl>
  <p class="mt-8 border-t border-gray-400 pt-4 text-center text-sm">Thank you for trusting Hapi Tutz Vet. Supplies!<br>We care for your pets like our own.</p>
</div></div>`;
};

// ---------- Phone ----------
const phoneView = () => {
  const r = R.pending, t = totals(r);
  const rows = r.items.map(i => `
    <li class="border-b border-gray-100 py-3">
      <div class="flex items-start justify-between gap-3"><p class="text-base font-semibold">${i.name}</p><p class="text-base font-semibold">${peso(i.qty*i.unit)}</p></div>
      <p class="text-sm text-gray-700">${i.qty} × ${peso(i.unit)}</p>
      <button type="button" class="${BTN_RED_OUTLINE} mt-2 w-full">${ic('x')}Remove<span class="sr-only"> ${i.name}</span></button>
    </li>`).join('');
  return `
<div class="w-[390px] overflow-hidden rounded-[2rem] border-8 border-gray-800 bg-gray-50 shadow-lg">
  <header class="flex h-16 items-center gap-3 border-b border-gray-200 bg-white px-4">
    <span class="${BTN_OUTLINE}">${ic('menu')}Menu</span>
    <div class="ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
  </header>
  <main class="space-y-6 px-4 py-6">
    <div class="-mb-6">${header(r)}</div>
    ${banner(r).replace('mb-6 ','')}
    ${actionsCard(r)}
    <section class="${CARD} p-5">
      ${cardHead(`Items (${r.items.length})`,'receipt')}
      <ul>${rows}</ul>
      <dl class="mt-4 space-y-2 text-base">
        <div class="flex justify-between"><dt class="text-gray-700">Subtotal</dt><dd>${peso(t.sub)}</dd></div>
        <div class="flex justify-between"><dt class="text-gray-700">Discount · 10%</dt><dd>−${peso(t.disc)}</dd></div>
        <div class="flex justify-between border-t-2 border-gray-200 pt-3 text-xl font-bold"><dt>Total</dt><dd>${peso(t.total)}</dd></div>
      </dl>
    </section>
    <p class="text-center text-sm text-gray-600">… Billed to, Created</p>
  </main>
</div>`;
};

// ---------- States ----------
const states = [
  { id:'pending', label:'1 · Unpaid, with items', html: page('pending'),
    caption:`<b>The receipt page is the only working page</b> (the separate Edit page goes). Header: back to receipts, receipt tile, “Receipt HV-2026-0012” + yellow <b>Unpaid</b> badge, who it's billed to and for which pet, and the visit it came from. Yellow banner says what to do next. Left: <b>Items</b> (Item / Qty / Unit price / Amount, “From the price list” under service items, red-outline <b>Remove</b> on each) and the totals: Subtotal, Discount (only when there is one, capped at the subtotal), <b>Total</b>. Right (sticky): <b>Actions</b> with <b>Mark as paid</b> the one violet button, then Add item, Add/Change discount, Print (an unpaid printout says “Unpaid”), and a red-outline <b>Cancel receipt</b> under a line. <b>Billed to</b> card (owner, phone, email, pet). A small card with the created time, “Payment: cash” and what the owner sees.` },
  { id:'empty', label:'2 · Just created (no items)', html: page('empty'),
    caption:`<b>A new receipt opens here, empty.</b> “Mark as paid” isn't shown (the server also refuses it with “Add at least one item first.”), so <b>Add item</b> is the violet button, with a line saying why. Discount is hidden until there is something to discount. Cancel receipt is still there for a receipt made by mistake.` },
  { id:'additem', label:'3 · Dialog: add item', html: page('pending', addItemDialog),
    caption:`<b>Add item</b> dialog. “What is it?” lists the price list (Offered + Clinic use only) with prices, and <b>Other (type it)</b> last for medicines and supplies. Picking a service fills in the description and, for a fixed price, the unit price; both stay editable. The values come from <code>data-*</code> on the options (no extra request); without JavaScript the server fills them in. Quantity 1 to 999.` },
  { id:'additemerr', label:'4 · Dialog: add item (errors)', html: page('pending', addItemErrorDialog),
    caption:`<b>Errors reopen the dialog with the typed values kept</b> (today they are lost after a redirect). A <b>Range</b> service doesn't fill the price; the help says “Usual price ₱300.00 to ₱800.00. You can bill outside it.” Other errors: “Type what it is.” (Other with no description).` },
  { id:'discount', label:'5 · Dialog: discount (error)', html: page('pending', discountDialog),
    caption:`<b>Discount</b> dialog: “Discount” select (No discount / Percent off (%) / Peso amount off (₱)), How much (the % or ₱ sign in the box follows the choice), optional Note printed next to it. Shows the subtotal. Shown with the over-100% error. A peso discount over the subtotal: “A discount can't be more than the subtotal (₱700.00).” An amount with “No discount”: “Choose the kind of discount, or clear the amount.”` },
  { id:'remove', label:'6 · Dialog: remove item', html: page('pending', removeItemDialog),
    caption:`<b>Remove asks first</b> and says what happens to the total (the discount is worked out again).` },
  { id:'markpaid', label:'7 · Dialog: mark as paid', html: page('pending', paidDialog),
    caption:`<b>Mark as paid</b>: the amount large, “in cash today”, that the receipt locks, and who gets told (the line changes to “in the app only (no email on file)” for an owner without an email). Violet confirm, “Go back” focused.` },
  { id:'cancel', label:'8 · Dialog: cancel receipt', html: page('pending', cancelDialog),
    caption:`<b>Cancel receipt</b> (void), red confirm, “Keep it” focused. Three plain lines: it can't be undone, the owner won't see it, and the visit can't get another receipt (one receipt per visit).` },
  { id:'paid', label:'9 · Paid (after the dialog)', html: page('paid', '', flash('Receipt HV-2026-0012 marked as paid. Ana Cruz was notified.')),
    caption:`<b>Paid.</b> Green badge and banner (“Paid in cash today, Friday, November 6. This receipt is locked…”). No Remove buttons, no Add item, no discount, no Cancel. <b>Print receipt</b> becomes the violet button, with a line on saving as PDF. Flash from the layout, stays until closed.` },
  { id:'cancelled', label:'10 · Cancelled', html: page('cancelled'),
    caption:`<b>Cancelled.</b> Red badge, gray banner, gray tile. Read-only, no violet button; Print stays as an outline (the printout says “Cancelled”). The small card says it is hidden from the owner.` },
  { id:'counter', label:'11 · Over the counter', html: page('counter'),
    caption:`<b>No visit, no pet</b> (supplies bought over the counter). “not for a specific pet” and “Not linked to a visit” in gray; the Billed to card says “Not for a specific pet”. Everything else as state 1.` },
  { id:'print', label:'12 · Printed receipt', html: printPreview(),
    caption:`<b>What prints</b> (browser print; “Save as PDF” is in the print window). Same content as today's partial, cleaned up: a status stamp (PAID / UNPAID / CANCELLED) with “Cash · date paid”, the Discount line only when there is one (no more “−₱0.00”), the pet line only when there is a pet. Black on white for any printer. The partial stays a direct child of <code>&lt;body&gt;</code>.` },
  { id:'phone', label:'13 · Phone', html: phoneView(),
    caption:`<b>Phone width.</b> Banner, Actions first, then the items as stacked rows (name and amount on one line, “10 × ₱15.00” under it, Remove full width), totals, then Billed to.` }
];

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' + (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('pending');
</script>
</body>
</html>
