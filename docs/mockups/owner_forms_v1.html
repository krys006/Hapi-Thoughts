<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner forms v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-200 text-gray-900 antialiased">

<header class="sticky top-0 z-30 border-b border-gray-300 bg-white/95 px-6 py-3 backdrop-blur">
  <p class="mb-2 text-sm font-semibold text-gray-700">Owner forms v1 (Add owner, Edit details, Add email) · frame copied from layouts/admin.html · pick a state</p>
  <div id="switcher" class="flex flex-wrap gap-2"></div>
</header>

<div class="overflow-x-auto p-6">
  <div id="caption" class="mb-4 max-w-[1280px] rounded-xl border border-violet-200 bg-violet-50 p-4 text-base text-gray-800"></div>
  <div id="stage"></div>
  <p class="mt-3 text-sm text-gray-600">Desktop frame is 1280 px wide: a 1920×1080 screen at 150% zoom. Field markup follows components/form_field.html (label, control, help text, red error with the warning icon).</p>
</div>

<script>
// ---------- Icons (Lucide 1.66 shapes) ----------
const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  bookOpen:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  userPlus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  circleAlert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  upload:'<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>'
};
const ic = (n, c = 'size-5 shrink-0', s = 2) =>
  `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shared classes, copied from assets/tailwind/input.css ----------
const BTN = 'inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-base font-medium whitespace-nowrap transition-colors';
const BTN_PRIMARY = `${BTN} bg-violet-600 text-white hover:bg-violet-700`;
const BTN_OUTLINE = `${BTN} border border-gray-300 bg-white text-gray-800 hover:bg-gray-50`;
const INPUT = 'block min-h-11 w-full rounded-lg border bg-white px-3 py-2.5 text-base text-gray-900 placeholder:text-gray-500';
const CARD = 'rounded-xl border border-gray-200 bg-white p-6 shadow-sm';

// ---------- Frame: layouts/admin.html ----------
const navLink = (icon, label, active = false, count = 0) =>
  `<a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base ${active ? 'bg-white font-semibold text-violet-800 shadow-sm ring-1 ring-violet-200' : 'text-gray-800 hover:bg-violet-200/70'}">${ic(icon)}<span class="flex-1">${label}</span>${count ? `<span class="rounded-full bg-violet-600 px-2 text-sm font-semibold text-white">${count}</span>` : ''}</a>`;
const sidebar = () => `
<aside class="flex w-56 shrink-0 flex-col border-r border-violet-200 bg-violet-100">
  <div class="flex h-16 shrink-0 items-center gap-3 px-5">
    <a class="-mx-2 flex min-h-11 min-w-0 flex-1 items-center gap-3 rounded-lg px-2 hover:bg-violet-200/60">
      <span class="grid size-10 shrink-0 place-content-center rounded-lg bg-gradient-to-br from-amber-300 to-amber-700 text-white">${ic('image','size-5 shrink-0')}</span>
      <div class="min-w-0 flex-1"><p class="line-clamp-2 text-base font-semibold leading-5 text-gray-900">Hapi Tutz Vet. Supplies</p></div>
    </a>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-2">
    <p class="px-3 pb-1 pt-1 text-sm font-semibold text-violet-800">Daily work</p>
    ${navLink('house','Dashboard')}${navLink('calendar','Appointments',false,2)}${navLink('users','Pet owners',true)}${navLink('paw','Pets',false,1)}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Records</p>
    ${navLink('fileText','Medical records')}${navLink('syringe','Vaccinations')}${navLink('bookOpen','Health library')}
    <p class="px-3 pb-1 pt-5 text-sm font-semibold text-violet-800">Clinic</p>
    ${navLink('receipt','Billing')}${navLink('settings','Clinic settings')}
  </nav>
  <div class="border-t border-violet-200 px-3 py-3">
    <a class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-base text-gray-800 hover:bg-violet-200/70">${ic('logout')}Log out</a>
  </div>
</aside>`;
const topbar = () => `
<header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-8">
  <div class="relative w-full max-w-xl">
    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-500">${ic('search')}</span>
    <input type="search" placeholder="Find a pet or owner" class="${INPUT} border-gray-300 pl-10">
  </div>
  <div class="relative ml-auto"><span class="${BTN_OUTLINE}">${ic('bell')}<span>Notifications</span><span class="rounded-full bg-red-600 px-2 text-sm font-semibold text-white">1 new</span></span></div>
</header>`;
const frame = body => `
<div class="relative flex min-h-[820px] w-[1280px] overflow-hidden rounded-xl border border-gray-300 bg-gray-50 shadow-sm">
  ${sidebar()}
  <div class="min-w-0 flex-1">${topbar()}<main class="px-8 py-6">${body}</main></div>
</div>`;

// ---------- Pieces ----------
// page_header override: back link + title + subtitle (like appointments/detail.html)
const head = (back, title, sub) => `
<a class="mb-2 inline-flex min-h-11 items-center gap-2 text-base font-medium text-blue-600 hover:underline">${ic('arrowLeft')}${back}</a>
<div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">${title}</h1><p class="mt-1 text-base text-gray-600">${sub}</p></div>`;

// components/form_field.html: label, control, help, error
const field = (label, value, o = {}) => `
<div class="form-field ${o.wide ? 'sm:col-span-2' : ''}">
  <label class="mb-1.5 block text-base font-medium text-gray-800">${label}${o.req ? ' <span class="text-red-700">*</span>' : ''}${o.opt ? ' <span class="font-normal text-gray-600">(optional)</span>' : ''}</label>
  <input type="${o.type || 'text'}" value="${value}" placeholder="${o.ph || ''}" class="${INPUT} ${o.err ? 'border-red-600' : 'border-gray-300'}">
  ${o.help ? `<p class="mt-1.5 text-sm text-gray-600">${o.help}</p>` : ''}
  ${o.err ? `<p class="mt-1.5 flex items-start gap-1.5 text-sm font-medium text-red-700">${ic('alert','mt-0.5 size-4 shrink-0')}<span>${o.err}</span></p>` : ''}
</div>`;

const section = (title, sub, body) => `
<section class="${CARD}">
  <h2 class="text-xl font-semibold">${title}</h2>
  ${sub ? `<p class="mt-1 text-base text-gray-600">${sub}</p>` : ''}
  <div class="mt-4 grid grid-cols-1 gap-5 sm:grid-cols-2">${body}</div>
</section>`;

// Photo: current picture + a big "Choose photo" button (the real file input is visually hidden behind it)
const photoSection = (name, initials, hasPhoto) => `
<section class="${CARD}">
  <h2 class="text-xl font-semibold">Photo <span class="text-base font-normal text-gray-600">(optional)</span></h2>
  <div class="mt-4 flex flex-wrap items-center gap-4">
    ${hasPhoto
      ? `<span class="grid size-16 shrink-0 place-content-center rounded-full bg-gradient-to-br from-stone-300 to-stone-500 text-white">${ic('image','size-7 shrink-0')}</span>`
      : `<span class="grid size-16 shrink-0 place-content-center rounded-full bg-violet-50 text-xl font-semibold tracking-wide text-violet-700 ring-1 ring-violet-200">${initials}</span>`}
    <div class="space-y-2">
      <span class="${BTN_OUTLINE} font-semibold">${ic('upload')}${hasPhoto ? 'Choose a new photo' : 'Choose a photo'}</span>
      <p class="text-sm text-gray-600">${hasPhoto ? 'Leave it as it is to keep the current photo.' : 'Without a photo, the initials are shown.'}</p>
      ${hasPhoto ? `<label class="flex min-h-11 items-center gap-3 text-base text-gray-800"><input type="checkbox" class="size-5 accent-violet-600">Remove the photo</label>` : ''}
    </div>
  </div>
</section>`;

const errorSummary = n => `
<div class="flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 px-5 py-4 text-red-900" role="alert">${ic('circleAlert','mt-0.5 size-6 shrink-0')}
  <div><p class="text-lg font-semibold">Please fix ${n === 1 ? 'the item' : `the ${n} items`} below.</p><p class="mt-0.5 text-base">Nothing was saved yet. Everything you typed is still here.</p></div>
</div>`;

const buttons = (label, icon, note = '') => `
<div class="flex flex-wrap items-center justify-end gap-3 border-t border-gray-200 pt-6">
  ${note ? `<p class="mr-auto flex items-start gap-2 text-sm text-gray-700">${ic('info','mt-0.5 size-4 shrink-0')}<span>${note}</span></p>` : ''}
  <a class="${BTN_OUTLINE} font-semibold">Cancel</a>
  <button type="button" class="${BTN_PRIMARY} font-semibold">${ic(icon)}${label}</button>
</div>`;

const requiredNote = `<p class="text-sm text-gray-700">Fields marked <span class="text-red-700">*</span> are required. Everything else can be added later.</p>`;

// ---------- Field sets ----------
const nameContact = (v, errs = {}, emailHelp) => section('Name and contact', '', `
  ${field('First name', v.first, {req:true, err:errs.first})}
  ${field('Last name', v.last, {req:true, err:errs.last})}
  ${field('Phone number', v.phone, {type:'tel', opt:true, ph:'For example: 0917 123 4567'})}
  ${field('Email', v.email, {type:'email', opt:!v.hasEmail, ph:'Leave empty if they have none', help: emailHelp, err:errs.email})}`);

// ---------- Address: dropdowns for Marinduque, typed text for other provinces ----------
// SAMPLE names for the mockup only. The build loads the official PSA list (PSGC), never names typed from memory.
const TOWNS = {
  'Boac': ['Agot','Bantad','Boton','Isok I','Malusak','Mercado','Murallon','Tumapon'],
  'Buenavista': ['Bagacay','Bagtingon','Daykitin','Lipa','Malbog','Sihi'],
  'Gasan': ['Antipolo','Bachao Ibaba','Bachao Ilaya','Bacongbacong','Bahi','Bangbang','Banot','Banuyo','Bognuyan','Cabugao','Dawis','Dili','Libtangin','Mahunig','Mangiliol','Masiga','Matandang Gasan','Pangi','Pingan','Tabionan','Tapuyan','Tiguion'],
  'Mogpog': ['Balanacan','Bocboc','Butansapa','Hinanggayon','Puting Buhangin','Sumangga'],
  'Santa Cruz': ['Baliis','Banahaw','Kilo-kilo','Lipata','Maharlika','Morales'],
  'Torrijos': ['Bangwayin','Bayakbakin','Malibago','Matuyatuya','Poctoy','Sibuyao']
};
const OTHER = '__other__';
const opt = (v, label, sel) => `<option value="${v}"${sel ? ' selected' : ''}>${label}</option>`;
const selectField = (id, label, options, o = {}) => `
<div class="form-field">
  <label for="${id}" class="mb-1.5 block text-base font-medium text-gray-800">${label}</label>
  <select id="${id}" class="${INPUT} border-gray-300 disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-600"${o.disabled ? ' disabled' : ''}>${options}</select>
  ${o.help ? `<p id="${id}-help" class="mt-1.5 text-sm text-gray-600">${o.help}</p>` : ''}
</div>`;

// v: {prov, town, brgy, street, typed} — typed=true shows the text fields (other province or a hand-typed address)
function addressCard(v = {}) {
  const typed = !!v.typed;
  const prov = typed ? OTHER : (v.prov || 'Marinduque');
  const towns = Object.keys(TOWNS);
  const brgys = v.town && TOWNS[v.town] ? TOWNS[v.town] : [];
  const note = v.handTyped ? `
    <div class="sm:col-span-2 flex items-start gap-3 rounded-lg border border-yellow-300 bg-yellow-50 px-4 py-3 text-base text-yellow-900">${ic('alert','mt-0.5 size-5 shrink-0')}
      <p>This address was typed by hand and doesn't match the list. It's kept as it is. To tidy it up, pick <b>Marinduque</b> and choose the town and barangay.</p></div>` : '';
  return `
<section class="${CARD}" data-address>
  <h2 class="text-xl font-semibold">Address <span class="text-base font-normal text-gray-600">(optional)</span></h2>
  <div class="mt-4 grid grid-cols-1 gap-5 sm:grid-cols-2">
    ${note}
    ${selectField('addr-prov','Province', opt('Marinduque','Marinduque', prov === 'Marinduque') + opt(OTHER,'Another province', prov === OTHER))}
    <div data-pick class="${typed ? 'hidden' : 'contents'}">
      ${selectField('addr-town','Town', opt('','Choose a town', !v.town) + towns.map(t => opt(t, t, t === v.town)).join(''))}
      ${selectField('addr-brgy','Barangay', opt('', v.town ? 'Choose a barangay' : 'Choose the town first', !v.brgy) + brgys.map(b => opt(b, b, b === v.brgy)).join(''),
        {disabled: !v.town, help: v.town ? '' : 'The list fills in after you choose the town.'})}
    </div>
    <div data-typed class="${typed ? 'contents' : 'hidden'}">
      ${field('Province name', v.provText || '', {ph:'For example: Batangas'})}
      ${field('Town or city', v.townText || '', {ph:'For example: Lipa City'})}
      ${field('Barangay', v.brgyText || '', {ph:'For example: Sabang'})}
    </div>
    ${field('House no., street or purok', v.street || '', {wide:true, ph:'For example: Purok 3'})}
  </div>
</section>`;
}

// Mockup only: makes the dropdowns work like the build will (HTMX fills the barangay list from the server)
function bindAddress() {
  document.querySelectorAll('[data-address]').forEach(card => {
    const prov = card.querySelector('#addr-prov'), town = card.querySelector('#addr-town'), brgy = card.querySelector('#addr-brgy');
    const pick = card.querySelector('[data-pick]'), typed = card.querySelector('[data-typed]');
    const help = card.querySelector('#addr-brgy-help');
    prov.addEventListener('change', () => {
      const other = prov.value === OTHER;
      pick.className = other ? 'hidden' : 'contents';
      typed.className = other ? 'contents' : 'hidden';
    });
    town.addEventListener('change', () => {
      const list = TOWNS[town.value] || [];
      brgy.innerHTML = opt('', town.value ? 'Choose a barangay' : 'Choose the town first', true) + list.map(b => opt(b, b, false)).join('');
      brgy.disabled = !town.value;
      if (help) help.textContent = town.value ? '' : 'The list fills in after you choose the town.';
    });
  });
}

// ---------- Pages ----------
const ADD_HELP = 'We\'ll email them a link to set a password, so they can book online and see their pets\' records.';

const addPage = (errs, addrState = {}) => frame(`<div class="mx-auto max-w-3xl">` +
  head('Back to pet owners', 'Add owner', 'Add an owner without booking a visit. You can add their pets on the next page.') + `
<div class="space-y-6">
  ${errs ? errorSummary(2) : requiredNote}
  ${nameContact(errs ? {first:'', last:'Cruz', phone:'0917 123 4567', email:'liza.cruz@gmail.com'} : {first:'Ana', last:'Cruz', phone:'', email:''},
      errs ? {first:'Enter the first name.', email:'This email is already used by another account.'} : {}, ADD_HELP)}
  ${addressCard(addrState)}
  ${photoSection('Ana Cruz','AC',false)}
  ${buttons('Add owner','userPlus','After saving you\'ll see their owner page, where you can add pets or book a walk-in.')}
</div></div>`);

const editPage = (kind, addr) => {
  const liza = {first:'Liza', last:'Cruz', phone:'0917 123 4567', email:'liza.cruz@gmail.com', hasEmail:true};
  const ana = {first:'Ana', last:'Cruz', phone:'', email:'', hasEmail:false};
  const o = kind === 'noEmail' ? ana : liza;
  const errs = kind === 'err' ? {email:'An email can\'t be removed once added. Type a new email to change it.'} : {};
  const v = kind === 'err' ? {...liza, email:''} : o;
  const help = o.hasEmail
    ? 'This is the email Liza Cruz logs in with. Change it only if they asked you to.'
    : 'Adding an email lets Ana Cruz log in. We\'ll send them a link to set a password.';
  const name = `${o.first} ${o.last}`;
  return frame(`<div class="mx-auto max-w-3xl">` +
    head(`Back to ${name}`, 'Edit details', name) + `
<div class="space-y-6">
  ${kind === 'err' ? errorSummary(1) : requiredNote}
  ${nameContact(v, errs, help)}
  ${addressCard(addr || (o.hasEmail ? {street:'Purok 3', brgy:'Bognuyan', town:'Gasan', prov:'Marinduque'} : {}))}
  ${photoSection(name, 'AC', o.hasEmail)}
  ${buttons('Save changes','check')}
</div></div>`);
};

const addEmailPage = (err) => frame(`<div class="mx-auto max-w-xl">` +
  head('Back to Ana Cruz', 'Add email', 'Ana Cruz') + `
<div class="space-y-6">
  <section class="${CARD}">
    <p class="flex items-start gap-3 rounded-lg bg-violet-50 px-4 py-3 text-base text-gray-800">${ic('mail','mt-0.5 size-5 shrink-0 text-violet-700')}<span>We'll send Ana Cruz a link to set a password. After that they can log in, book visits online and see their pets' records.</span></p>
    <div class="mt-5">${field('Email', err ? 'rosa.delacruz@gmail.com' : 'ana.cruz@gmail.com', {type:'email', req:true, err: err ? 'This email is already used by another account.' : ''})}</div>
    <div class="mt-6 flex flex-wrap justify-end gap-3 border-t border-gray-200 pt-6">
      <a class="${BTN_OUTLINE} font-semibold">Cancel</a>
      <button type="button" class="${BTN_PRIMARY} font-semibold">${ic('send')}Add email and send link</button>
    </div>
  </section>
</div></div>`);

const phoneView = () => `

// ---------- States ----------
const states = [
  { id:'add', label:'1 · Add owner', html: addPage(false),
    caption:`<b>Add owner</b> (from the owners list). Back link to the list, title, and a subtitle that says no visit is booked. Three cards: <b>Name and contact</b> (first and last name required; phone and email optional, with plain help under the email), <b>Address</b> (optional; <b>try the dropdowns</b>: Province starts on Marinduque, pick a Town and the Barangay list fills in for that town; “Another province” switches to typed fields), <b>Photo</b> (optional; a big “Choose a photo” button instead of the browser's small file box). One violet button, <b>Add owner</b>, bottom right next to Cancel, with a note that the owner page comes next. The page (back link, title and form) is centered with <code>mx-auto max-w-3xl</code>, so lines stay short at 150% zoom and the form sits in the middle of the wide screen.` },
  { id:'adderr', label:'2 · Add owner with errors', html: addPage(true),
    caption:`<b>After a failed save.</b> A red box at the top says how many things to fix and that nothing is lost. Each problem shows under its field in red text with the warning icon (components/form_field.html), and the field gets a red border. Everything typed is kept, except the photo: browsers can't keep a chosen file after a reload, so the photo must be picked again (the Photo card can say so when the form has errors).` },

const sw = document.getElementById('switcher');
function show(id) {
  const s = states.find(x => x.id === id);
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('caption').innerHTML = s.caption;
  bindAddress();
  [...sw.children].forEach(b => {
    const on = b.dataset.id === id;
    b.className = 'min-h-11 rounded-lg px-4 text-base font-medium ' +
      (on ? 'bg-violet-600 text-white' : 'border border-gray-300 bg-white text-gray-800 hover:bg-gray-50');
  });
}
states.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label;
  b.onclick = () => show(s.id);
  sw.appendChild(b);
});
show('add');
</script>
