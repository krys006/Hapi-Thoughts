<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Sign-in v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { background:#e7e5e4; font-family:"Segoe UI", system-ui, sans-serif; }
  .phone { width:390px; height:844px; overflow-y:auto; position:relative; }
  .phone::-webkit-scrollbar { width:0; }
  .paw-layer { position:absolute; inset:0; pointer-events:none; opacity:.10; color:#fff; }
</style>
</head>
<body class="p-6 text-gray-900 antialiased">

<header class="mx-auto mb-6 max-w-[2550px]">
  <h1 class="text-2xl font-bold">Pet owner sign-in pages v1</h1>
  <p class="mt-1 text-base text-gray-700">Same look as the dashboard: the violet band with the paw trail on top, a white card below. No bottom tabs (not logged in yet). Same field sizes as the admin login. Phone 1 works: tap the eye in the password box.</p>
</header>

<div class="mx-auto flex max-w-[2550px] flex-wrap justify-center gap-8" id="frames"></div>

<script>
// ---------- Trail + icons ----------
const PAW = `<ellipse cx="14" cy="25" rx="5.5" ry="7.5" transform="rotate(-20 14 25)"/><ellipse cx="25.5" cy="14" rx="5.5" ry="7.5" transform="rotate(-6 25.5 14)"/><ellipse cx="38.5" cy="14" rx="5.5" ry="7.5" transform="rotate(6 38.5 14)"/><ellipse cx="50" cy="25" rx="5.5" ry="7.5" transform="rotate(20 50 25)"/><path d="M32 30c-9 0-17 8-17 15 0 6 5 8 9 8 3 0 5-2 8-2s5 2 8 2c4 0 9-2 9-8 0-7-8-15-17-15z"/>`;
const paw = (x, y, s, r) => `<g transform="translate(${x} ${y}) rotate(${r} ${s/2} ${s/2}) scale(${s/64})">${PAW}</g>`;
const steps = Array.from({length: 9}, (_, i) => paw(-10 + i*48, 220 - i*26 + (i % 2 ? -14 : 14), 26, 60)).join('');
const trail = `<svg class="paw-layer" viewBox="0 0 390 300" preserveAspectRatio="xMidYMid slice" fill="currentColor">${steps}</svg>`;

const P = {
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  mail:'<path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
  back:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  circle:'<circle cx="12" cy="12" r="9"/>',
  key:'<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
};
const ic = (n, c='size-5 shrink-0') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Layout ----------
// Full-height column: the violet band (top) and the links area (bottom) share the spare
// height equally, so the card sits in the middle of the screen on any phone. On a short
// phone the spare height shrinks to zero first, and only then does the page scroll.
const shell = (title, sub, card, below='') => `
<div class="flex min-h-full flex-col">
  <div class="relative flex min-h-52 flex-1 basis-0 flex-col items-center justify-center overflow-hidden bg-violet-700 px-6 pb-16 pt-6 text-center text-white">
    ${trail}
    <div class="relative flex flex-col items-center">
      <span class="grid size-14 place-content-center rounded-2xl bg-white/15 ring-1 ring-white/25">${ic('paw','size-8')}</span>
      <p class="mt-2 text-xl font-bold">Hapi Tutz Vet. Supplies</p>
      <p class="text-base text-violet-100">Bognuyan, Gasan, Marinduque</p>
    </div>
  </div>
  <main class="relative -mt-10 shrink-0 px-4">
    <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-md">
      <h1 class="text-2xl font-bold">${title}</h1>
      ${sub ? `<p class="mt-1 text-base text-gray-700">${sub}</p>` : ''}
      <div class="mt-5 space-y-3.5">${card}</div>
    </div>
  </main>
  <div class="flex flex-1 basis-0 flex-col justify-center px-4 py-2">${below}</div>
</div>`;

// ---------- Pieces ----------
const fieldErr = msg => `<p class="mt-1.5 flex items-center gap-1.5 text-base text-red-700">${ic('alert','size-5 shrink-0')}${msg}</p>`;
const input = (label, val='', opts={}) => `
<div>
  <label class="block text-base font-medium text-gray-800">${label}</label>
  <div class="relative mt-1.5">
    ${opts.icon ? `<span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">${ic(opts.icon,'size-5')}</span>` : ''}
    <input value="${val}" placeholder="${opts.ph||''}" type="${opts.type||'text'}" class="block min-h-12 w-full rounded-lg border ${opts.err ? 'border-red-500 ring-2 ring-red-100' : 'border-gray-300'} bg-white ${opts.icon ? 'pl-12' : 'pl-4'} pr-4 text-lg placeholder:text-base placeholder:text-gray-500 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200">
  </div>
  ${opts.err ? fieldErr(opts.err) : ''}${opts.help ? `<p class="mt-1.5 text-base text-gray-600">${opts.help}</p>` : ''}
</div>`;
const password = (label, val, opts={}) => `
<div>
  <div class="flex items-end justify-between"><label class="block text-base font-medium text-gray-800">${label}</label>${opts.forgot ? '<a class="-my-3 inline-flex min-h-11 items-center text-base font-medium text-blue-600">Forgot password?</a>' : ''}</div>
  <div class="relative mt-1.5">
    <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">${ic('lock','size-5')}</span>
    <input type="password" value="${val}" class="pw block min-h-12 w-full rounded-lg border ${opts.err ? 'border-red-500 ring-2 ring-red-100' : 'border-gray-300'} bg-white pl-12 pr-14 text-lg focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200">
    <button type="button" class="show absolute right-0.5 top-1/2 grid size-11 -translate-y-1/2 place-content-center rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900" aria-label="Show password" aria-pressed="false">${ic('eye','size-5')}</button>
  </div>
  ${opts.err ? fieldErr(opts.err) : ''}${opts.extra || ''}
</div>`;
const primary = label => `<button type="button" class="flex min-h-12 w-full items-center justify-center rounded-lg bg-violet-600 px-4 text-lg font-semibold text-white">${label}</button>`;
const orLine = `<div class="flex items-center gap-3 text-base text-gray-600"><span class="h-px flex-1 bg-gray-200"></span>or<span class="h-px flex-1 bg-gray-200"></span></div>`;
// Use Google's official "Sign in with Google" button asset when building; this is a neutral stand-in
const google = label => `<button type="button" class="flex min-h-12 w-full items-center justify-center gap-3 rounded-lg border border-gray-300 bg-white px-4 text-lg font-medium text-gray-800">${ic('globe','size-5')}${label}</button>`;
const alertBox = (tone, title, text) => {
  const t = {red:'border-red-200 bg-red-50 text-red-900', blue:'border-blue-200 bg-blue-50 text-blue-900', green:'border-green-200 bg-green-50 text-green-900'}[tone];
  const icon = tone === 'green' ? 'check' : tone === 'blue' ? 'mail' : 'alert';
  return `<div role="alert" class="flex items-start gap-3 rounded-xl border px-4 py-3 ${t}">${ic(icon,'mt-0.5 size-5 shrink-0')}<div><p class="text-base font-semibold">${title}</p><p class="text-base">${text}</p></div></div>`;
};
const footLink = (q, a) => `<p class="text-center text-base text-gray-700">${q} <a class="inline-flex min-h-11 items-center font-semibold text-blue-600">${a}</a></p>`;
// Remember me (allauth's remember field) and the terms links, both kept from the current pages
const remember = `<label class="flex min-h-11 cursor-pointer items-center gap-3 text-base text-gray-800"><input type="checkbox" class="size-5 rounded accent-violet-600">Keep me logged in on this phone</label>`;
const terms = `<p class="flex items-center justify-center gap-2 text-base text-gray-600"><a class="inline-flex min-h-11 items-center">Terms</a><span aria-hidden="true">·</span><a class="inline-flex min-h-11 items-center">Privacy Policy</a></p>`;

// Password rules checklist (live in real build; static here)
const rule = (ok, t) => `<li class="flex items-center gap-2 ${ok ? 'text-green-700' : 'text-gray-600'}">${ic(ok ? 'check' : 'circle','size-4')}${t}</li>`;
const rules = (a,b,c) => `<ul class="mt-2 space-y-1 text-base">${rule(a,'At least 8 characters')}${rule(b,'Not only numbers')}${rule(c,'Not too common (like "password123")')}</ul>`;

// ---------- Screens ----------
const loginBody = (top='') =>
  top +
  input('Email address','krysbesana@gmail.com',{type:'email', icon:'mail'}) +
  password('Password','secretpass',{forgot:true}) +
  remember + primary('Log in') + orLine + google('Continue with Google');
const login = shell('Welcome back', 'Log in to see your pets, visits and bills.', loginBody(), footLink('New here?','Create an account'));
const loggedOut = shell('Welcome back', '', loginBody(`<div role="status" class="flex items-center gap-2 rounded-xl border border-green-200 bg-green-50 px-4 py-2.5 text-base font-semibold text-green-900">${ic('check','size-5')}You're logged out.</div>`), footLink('New here?','Create an account'));

const loginErr = shell('Welcome back', '',
  alertBox('red','That email and password don\'t match','Check for typos, or tap "Forgot password?" to make a new one.') +
  input('Email address','krysbesana@gmail.com',{type:'email', icon:'mail'}) +
  password('Password','wrongpass',{forgot:true}) +
  primary('Log in') + orLine + google('Continue with Google'),
  footLink('New here?','Create an account'));

const loginUnverified = shell('Welcome back', '',
  alertBox('blue','Please confirm your email first','We sent a link to krysbesana@gmail.com when you signed up. Open it, then log in here.') +
  `<button type="button" class="flex min-h-12 w-full items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white text-base font-semibold text-gray-800">${ic('mail','size-5')}Send the link again</button>` +
  input('Email address','krysbesana@gmail.com',{type:'email', icon:'mail'}) +
  password('Password','secretpass',{forgot:true}) +
  primary('Log in'),
  '');

const register = shell('Create an account', 'For pet owners of Hapi Tutz. It\'s free.',
  google('Sign up with Google') + orLine +
  input('Email address','krys@email',{type:'email', icon:'mail', err:'Please type a full email, like name@gmail.com.'}) +
  password('Password','1234',{err:'Your password is too short.', extra: rules(false,false,true)}) +
  password('Type the password again','1234') +
  `<p class="text-center text-base text-gray-600">By creating an account, you agree to our <a class="font-medium text-blue-600 underline underline-offset-2">Terms</a> and <a class="font-medium text-blue-600 underline underline-offset-2">Privacy Policy</a>.</p>` +
  primary('Create account'),
  footLink('Already have an account?','Log in') + terms);

const checkEmail = shell('Check your email', '',
  `<div class="flex flex-col items-center text-center">
     <span class="grid size-20 place-content-center rounded-full bg-violet-50 text-violet-600 ring-1 ring-violet-200">${ic('mail','size-10')}</span>
     <p class="mt-4 text-base text-gray-700">We sent a link to</p>
     <p class="text-lg font-bold">krysbesana@gmail.com</p>
     <p class="mt-3 text-base text-gray-700">Open the email and tap the link to turn on your account. It may take a minute. Check Spam too.</p>
   </div>` +
  `<button type="button" class="flex min-h-12 w-full items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white text-base font-semibold text-gray-800">${ic('mail','size-5')}Send the link again</button>`,
  footLink('Wrong email?','Sign up again'));

const forgot = shell('Forgot your password?', 'Type your email and we\'ll send you a link to make a new one.',
  input('Email address','krysbesana@gmail.com',{type:'email', icon:'mail'}) + primary('Send me a link'),
  `<p class="mt-6 text-center"><a class="inline-flex min-h-11 items-center gap-1.5 text-base font-medium text-blue-600">${ic('back','size-5')}Back to log in</a></p>`);

const newPass = shell('Make a new password', 'For krysbesana@gmail.com',
  password('New password','Browny2026!',{extra: rules(true,true,true)}) +
  password('Type it again','Browny2026!') + primary('Save new password'),
  '');

const passDone = shell('Password changed', '',
  `<div class="flex flex-col items-center text-center">
     <span class="grid size-20 place-content-center rounded-full bg-green-50 text-green-700 ring-1 ring-green-200">${ic('check','size-10')}</span>
     <p class="mt-4 text-base text-gray-700">You can now log in with your new password.</p>
   </div>` + primary('Go to log in'),
  '');

// ---------- Frames ----------
const frame = (lbl, note, body, id='') => `
<figure class="flex flex-col items-center">
  <figcaption class="mb-3 w-[390px]"><p class="text-lg font-bold">${lbl}</p><p class="text-base text-gray-700">${note}</p></figcaption>
  <div ${id ? `id="${id}"` : ''} class="phone rounded-[2rem] bg-gray-50 shadow-xl ring-8 ring-gray-900">${body}</div>
</figure>`;

document.getElementById('frames').innerHTML =
  frame('1 · Log in (try the eye)', 'Icons inside the fields and the eye button inside the password box, like your current page. Keep me logged in, Google below an "or". The card sits in the middle of the screen.', login, 'live') +
  frame('1a · Just logged out', 'Your current "You have been logged out" message, as a green note.', loggedOut) +
  frame('1b · Wrong email or password', 'One plain message on top. Doesn\'t say which one was wrong (safer).', loginErr) +
  frame('1c · Email not confirmed yet', 'Blue, not red: nothing is broken. Lets them resend the link.', loginUnverified) +
  frame('2 · Create an account', 'Google first (fastest). Errors in red under each field. Password rules tick green as they type.', register) +
  frame('3 · Check your email', 'After signing up. Shows the address they typed, mentions Spam, and offers a resend.', checkEmail) +
  frame('4 · Forgot password', 'One field, one button, a way back.', forgot) +
  frame('5 · Make a new password', 'Opened from the email link. Same eye button and rules list as sign-up.', newPass) +
  frame('6 · Password changed', 'Clear success, straight to log in.', passDone);

// ---------- Show / Hide password in phone 1 ----------
document.querySelectorAll('#live .show').forEach(b => b.addEventListener('click', () => {
  const inp = b.parentElement.querySelector('.pw'), hidden = inp.type === 'password';
  inp.type = hidden ? 'text' : 'password';
  b.innerHTML = ic(hidden ? 'eyeOff' : 'eye','size-5');
  b.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  b.setAttribute('aria-pressed', hidden);
}));
</script>
</body>
</html>
