<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Pet and Shared v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { background:#e7e5e4; font-family:"Segoe UI", system-ui, sans-serif; }
  .phone { width:390px; height:844px; overflow-y:auto; position:relative; }
  .phone::-webkit-scrollbar { width:0; }
</style>
</head>
<body class="p-6 text-gray-900 antialiased">

<header class="mx-auto mb-6 max-w-[2550px]">
  <h1 class="text-2xl font-bold">Edit pet, flash messages and error pages v1</h1>
  <p class="mt-1 text-base text-gray-700">The last owner-side pieces. Edit pet reuses the Add a pet fields; the clinic-only fields are shown but locked. Flash messages sit under the top bar and stay until closed (CONVENTIONS). Phone 3 works: close a message.</p>
</header>

<div class="mx-auto flex max-w-[2550px] flex-wrap justify-center gap-8" id="frames"></div>

<script>
// ---------- Icons (Lucide shapes, mockup only) ----------
const P = {
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  back:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkCircle:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  xCircle:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  camera:'<path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  phone:'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  search:'<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
};
const ic = (n, c='size-5 shrink-0') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const thin = (n, c) => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- Shell ----------
const bar = `
<div class="sticky top-0 z-20 flex h-16 shrink-0 items-center justify-between border-b border-gray-200 bg-white px-4">
  <div class="flex items-center gap-2.5"><span class="grid size-9 place-content-center rounded-xl bg-violet-600 text-white">${ic('paw','size-5')}</span><span class="text-lg font-bold">Hapi Tutz</span></div>
  <button class="relative grid size-11 place-content-center rounded-full" aria-label="Notifications">${ic('bell','size-6')}</button>
</div>`;
const backBar = to => `
<div class="sticky top-0 z-20 flex h-16 shrink-0 items-center border-b border-gray-200 bg-white px-2">
  <a class="inline-flex min-h-11 items-center gap-1.5 rounded-lg px-2 text-base font-medium text-gray-800 hover:bg-gray-100">${ic('back','size-6')}${to}</a>
</div>`;
const tabs = (active='') => `
<nav class="sticky bottom-0 z-10 mt-auto grid shrink-0 grid-cols-5 border-t border-gray-200 bg-white pb-2">
  ${[['house','Home'],['paw','Pets'],['calendar','Visits'],['receipt','Bills'],['user','Account']].map(([i,l]) =>
    `<a class="flex min-h-14 flex-col items-center justify-center gap-0.5 pt-2 text-sm font-medium ${l===active ? 'text-violet-700' : 'text-gray-600'}">
      ${ic(i,'size-6')}${l}<span class="mt-0.5 h-1 w-6 rounded-full ${l===active ? 'bg-violet-600' : ''}"></span></a>`).join('')}
</nav>`;
const page = (head, inner, foot) => `<div class="relative flex min-h-full flex-col">${head}${inner}${foot}</div>`;
// Save button rides in one sticky footer with the tabs (same as My details)
const withSave = (label, active) => `
<div class="sticky bottom-0 z-10 mt-auto">
  <div class="border-t border-gray-200 bg-white px-4 py-3"><button type="button" class="flex min-h-14 w-full items-center justify-center gap-2 rounded-2xl bg-violet-600 text-lg font-semibold text-white shadow-sm">${ic('check','size-5')}${label}</button></div>
  ${tabs(active)}
</div>`;

// ---------- Flash message ----------
// One component for every page: sits under the top bar, stays until closed, colour + icon + words.
const tones = {
  success:['border-green-200 bg-green-50 text-green-900','checkCircle'],
  info:['border-blue-200 bg-blue-50 text-blue-900','info'],
  warning:['border-orange-300 bg-orange-50 text-orange-900','alert'],
  error:['border-red-200 bg-red-50 text-red-900','xCircle'],
};
const flash = (tone, text) => {
  const [cls, icon] = tones[tone];
  return `<div role="${tone==='error' ? 'alert' : 'status'}" class="flash flex items-start gap-3 rounded-xl border px-4 py-3 ${cls}">
    ${ic(icon,'mt-0.5 size-5 shrink-0')}<p class="flex-1 text-base">${text}</p>
    <button type="button" class="close -my-2 -mr-2 grid size-11 shrink-0 place-content-center rounded-lg hover:bg-black/5" aria-label="Close message">${ic('x','size-5')}</button>
  </div>`;
};

// ---------- 1 · Edit pet ----------
const label = (t, forId='') => `<label ${forId ? `for="${forId}"` : ''} class="block text-base font-semibold text-gray-900">${t}</label>`;
const input = (id, val, ph='') => `<input id="${id}" value="${val}" placeholder="${ph}" class="mt-1.5 block min-h-12 w-full rounded-xl border border-gray-300 bg-white px-4 text-base placeholder:text-gray-500 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200">`;
const locked = (t, v) => `<div class="flex items-center justify-between gap-4 py-3"><dt class="text-base text-gray-600">${t}</dt><dd class="flex items-center gap-2 text-base font-semibold text-gray-700">${v}${ic('lock','size-4 text-gray-400')}</dd></div>`;

const editPet = page(backBar('Browny'), `
<main class="flex-1 space-y-5 px-4 py-5">
  <h1 class="text-2xl font-bold">Edit Browny's details</h1>
  <div class="flex items-center gap-4">
    <span class="grid size-24 shrink-0 place-content-center rounded-2xl bg-gradient-to-br from-amber-200 to-amber-500 text-white ring-1 ring-black/10" role="img" aria-label="Photo of Browny">${ic('image','size-8')}</span>
    <div class="space-y-2">
      <a class="inline-flex min-h-11 items-center gap-2 rounded-xl border border-gray-300 bg-white px-4 text-base font-medium text-gray-800">${ic('camera','size-5')}Change photo</a>
      <a class="flex min-h-11 items-center text-base font-medium text-red-700">Remove photo</a>
    </div>
  </div>
  <section class="space-y-4 rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
    <h2 class="text-lg font-bold">You can change these</h2>
    <div>${label('Pet\'s name','nm')}${input('nm','Browny')}</div>
    <div>${label('Breed','br')}
      <select id="br" class="mt-1.5 block min-h-12 w-full rounded-xl border border-gray-300 bg-white px-4 text-base"><option selected>Aspin</option><option>Shih Tzu</option><option>Labrador</option><option>Mixed / not sure</option><option>Other (type it)</option></select></div>
    <div>${label('Color <span class="font-normal text-gray-600">(optional)</span>','co')}${input('co','Brown and white')}</div>
    <div>${label('Weight in kg <span class="font-normal text-gray-600">(optional)</span>','wt')}${input('wt','12.5')}
      <p class="mt-1.5 text-base text-gray-600">The clinic also weighs Browny at each visit.</p></div>
  </section>
  <section class="rounded-2xl border border-gray-200 bg-gray-50 px-4 pb-2 pt-4">
    <h2 class="text-lg font-bold">Only the clinic can change these</h2>
    <p class="text-base text-gray-600">Something wrong here? Tell the clinic at your next visit or call 0954 288 9774.</p>
    <dl class="mt-1 divide-y divide-gray-200">
      ${locked('Species','Dog')}${locked('Male or female','Male')}${locked('Birthday','Jun 15, 2022')}${locked('Registration no.','None')}
    </dl>
  </section>
</main>`, withSave('Save changes','Pets'));

// ---------- 2 · Back on the profile after saving ----------
const savedProfile = page(backBar('My Pets'), `
<main class="flex-1 space-y-5 px-4 py-5">
  ${flash('success','<b>Browny\'s details were saved.</b>')}
  <section class="flex flex-col items-center text-center">
    <span class="grid size-36 place-content-center rounded-3xl bg-gradient-to-br from-amber-200 to-amber-500 text-white shadow-sm ring-1 ring-black/10">${ic('image','size-10')}</span>
    <h1 class="mt-4 text-3xl font-bold">Browny</h1><p class="text-lg text-gray-700">Dog · Aspin</p>
  </section>
  <a class="flex min-h-14 w-full items-center justify-center gap-2 rounded-2xl bg-violet-600 text-lg font-semibold text-white shadow-sm">${ic('plus','size-6')}Book a visit for Browny</a>
  <p class="text-center text-base text-gray-500">… the rest of the pet profile</p>
</main>`, tabs('Pets'));

// ---------- 3 · All flash types ----------
const flashSheet = page(bar, `
<main class="flex-1 space-y-3 px-4 py-5">
  <h1 class="text-2xl font-bold">Message types</h1>
  <p class="text-base text-gray-700">Every page uses the same message box. Tap ✕ to close one.</p>
  ${flash('success','<b>Visit request sent.</b> The clinic will confirm it soon.')}
  ${flash('info','<b>Your visit was moved</b> to Tue, Nov 10 at 12:00 PM.')}
  ${flash('warning','<b>That time was just taken.</b> Please pick another one.')}
  ${flash('error','<b>We couldn\'t save your changes.</b> Please check your internet and try again.')}
  <div class="rounded-xl border border-dashed border-gray-300 bg-white p-4 text-base text-gray-700">
    <p class="font-semibold text-gray-900">Rules</p>
    <ul class="mt-1 list-disc space-y-1 pl-5">
      <li>Stays until closed (no auto-hide), as in CONVENTIONS.</li>
      <li>Always under the top bar, above the page title.</li>
      <li>Colour, icon <b>and</b> words: never colour alone.</li>
      <li>First words in bold say what happened.</li>
    </ul>
  </div>
</main>`, tabs('Home'));

// ---------- Error pages ----------
const errorPage = (icon, tone, code, title, text, primaryLbl, primaryIcon, secondary) => page(bar, `
<main class="flex flex-1 flex-col items-center justify-center px-6 py-10 text-center">
  <span class="grid size-24 place-content-center rounded-full ${tone}">${thin(icon,'size-12')}</span>
  <p class="mt-5 text-base font-semibold text-gray-500">${code}</p>
  <h1 class="mt-1 text-2xl font-bold">${title}</h1>
  <p class="mt-2 text-base text-gray-700">${text}</p>
  <a class="mt-6 flex min-h-14 w-full items-center justify-center gap-2 rounded-2xl bg-violet-600 text-lg font-semibold text-white shadow-sm">${ic(primaryIcon,'size-5')}${primaryLbl}</a>
  ${secondary}
</main>`, tabs());

const p404 = errorPage('search','bg-gray-100 text-gray-500','Error 404','We can\'t find that page',
  'The link may be old, or the page was moved. Let\'s get you back home.',
  'Go to my home page','house', `<a class="mt-2 flex min-h-12 w-full items-center justify-center gap-2 rounded-2xl text-lg font-medium text-gray-700">${ic('back','size-5')}Go back</a>`);

const p500 = errorPage('alert','bg-orange-50 text-orange-700','Error 500','Something went wrong on our side',
  'It\'s not your fault. Please try again in a minute. If it keeps happening, call the clinic at 0954 288 9774.',
  'Try again','refresh', `<a class="mt-2 flex min-h-12 w-full items-center justify-center gap-2 rounded-2xl text-lg font-medium text-gray-700">${ic('house','size-5')}Go to my home page</a>`);

const p403 = errorPage('lock','bg-gray-100 text-gray-500','Error 403','This page isn\'t for your account',
  'It may be a page for clinic staff, or for another owner\'s pet.',
  'Go to my home page','house','');

// ---------- Frames ----------
const frame = (lbl, note, body, id='') => `
<figure class="flex flex-col items-center">
  <figcaption class="mb-3 w-[390px]"><p class="text-lg font-bold">${lbl}</p><p class="text-base text-gray-700">${note}</p></figcaption>
  <div ${id ? `id="${id}"` : ''} class="phone rounded-[2rem] bg-gray-50 shadow-xl ring-8 ring-gray-900">${body}</div>
</figure>`;

document.getElementById('frames').innerHTML =
  frame('1 · Edit pet', 'Name, breed, color, weight and photo can be changed (FEATURES 2.3). Species, sex, birthday and registration no. are shown with a lock and a "call the clinic" note.', editPet) +
  frame('2 · After saving', 'Back on the pet profile with a green "saved" message under the top bar.', savedProfile) +
  frame('3 · Flash messages (try ✕)', 'The four message types every page uses, with the rules for them.', flashSheet, 'live') +
  frame('4 · 404 Not found', 'Plain words, no blame, one way home. Logged-in pages keep the bar and tabs.', p404) +
  frame('5 · 500 Server error', '"It\'s not your fault", Try again, and the clinic\'s number if it keeps happening.', p500) +
  frame('6 · 403 Not allowed', 'For an owner who opens a staff page or someone else\'s pet. Same style, no technical words.', p403);

// ---------- Close buttons in phone 3 ----------
document.querySelectorAll('#live .close').forEach(b => b.addEventListener('click', () => b.closest('.flash').remove()));
</script>
</body>
</html>
